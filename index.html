                  {f.rentPct
                    ? <div className="input" style={{padding:"5px 9px",flex:1,marginBottom:0,color:"#16A34A",fontSize:12}}>{finConfigured.status!=="ready"?"—":finConfigured.rentFixedText!==null?finConfigured.rentFixedText:finConfigured.rentPctText!==null?`${finConfigured.rentPctText} ממחזור`:"—"}</div>
                    : f.royaltyPct
                    ? <div className="input" style={{padding:"5px 9px",flex:1,marginBottom:0,color:"#6B7280",fontSize:12}}>{finConfigured.status==="ready"&&finConfigured.royaltyText!==null?`${finConfigured.royaltyText} ממחזור`:"—"}</div>
                    : <input className="input" style={{padding:"5px 9px",flex:1,marginBottom:0}} type="number" inputMode="decimal" placeholder="₪" value={f.amount||""}
                        onChange={e=>{const u=fixedList.map((x,j)=>j===i?{...x,amount:Number(e.target.value)}:x);setFixedList(u);persistFixed(u,captureSelectionCtx());}}/>
                  }
                  <div style={{display:"flex",alignItems:"center",gap:4,flexShrink:0}}>
                    <span style={{color:"#9CA3AF",fontSize:11}}>יום</span>
                    <input className="input" style={{padding:"5px 7px",width:44,marginBottom:0,textAlign:"center",fontSize:12}} type="number" min={1} max={31} value={f.dueDay}
                      onChange={e=>{const u=fixedList.map((x,j)=>j===i?{...x,dueDay:Number(e.target.value)}:x);setFixedList(u);persistFixed(u,captureSelectionCtx());}}/>
                  </div>
                </div>
              </div>
            ))}
            <button style={{...S.cancelBtn,width:"100%",marginTop:4,textAlign:"center"}}
              onClick={()=>{const u=[...fixedList,{id:Date.now(),name:"הוצאה חדשה",amount:0,dueDay:1,rentPct:false}];setFixedList(u);persistFixed(u,captureSelectionCtx());}}>
              + הוסף הוצאה
            </button>
          </div>
        </div>
      )}

      {/* ═══ ADMIN PANEL (super_owner only) ═══ */}
      {screen==="admin" && loggedInUser?.role==="super_owner" && (
        <AdminPanel apiFetch={window.apiFetch} loggedInUser={loggedInUser}/>
      )}

      {/* ═══ DEMO BANNER ═══ */}
      {isDemoMode && screen!=="connect" && (
        <div className="demo-banner">
          <span>מצב דמו</span>
          הנתונים הם לדוגמה בלבד ·
          <button onClick={()=>setDemoModal('main')}
            style={{background:"rgba(255,255,255,.2)",border:"none",color:"#fff",padding:"2px 10px",
              borderRadius:999,fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit",marginRight:10}}>
            חבר את העסק שלי
          </button>
        </div>
      )}

      {/* ═══ DEMO CONNECT SCREEN ═══ */}
      {isDemoMode && screen==="connect" && (
        <div className="connect-screen">
          <div className="connect-hero">
            <div style={{width:56,height:56,background:"linear-gradient(135deg,#6366F1,#818CF8)",
              borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center",
              margin:"0 auto 16px",boxShadow:"0 8px 24px rgba(99,102,241,.3)"}}>
              <svg width="28" height="28" fill="none" stroke="white" strokeWidth="2" viewBox="0 0 24 24">
                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
              </svg>
            </div>
            <h1 style={{fontSize:22,fontWeight:800,color:"#0F172A",letterSpacing:"-.5px",marginBottom:8}}>
              חיבור המערכת לעסק שלך
            </h1>
            <p style={{fontSize:14,color:"#64748B",lineHeight:1.7}}>
              תהליך פשוט של 15 דקות — ואתה מתחיל לראות נתונים אמיתיים
            </p>
          </div>

          {[
            {n:1, title:"שיחת היכרות", desc:"נבין את מבנה העסק שלך — ספקים, עובדים, הוצאות"},
            {n:2, title:"הגדרת ספקים",  desc:"נוסיף את הספקים שלך עם ימי אספקה ויעדי עלות"},
            {n:3, title:"הזנת יעדים",   desc:"נגדיר יעדי מחזור ופוד קוסט לפי הסטנדרט שלך"},
            {n:4, title:"ולך!",          desc:"מהיום אתה רואה את הכסף אמיתי בכל יום"},
          ].map(step=>(
            <div key={step.n} className="connect-step">
              <div className="connect-icon">
                <span style={{fontSize:15,fontWeight:800,color:"#6366F1"}}>{step.n}</span>
              </div>
              <div>
                <div style={{fontSize:14,fontWeight:700,color:"#0F172A",marginBottom:3}}>{step.title}</div>
                <div style={{fontSize:13,color:"#64748B",lineHeight:1.5}}>{step.desc}</div>
              </div>
            </div>
          ))}

          <div style={{marginTop:32,display:"flex",flexDirection:"column",gap:10}}>
            <button onClick={()=>setScreen("dashboard")}
              style={{padding:"12px",background:"none",border:"1px solid #E2E8F0",
                borderRadius:14,color:"#64748B",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>
              ← חזרה לדמו
            </button>
          </div>
        </div>
      )}

      {/* ═══ CONVERSION MODALS ═══ */}
      {(demoModal==='main' || demoModal==='smart') && (
        <div className="conv-modal" onClick={()=>setDemoModal(null)}>
          <div className="conv-sheet" onClick={e=>e.stopPropagation()}>
            {demoModal==='smart' ? (<>
              <div style={{fontSize:32,marginBottom:12}}>🔍</div>
              <h2 className="conv-title">רוצה להבין מאיפה מגיעה החריגה אצלך?</h2>
              <p className="conv-body">
                ב-Marjin תראה בדיוק איזה ספק חרג, באיזה יום, ובכמה — עם התראות אוטומטיות לפני שזה גדל.
              </p>
            </>) : (<>
              <div style={{fontSize:32,marginBottom:12}}>👀</div>
              <h2 className="conv-title">רוצה לראות את העסק שלך ככה?</h2>
              <p className="conv-body">
                המערכת יכולה להתחבר לנתונים האמיתיים שלך ולהציג פוד קוסט, לייבור ותחזית — כל יום, בזמן אמת.
              </p>
            </>)}
            <button className="conv-btn-main" onClick={()=>{ setDemoModal(null); setScreen("connect"); }}>
              חבר את העסק שלי →
            </button>
            <button className="conv-btn-skip" onClick={()=>setDemoModal(null)}>המשך בדמו</button>
          </div>
        </div>
      )}
      {/* ═══ AI — Floating Button + Panel ═══ */}
      {/* FAB */}
      <button className="ai-fab" onClick={()=>setAiOpen(o=>!o)} title="שאל את Marjin AI">
        <div className={`ai-fab-dot${aiAnswer&&!aiAnswer.loading?" show":""}`}/>
        {aiOpen
          ? <svg width="18" height="18" fill="none" stroke="white" strokeWidth="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          : <svg width="18" height="18" fill="none" stroke="white" strokeWidth="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        }
      </button>

      {/* Panel */}
      <div className={`ai-panel${aiOpen?" open":" closed"}`}>
        <div className="ai-panel-head">
          <div className="ai-panel-title">
            <div className="ai-panel-dot"/>
            Marjin AI
          </div>
          <button className="ai-panel-close" onClick={()=>setAiOpen(false)}>×</button>
        </div>
        <div className="ai-panel-body">
          {aiAnswer && (
            <div className="ai-answer">
              <div className="ai-answer-label">
                {aiAnswer.loading && <div className="ai-answer-dot"/>}
                {aiAnswer.loading ? "חושב..." : "תשובה"}
              </div>
              {aiAnswer.loading
                ? <div className="ai-loading"><div className="ai-dot"/><div className="ai-dot"/><div className="ai-dot"/></div>
                : <div style={{whiteSpace:"pre-wrap"}}>{aiAnswer.text}</div>
              }
            </div>
          )}
          {!aiAnswer && (
            <div className="ai-chips">
              {["מה מצב הפוד קוסט שלי?","מה הממוצע היומי השבוע?","באיזה יום מרוויחים הכי הרבה?","מה התחזית לסוף החודש?","איזה ספק הכי יקר?"].map(chip=>(
                <button key={chip} className="ai-chip" onClick={()=>{ sendAI(chip); }}>{chip}</button>
              ))}
            </div>
          )}
          <div className="ai-bar-input">
            <input
              className="ai-input"
              placeholder="שאל שאלה על העסק..."
              value={aiQuery}
              onChange={e=>setAiQuery(e.target.value)}
              onKeyDown={e=>{ if(e.key==="Enter") sendAI(aiQuery); }}
            />
            <button
              className="ai-send"
              disabled={aiLoading||!aiQuery.trim()}
              onClick={()=>sendAI(aiQuery)}>
              {aiLoading
                ? <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" style={{animation:"spin 1s linear infinite"}}><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/></svg>
                : <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              }
            </button>
          </div>
        </div>
      </div>

    </div>
  );
}


// ─── Employees Screen ─────────────────────────────────────────────────────────
function EmployeesScreen({ businessConfig, saveBusinessConfig, entries, submitLaborEntry, finView, finSrc, finCoreState, todayStr, requestFinanceFrom }) {
  const employees = businessConfig.employees || [];
  const ROLES_EMP = ["מנהל משמרת","טבח","עוזר טבח","מלצר","ברמן","קופאי","כלים","ניקיון","אחר"];
  // Management list (operational): every configured global employee, including ones whose
  // amount is missing or invalid — the core reports those, it never treats them as ₪0.
  const globalEmps = employees.filter(e=>e && e.type==="global");

  // לוח חודשי
  const [empMonth, setEmpMonth] = useState((todayStr || `${YEAR}-${MONTH_STR}-01`).slice(0, 7));
  const [emY, emM] = empMonth.split("-").map(Number);
  const emDays = new Date(emY, emM, 0).getDate();
  const emLabel = new Date(emY, emM-1, 1).toLocaleDateString("he-IL",{month:"long",year:"numeric"});
  const prevMonth = () => { const d=new Date(emY,emM-2,1); setEmpMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`); };
  const nextMonth = () => { const d=new Date(emY,emM,1); setEmpMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`); };
  const canNext = !!todayStr && empMonth < todayStr.slice(0, 7);
  // C1 (M-01…M-07): the selected month's labor from the shared core — month employer cost and
  // %, the closure-aware placement of the monthly employer cost per date, completed days vs
  // expected ("צפוי") days. No division by the calendar month here.
  const ev = React.useMemo(() => (typeof finView === "function" ? finView((F, S) => window.MarjinC1.employees(F, S, empMonth)) : { status: "unavailable" }), [finSrc, finCoreState, empMonth]);
  useEffect(() => { if (ev && ev.status === "loading" && ev.reason === "ledger_range" && typeof requestFinanceFrom === "function") requestFinanceFrom(empMonth + "-01"); }, [ev, empMonth]);
  const evDay = new Map(ev.status === "ready" ? ev.days.map(d => [d.date, d]) : []);

  const getDailyLabor = (date) => {
    const e = entries.find(x=>x.date===date);
    return e?.payroll||"";
  };
  // R6: employee daily-labor is an ENTRIES transform routed through the ONE shared
  // destination lane (submitLaborEntry). It upserts payroll onto the latest desired
  // canonical rows, never writes fixed, and cannot overlap another entries writer.
  // R10-GATE-014 (L-GAP-1): the typed outcome is CONSUMED, not discarded. Every
  // non-commit result reaches the operator through the same production mapper the
  // dashboard uses; a commit clears the banner. Silence is never success: the input
  // renders from stored `entries`, so a refused write leaves the stored value on
  // screen and the banner explains why.
  const [laborSaveError, setLaborSaveError] = useState("");
  const setDailyLabor = async (date, val) => {
    if (typeof submitLaborEntry !== "function") return undefined;
    const res = await submitLaborEntry(date, val);
    const st = res && res.status;
    // A selection change is neither an error nor a success — it stays silent and
    // leaves any existing banner alone, exactly as the delete call site does.
    if (st === "stale" || st === "cancelled_selection_changed") return res;
    if (st === "committed" || st === "committed_idempotent") { setLaborSaveError(""); return res; }
    setLaborSaveError(window.MarjinSaveLifecycle.describeSaveOutcome(res || "failed", false));
    return res;
  };


  // ניהול עובדים גלובליים
  const [showGlobal, setShowGlobal] = useState(false);
  const [adding, setAdding] = useState(false);
  const [editId, setEditId] = useState(null);
  const [form, setForm] = useState({name:"",role:"מלצר",type:"global",monthlySalary:""});
  const inp = {width:"100%",border:"1px solid #D1D5DB",borderRadius:10,padding:"10px 12px",fontSize:14,fontFamily:"inherit",color:"#111827",background:"#FFFFFF",marginBottom:10,boxSizing:"border-box"};

  const saveEmp = () => {
    if(!form.name.trim()) return;
    const updated = editId!==null
      ? employees.map(e=>e.id===editId?{...e,...form}:e)
      : [...employees, {...form, id:Date.now(), type:"global"}];
    saveBusinessConfig({...businessConfig, employees:updated});
    setAdding(false); setEditId(null); setForm({name:"",role:"מלצר",type:"global",monthlySalary:""});
  };
  const removeEmp = id => saveBusinessConfig({...businessConfig, employees:employees.filter(e=>e.id!==id)});
  const startEdit = emp => { setForm({name:emp.name,role:emp.role,type:"global",monthlySalary:emp.monthlySalary||""}); setEditId(emp.id); setAdding(true); setShowGlobal(true); };


  return (
    <div>
      {/* כותרת + ניווט חודש */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,background:"#FFFFFF",borderRadius:8,padding:"10px 16px",border:"1px solid #E5E7EB"}}>
        <button onClick={prevMonth} style={{background:"none",border:"none",fontSize:22,cursor:"pointer",color:"#6B7280",padding:"0 8px"}}>‹</button>
        <div style={{textAlign:"center"}}>
          <div style={{fontWeight:700,color:"#111827",fontSize:15}}>{emLabel}</div>
          <div style={{fontSize:12,color:"#9CA3AF",marginTop:1}}>
                    <span data-c1="emp-month-total" title={ev.status==="ready"?ev.meaning:""}>סה״כ עלות מעסיק (בפועל עד אתמול): {ev.status==="ready" ? ev.monthTotal.text : "—"}</span>
                    {ev.status==="ready"&&ev.monthPct!=="—"&&<span data-c1="emp-month-pct" style={{marginRight:6,color:"#6366F1",fontWeight:600}}> · {ev.monthPct}</span>}
                  </div>
        </div>
        <button onClick={nextMonth} disabled={!canNext} style={{background:"none",border:"none",fontSize:22,cursor:"pointer",color:canNext?"#6B7280":"#D1D5DB",padding:"0 8px"}}>›</button>
      </div>

      {/* עובדים גלובליים — אוטומטי */}
      {globalEmps.length>0 && (
        <div style={{background:"#F9FAFB",border:"1px solid #E5E7EB",borderRadius:8,padding:"10px 14px",marginBottom:12}}>
          <div data-c1="emp-global-day" style={{fontSize:11,color:"#16A34A",fontWeight:700,marginBottom:6,letterSpacing:1}}>עובדים גלובליים — {ev.status==="ready" ? ev.globalPerDay.text : "—"} ליום (משובץ אוטומטית לפי ימי לוח השנה)</div>
          {globalEmps.map(emp=>{
            const g = ev.status==="ready" ? ev.globalEmployees.find(x=>String(x.key)===String(emp.id)) : null;
            return (
            <div key={emp.id} style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:2}}>
              <span style={{color:"#6B7280"}}>{emp.name} <span style={{color:"#9CA3AF",fontSize:11}}>{emp.role}</span></span>
              <span style={{fontWeight:700,color:"#6B7280"}}>{g ? `${g.monthlyText} / חודש` : (ev.status==="ready" ? "סכום חסר או לא תקין" : "—")}</span>
            </div>
            );
          })}
        </div>
      )}

      {/* R10-GATE-014 (L-GAP-1): operator-facing surface for a refused labor write. */}
      {laborSaveError && <div data-testid="labor-save-error" style={{background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:6,padding:"10px 14px",textAlign:"center",fontWeight:600,color:"#B91C1C",fontSize:13,marginBottom:8}}>{laborSaveError}</div>}

      {/* לוח הזנה יומית */}
      <div style={{background:"#FFFFFF",border:"1px solid #E5E7EB",borderRadius:8,overflow:"hidden",marginBottom:12}}>
        <div style={{padding:"12px 16px",borderBottom:"1px solid #F1F5F9",fontSize:13,fontWeight:700,color:"#6B7280"}}>
          עלות כ״א יומית (מתוכנת נוכחות) · סה״כ ליום = עלות שעתיים + חלק גלובלי
        </div>
        {Array.from({length:emDays},(_,i)=>{
          const day=i+1;
          const date=`${emY}-${String(emM).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
          const dow=new Date(emY,emM-1,day).getDay();
          const val=getDailyLabor(date);
          const hasVal=val!==""&&val!==null&&val!==undefined;
          const dayVm = evDay.get(date) || null;
          const dayRows = entries.filter(x=>x && x.date===date).length;
          return (
            <div key={date} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 16px",borderBottom:"1px solid #F9FAFB",background:dow===6?"#FAFAFA":"#FFFFFF"}}>
              <div style={{minWidth:80}}>
                <div style={{fontSize:13,fontWeight:600,color:dow===6?"#9CA3AF":"#111827"}}>{DOW_NAMES[dow]} {day}/{emM}</div>
              </div>
              <input type="number" inputMode="numeric" placeholder="₪ נוכחות"
                value={hasVal?val:""}
                onChange={e=>setDailyLabor(date,e.target.value)}
                style={{flex:1,border:"1px solid #D1D5DB",borderRadius:6,padding:"7px 10px",fontSize:13,fontFamily:"inherit",color:"#111827",background:"#FFFFFF",outline:"none"}}/>
              {dayRows>1 && <span data-c1="dup-rows" title="בתאריך זה נשמרו כמה שורות; השדה מציג ועורך את הראשונה, הסה״כ כולל את כולן" style={{fontSize:9,fontWeight:700,color:"#7C3AED",background:"#F5F3FF",border:"1px solid #DDD6FE",borderRadius:99,padding:"1px 6px",flexShrink:0}}>({dayRows} שורות)</span>}
              {dayVm && (
                <div data-c1="emp-day" style={{textAlign:"left",flexShrink:0}}>
                <div style={{fontSize:12,fontWeight:700,color:dayVm.expected?"#94A3B8":"#374151"}}>{dayVm.totalText}{dayVm.expected?" · צפוי":""}</div>
                {dayVm.pctText&&<div style={{fontSize:10,color:"#94A3B8",marginTop:1}}>{dayVm.pctText}</div>}
              </div>
              )}
            </div>
          );
        })}
      </div>

      {/* ניהול עובדים גלובליים */}
      <div style={{background:"#FFFFFF",border:"1px solid #E5E7EB",borderRadius:8,overflow:"hidden"}}>
        <div onClick={()=>setShowGlobal(p=>!p)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",cursor:"pointer"}}>
          <span style={{fontWeight:700,fontSize:14,color:"#111827"}}>עובדים בשכר גלובלי</span>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:12,color:"#9CA3AF"}}>{globalEmps.length} עובדים</span>
            <span style={{fontSize:16,color:"#9CA3AF",transition:"transform 0.2s",display:"inline-block",transform:showGlobal?"rotate(180deg)":"none"}}>▾</span>
          </div>
        </div>
        {showGlobal && (
          <div style={{borderTop:"1px solid #F1F5F9",padding:"14px 16px"}}>
            {globalEmps.map(emp=>(
              <div key={emp.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",background:"#F8FAFC",borderRadius:10,marginBottom:8,border:"1px solid #E5E7EB"}}>
                <div>
                  <div style={{fontWeight:700,color:"#111827",fontSize:14}}>{emp.name}</div>
                  <div style={{fontSize:12,color:"#6B7280",marginTop:1}}>{emp.role} · {(()=>{ const g = ev.status==="ready" ? ev.globalEmployees.find(x=>String(x.key)===String(emp.id)) : null; return g ? g.monthlyText : (ev.status==="ready" ? "סכום חסר או לא תקין" : "—"); })()}/חודש · עלות מעביד</div>
                </div>
                <div style={{display:"flex",gap:6}}>
                  <button onClick={()=>startEdit(emp)} style={{background:"#F1F5F9",border:"1px solid #E5E7EB",borderRadius:8,padding:"5px 10px",cursor:"pointer",fontFamily:"inherit",fontSize:12,color:"#6B7280"}}><IcoEdit/></button>
                  <button onClick={()=>removeEmp(emp.id)} style={{background:"none",border:"none",padding:"4px 6px",cursor:"pointer",fontFamily:"inherit",fontSize:12,color:"#9CA3AF"}}><IcoTrash/></button>
                </div>
              </div>
            ))}
            {!adding && (
              <button onClick={()=>{setAdding(true);setEditId(null);setForm({name:"",role:"מלצר",type:"global",monthlySalary:""});}}
                style={{width:"100%",background:"#FFFFFF",border:"1px dashed #D1D5DB",borderRadius:6,color:"#6B7280",padding:"9px",fontWeight:500,cursor:"pointer",fontFamily:"inherit",fontSize:12,marginTop:4}}>הוסף עובד גלובלי</button>
            )}
            {adding && (
              <div style={{background:"#F9FAFB",borderRadius:8,padding:"14px",border:"1px solid #BFDBFE",marginTop:8}}>
                <div style={{fontWeight:700,color:"#6B7280",fontSize:13,marginBottom:10}}>{editId!==null?"עריכת עובד":"עובד חדש"}</div>
                <input style={inp} placeholder="שם עובד" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} autoFocus/>
                <select style={{...inp,marginBottom:10}} value={form.role} onChange={e=>setForm(f=>({...f,role:e.target.value}))}>
                  {ROLES_EMP.map(r=><option key={r} value={r}>{r}</option>)}
                </select>
                <div style={{fontSize:11,color:"#9CA3AF",marginBottom:4}}>עלות מעביד חודשית (כולל כל העלויות)</div>
                <input style={inp} type="number" inputMode="numeric" placeholder="0" value={form.monthlySalary} onChange={e=>setForm(f=>({...f,monthlySalary:e.target.value}))}/>
                {form.monthlySalary && <div style={{background:"#F9FAFB",borderRadius:8,padding:"7px 12px",fontSize:12,color:"#6B7280",fontWeight:600,marginBottom:10}}>העלות החודשית המלאה משובצת אוטומטית על ימי החודש; ימים סגורים שהסתיימו אינם נושאים עלות</div>}
                <div style={{display:"flex",gap:8}}>
                  <button onClick={saveEmp} style={{flex:1,background:"#111827",border:"none",borderRadius:6,color:"#fff",padding:"9px",fontWeight:600,cursor:"pointer",fontFamily:"inherit",fontSize:13}}>שמור</button>
                  <button onClick={()=>{setAdding(false);setEditId(null);}} style={{flex:1,background:"#F1F5F9",border:"1px solid #E5E7EB",borderRadius:10,color:"#6B7280",padding:"10px",fontWeight:600,cursor:"pointer",fontFamily:"inherit",fontSize:13}}>ביטול</button>
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// ─── Master Tasks Screen (בעלים ישיר) ────────────────────────────────────────

// ─── Petty Cash Screen ────────────────────────────────────────────────────────
// Default categories for a brand-new business. Each business can edit its own
// list later via the petty-cash screen — the active list lives in
// businessConfig.pettyCashCategories. We keep this constant only as a fallback
// for businesses whose config predates the per-biz feature.
const DEFAULT_PETTY_CATEGORIES = ["מזון","משרדיות","ביגוד","ניקיון","תחזוקה","נסיעות","דלק","חניה","שונות"];

function PettyCashScreen({ items, saveItems, businessConfig, saveBusinessConfig }) {
  // Categories live in businessConfig now (per-business, editable). Fallback to
  // DEFAULT_PETTY_CATEGORIES for businesses whose config predates the feature.
  const PETTY_CATEGORIES = (businessConfig?.pettyCashCategories && businessConfig.pettyCashCategories.length > 0)
    ? businessConfig.pettyCashCategories
    : DEFAULT_PETTY_CATEGORIES;

  // Local formatter — preserves up to 2 decimal places. The global `fmt()` in
  // this file uses Math.round and would display 12.5 as ₪13. Petty cash needs
  // decimal precision (e.g. parking fees, fuel), so use this formatter for
  // amounts shown only inside this screen.
  const fmtPetty = (n) => '₪' + (Number(n) || 0).toLocaleString('he-IL', {
    minimumFractionDigits: 0,
    maximumFractionDigits: 2
  });

  const [adding, setAdding] = useState(false);
  const [editId, setEditId] = useState(null);
  const [selYear, setSelYear] = useState(YEAR);
  const [selMonth, setSelMonth] = useState(MONTH);
  const selMonthStr = String(selMonth+1).padStart(2,"0");
  const selPrefix = `${selYear}-${selMonthStr}`;

  // Form no longer asks for date — we set it automatically on save (TODAY_STR)
  // so monthly filtering still works without forcing the user to think about it.
  const [form, setForm] = useState({ amount: "", category: PETTY_CATEGORIES[0] || "שונות", note: "" });
  const [filterCat, setFilterCat] = useState("הכל");

  // Categories editor modal state
  const [editingCats, setEditingCats] = useState(false);
  const [catDraft, setCatDraft] = useState([]);
  const [newCatName, setNewCatName] = useState("");

  // Month navigation
  const goMonth = (dir) => {
    let nm = selMonth + dir;
    let ny = selYear;
    if (nm < 0) { nm = 11; ny--; }
    if (nm > 11) { nm = 0; ny++; }
    setSelMonth(nm); setSelYear(ny);
  };

  const openAdd = () => {
    setForm({ amount: "", category: PETTY_CATEGORIES[0] || "שונות", note: "" });
    setEditId(null);
    setAdding(true);
  };
  const openEdit = (item) => { setForm({ amount: item.amount, category: item.category, note: item.note || "" }); setEditId(item.id); setAdding(true); };
  const cancel = () => { setAdding(false); setEditId(null); };

  const save = () => {
    if(!form.amount) return;
    const list = items||[];
    if(editId) {
      // Preserve original date when editing.
      saveItems(list.map(i => i.id===editId ? { ...i, ...form, id: editId, amount: Number(form.amount) } : i));
    } else {
      saveItems([...list, { ...form, id: Date.now(), amount: Number(form.amount), date: TODAY_STR }]);
    }
    setAdding(false); setEditId(null);
  };

  const remove = (id) => { if(window.confirm("למחוק רשומה זו?")) saveItems((items||[]).filter(i=>i.id!==id)); };

  // ── Categories editor ──────────────────────────────────────────────────────
  const openCatsEditor = () => {
    setCatDraft([...PETTY_CATEGORIES]);
    setNewCatName("");
    setEditingCats(true);
  };
  const addCatToDraft = () => {
    const name = newCatName.trim();
    if (!name) return;
    if (catDraft.includes(name)) return;
    setCatDraft([...catDraft, name]);
    setNewCatName("");
  };
  const removeCatFromDraft = (idx) => {
    setCatDraft(catDraft.filter((_, i) => i !== idx));
  };
  const moveCatUp = (idx) => {
    if (idx === 0) return;
    const next = [...catDraft];
    [next[idx-1], next[idx]] = [next[idx], next[idx-1]];
    setCatDraft(next);
  };
  const saveCats = async () => {
    // Persist to businessConfig — this triggers the rest of the app to re-read.
    const cfg = { ...(businessConfig || {}), pettyCashCategories: catDraft };
    if (saveBusinessConfig) await saveBusinessConfig(cfg);
    setEditingCats(false);
  };
  const cancelCats = () => { setEditingCats(false); };

  // Filter by selected month first, then by category. Legacy items without a
  // date are kept visible (treated as the current month) to avoid orphaning.
  const monthItems = (items||[]).filter(i => !i.date || i.date.startsWith(selPrefix));
  const filtered = monthItems.filter(i => filterCat==="הכל" || i.category===filterCat);
  const total = filtered.reduce((s,i)=>s+(Number(i.amount)||0), 0);
  const monthTotal = monthItems.reduce((s,i)=>s+(Number(i.amount)||0),0);

  // ── XLSX export — columnar "vertical fill" layout matching the user's sample ──
  // Each category gets its own column. Entries for that category stack
  // downward in that column; cells stay empty once a category runs out of
  // entries. Vehicle-related categories (דלק, חניה, וכו') get auto-grouped
  // under a merged "רכב" sub-header when they appear contiguously.
  // Uses the global XLSX (SheetJS) which is already loaded in <head>.
  const exportToExcel = () => {
    // Start from the user's configured categories, then append any categories
    // that actually appear in this month's entries but aren't in the configured
    // list (legacy categories like "תחבורה" from before the user customized
    // their list). This keeps the export complete — the total in the export
    // always equals the total shown on screen.
    const orphanCats = Array.from(
      new Set(
        monthItems
          .map(i => i.category)
          .filter(c => c && !PETTY_CATEGORIES.includes(c))
      )
    ).sort();
    const cats = [...PETTY_CATEGORIES, ...orphanCats];
    const monthLabel = MONTH_NAMES[selMonth] + " " + selYear;
    const bizName = (businessConfig?.businessName || "").trim();

    // Detect a contiguous run of vehicle-related categories to merge under "רכב".
    const VEHICLE_KEYWORDS = ["דלק", "חניה", "כביש", "אגרה", "שטיפת רכב", "צמיג"];
    const isVehicle = (name) => VEHICLE_KEYWORDS.some(k => name.includes(k));
    let bestStart = -1, bestLen = 0;
    let curStart = -1, curLen = 0;
    for (let i = 0; i < cats.length; i++) {
      if (isVehicle(cats[i])) {
        if (curLen === 0) curStart = i;
        curLen++;
      } else {
        if (curLen > bestLen) { bestLen = curLen; bestStart = curStart; }
        curLen = 0;
      }
    }
    if (curLen > bestLen) { bestLen = curLen; bestStart = curStart; }
    const showVehicleHeader = bestLen >= 2;

    // Group amounts by category in user-defined order.
    const entriesByCol = cats.map(c =>
      monthItems
        .filter(i => i.category === c)
        .map(i => Number(i.amount) || 0)
    );
    const maxRows = entriesByCol.reduce((m, e) => Math.max(m, e.length), 0);

    // Build the sheet as an array-of-arrays.
    const aoa = [];
    aoa.push([]); // row 1: blank top margin
    aoa.push([]); // row 2: blank
    // Row 3: business name + month (placed in col B to mirror the user's sample).
    aoa.push(["", `${bizName || "העסק"} — קופה קטנה — ${monthLabel}`]);
    // Row 4: vehicle sub-header (single string at start of the merged range).
    if (showVehicleHeader) {
      const row4 = new Array(cats.length).fill("");
      row4[bestStart] = "רכב";
      aoa.push(row4);
    } else {
      aoa.push([]);
    }
    // Row 5: category headers.
    aoa.push([...cats]);
    // Rows 6..6+maxRows-1: vertical fill (one cell per entry, empties past the run).
    for (let r = 0; r < maxRows; r++) {
      aoa.push(cats.map((_, ci) => entriesByCol[ci][r] !== undefined ? entriesByCol[ci][r] : ""));
    }
    // Blank separator row + totals row at the bottom.
    aoa.push([]);
    const colTotals = entriesByCol.map(e => e.reduce((s, n) => s + n, 0));
    const grandTotal = colTotals.reduce((s, n) => s + n, 0);
    aoa.push([...colTotals, grandTotal]);

    const ws = XLSX.utils.aoa_to_sheet(aoa);
    // Right-to-left display for Hebrew.
    ws["!rightToLeft"] = true;
    // Reasonable default column widths so headers don't get cut.
    ws["!cols"] = cats.map(() => ({ wch: 13 })).concat([{ wch: 12 }]);
    // Merge "רכב" header across its vehicle columns.
    if (showVehicleHeader) {
      ws["!merges"] = ws["!merges"] || [];
      ws["!merges"].push({
        s: { r: 3, c: bestStart },
        e: { r: 3, c: bestStart + bestLen - 1 },
      });
    }

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "קופה קטנה");
    XLSX.writeFile(wb, `קופה_קטנה_${MONTH_NAMES[selMonth]}_${selYear}.xlsx`);
  };

  return (
    <div>
      {/* Month selector */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
        <button onClick={()=>goMonth(-1)} style={{background:"#F1F5F9",border:"none",borderRadius:8,width:36,height:36,cursor:"pointer",fontSize:16,color:"#64748B",display:"flex",alignItems:"center",justifyContent:"center"}}>→</button>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:18,fontWeight:700,color:"#0F172A"}}>{MONTH_NAMES[selMonth]} {selYear}</div>
          <div style={{fontSize:11,color:"#94A3B8"}}>{monthItems.length} רשומות · {fmtPetty(monthTotal)}</div>
        </div>
        <button onClick={()=>goMonth(1)} style={{background:"#F1F5F9",border:"none",borderRadius:8,width:36,height:36,cursor:"pointer",fontSize:16,color:"#64748B",display:"flex",alignItems:"center",justifyContent:"center"}}
          disabled={selYear===YEAR && selMonth===MONTH}>←</button>
      </div>

      {/* Header actions */}
      <div style={{display:"flex",gap:8,marginBottom:14,alignItems:"center",flexWrap:"wrap"}}>
        <div style={{flex:1}}>
          <h2 style={{margin:0,fontSize:14,fontWeight:700,color:"#111827"}}>קופה קטנה</h2>
        </div>
        <button onClick={openCatsEditor} style={{padding:"8px 14px",background:"#F9FAFB",border:"1px solid #E5E7EB",borderRadius:10,color:"#6B7280",fontWeight:600,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>קטגוריות</button>
        <button onClick={exportToExcel} style={{padding:"8px 14px",background:"#F9FAFB",border:"1px solid #86EFAC",borderRadius:10,color:"#6B7280",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>ייצוא Excel</button>
        <button onClick={openAdd} style={{...S.addBtn}}>הוסף</button>
      </div>

      {/* Filter — show the configured categories plus any orphans actually used
          in this month's data so the user can still filter old records.       */}
      <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
        {(() => {
          const filterCats = [...PETTY_CATEGORIES];
          for (const it of monthItems) {
            if (it.category && !filterCats.includes(it.category)) filterCats.push(it.category);
          }
          return ["הכל", ...filterCats].map(cat => (
            <button key={cat} className="btn btn-ghost btn-sm" style={{...(filterCat===cat?S.subBtnActive:{})}} onClick={()=>setFilterCat(cat)}>{cat}</button>
          ));
        })()}
      </div>

      {/* Categories editor modal */}
      {editingCats && (
        <div className="card card-p" style={{border:"1px solid #BFDBFE",marginBottom:14,background:"#EFF6FF"}}>
          <h3 style={{margin:"0 0 8px",fontSize:14,fontWeight:700,color:"#111827"}}>עריכת קטגוריות</h3>
          <p style={{margin:"0 0 12px",fontSize:12,color:"#6B7280"}}>הקטגוריות מתעדכנות לכל המשתמשים בעסק הזה. רשומות קיימות בקטגוריה שתימחק יישארו עם השם הישן.</p>
          <div style={{maxHeight:"260px",overflowY:"auto",background:"#FFFFFF",borderRadius:6,padding:"4px 8px",marginBottom:10,border:"1px solid #E5E7EB"}}>
            {catDraft.length === 0 && (
              <p style={{margin:"8px 0",fontSize:12,color:"#9CA3AF"}}>אין קטגוריות. הוסף את הראשונה למטה.</p>
            )}
            {catDraft.map((cat, idx) => (
              <div key={cat+idx} style={{display:"flex",alignItems:"center",gap:6,padding:"6px 0",borderBottom:idx<catDraft.length-1?"1px solid #F3F4F6":"none"}}>
                <span style={{flex:1,fontSize:13,color:"#111827"}}>{cat}</span>
                <button onClick={()=>moveCatUp(idx)} disabled={idx===0} style={{background:"none",border:"none",cursor:idx===0?"default":"pointer",color:idx===0?"#D1D5DB":"#6B7280",fontSize:14,padding:"2px 6px"}} title="העלה">▲</button>
                <button onClick={()=>removeCatFromDraft(idx)} style={{background:"none",border:"none",cursor:"pointer",color:"#DC2626",fontSize:13,padding:"2px 8px"}} title="מחק">✕</button>
              </div>
            ))}
          </div>
          <div style={{display:"flex",gap:6,marginBottom:10}}>
            <input className="input" style={{marginBottom:0,flex:1}} placeholder="שם קטגוריה חדשה..." value={newCatName}
              onChange={e=>setNewCatName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addCatToDraft()}/>
            <button className="btn btn-secondary" style={{padding:"9px 14px"}} onClick={addCatToDraft}>הוסף</button>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-primary" style={{padding:"9px 16px"}} onClick={saveCats}>שמור</button>
            <button className="btn btn-secondary" onClick={cancelCats}>ביטול</button>
          </div>
        </div>
      )}

      {/* Add/Edit form — date is set automatically; only category, amount, note */}
      {adding && (
        <div className="card card-p" style={{border:"1px solid #FCD34D44",marginBottom:14}}>
          <h3 style={{margin:"0 0 12px",fontSize:14,fontWeight:700,color:"#111827"}}>{editId?"עריכת רשומה":"רשומה חדשה"}</h3>
          <div style={{display:"flex",gap:8,marginBottom:8}}>
            <div style={{flex:1.4}}>
              <label className="label">קטגוריה</label>
              <select className="input" style={{marginBottom:0}} value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>
                {PETTY_CATEGORIES.map(cat=><option key={cat}>{cat}</option>)}
                {/* If editing an item whose category was removed from the list,
                    keep it visible so the dropdown still reflects reality. */}
                {form.category && !PETTY_CATEGORIES.includes(form.category) && (
                  <option value={form.category}>{form.category} (לא ברשימה)</option>
                )}
              </select>
            </div>
            <div style={{flex:1}}>
              <label className="label">סכום (₪)</label>
              <input type="number" inputMode="decimal" placeholder="0" className="input" style={{marginBottom:0}} value={form.amount}
                onChange={e=>setForm(f=>({...f,amount:e.target.value}))} autoFocus/>
            </div>
          </div>
          <label className="label">הערה (אופציונלי)</label>
          <input className="input" placeholder="תיאור ההוצאה..." value={form.note||""}
            onChange={e=>setForm(f=>({...f,note:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&save()}/>
          <div style={{display:"flex",gap:8,marginTop:4}}>
            <button onClick={save} className="btn btn-primary" style={{flex:"none",padding:"9px 16px"}}>{editId?"עדכן":"הוסף"}</button>
            <button className="btn btn-secondary" onClick={cancel}>ביטול</button>
          </div>
        </div>
      )}

      {/* Total bar */}
      {filtered.length > 0 && (
        <div style={{background:"#F9FAFB",border:`1px solid ${"#E5E7EB"}`,borderRadius:5,padding:"10px 14px",marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontWeight:700,color:"#6B7280"}}>סה״כ {filterCat==="הכל"?"כל הרשומות":filterCat}</span>
          <span style={{fontWeight:700,fontSize:14,color:"#111827"}}>{fmtPetty(total)}</span>
        </div>
      )}

      {/* Items list — cards, no date displayed */}
      {filtered.length === 0 && !adding ? (
        <div className="empty"><div style={{width:36,height:36,border:"1px solid #E5E7EB",borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px",color:"#9CA3AF",fontSize:14}}>₪</div><p style={{fontSize:13,margin:0}}>אין רשומות</p></div>
      ) : (
        <div>
          {filtered.slice().sort((a,b)=>(b.id||0)-(a.id||0)).map(item=>(
            <div key={item.id} style={{background:"#FFFFFF",border:"1px solid #E5E7EB",borderRadius:8,padding:"12px 16px",marginBottom:8,display:"flex",alignItems:"center",gap:10}}>
              <div style={{flex:1}}>
                <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:item.note?3:0}}>
                  <span style={{fontSize:13,fontWeight:700,color:"#111827"}}>{fmtPetty(Number(item.amount))}</span>
                  <span style={{fontSize:11,padding:"2px 7px",background:"#F3F4F6",borderRadius:3,color:"#6B7280"}}>{item.category}</span>
                </div>
                {item.note && <div style={{fontSize:12,color:"#6B7280"}}>{item.note}</div>}
              </div>
              <button onClick={()=>openEdit(item)} style={{background:"none",border:"none",cursor:"pointer",color:"#6B7280",fontSize:12,padding:"4px 6px"}}><IcoEdit/></button>
              <button onClick={()=>remove(item.id)} style={{background:"none",border:"none",cursor:"pointer",color:"#9CA3AF",fontSize:12,padding:"4px 6px",fontFamily:"inherit"}}><IcoTrash/></button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function MasterTasksScreen({ tasks, saveTasks }) {
  const SHIFT_LABEL = t => t.shift==="שבועי" ? `${t.weekday||"שבועי"}` : t.shift||"";
  const [adding, setAdding]   = useState(false);
  const [editing, setEditing] = useState(null); // task id being edited
  const [form, setForm]       = useState({ title:"", category:"פתיחה", shift:"כל המשמרות", note:"" });
  const [filterShift, setFilterShift] = useState("הכל");
  const [filterCat,   setFilterCat]   = useState("הכל");

  const openAdd = () => { setForm({ title:"", category:"פתיחה", shift:"כל המשמרות", note:"", proof:"check" }); setEditing(null); setAdding(true); };
  const openEdit = (t) => { setForm({ title:t.title, category:t.category, shift:t.shift, weekday:t.weekday||"ראשון", note:t.note||"", proof:t.proof||"check" }); setEditing(t.id); setAdding(true); };
  const cancel = () => { setAdding(false); setEditing(null); };

  const save = () => {
    if (!form.title.trim()) return;
    if (editing !== null) {
      saveTasks((tasks||[]).map(t => t.id===editing ? {...t,...form} : t));
    } else {
      saveTasks([...(tasks||[]), {...form, id:Date.now()}]);
    }
    setAdding(false); setEditing(null);
  };

  const remove = (id) => saveTasks((tasks||[]).filter(t => t.id !== id));

  const moveUp   = (i, arr) => { if(i===0) return arr; const a=[...arr]; [a[i-1],a[i]]=[a[i],a[i-1]]; return a; };
  const moveDown = (i, arr) => { if(i===arr.length-1) return arr; const a=[...arr]; [a[i],a[i+1]]=[a[i+1],a[i]]; return a; };

  const filtered = (tasks||[]).filter(t =>
    (filterShift==="הכל" || t.shift===filterShift) &&
    (filterCat==="הכל"   || t.category===filterCat)
  );

  const CAT_COLOR = {"פתיחה":"#6B7280","שוטף":"#6B7280","סגירה":"#6B7280"};
  const CAT_BG    = {"פתיחה":"#F3F4F6","שוטף":"#F9FAFB","סגירה":"#F3F4F6"};

  return (
    <div>
      {/* Summary bar */}
      <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
        <div style={{flex:1}}>
          <h2 style={{margin:0,fontSize:14,fontWeight:700,color:"#111827"}}>ניהול משימות</h2>
          <p style={{margin:"2px 0 0",fontSize:12,color:"#9CA3AF"}}>
            {(tasks||[]).length} משימות · בוקר: {(tasks||[]).filter(t=>t.shift==="בוקר"||t.shift==="כל המשמרות").length} · ערב: {(tasks||[]).filter(t=>t.shift==="ערב"||t.shift==="כל המשמרות").length}
          </p>
        </div>
        <button style={{...S.addBtn, fontSize:13, padding:"8px 14px"}} onClick={openAdd}>הוסף משימה</button>
      </div>

      {/* Filters */}
      <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
        {["הכל","כל המשמרות","בוקר","ערב","שבועי"].map(s=>(
          <button key={s} className="btn btn-ghost btn-sm" style={{...(filterShift===s?S.subBtnActive:{})}} onClick={()=>setFilterShift(s)}>{s}</button>
        ))}
        <div style={{width:1,background:"#6B7280",margin:"0 2px"}}/>
        {["הכל","פתיחה","שוטף","סגירה"].map(c=>(
          <button key={c} className="btn btn-ghost btn-sm" style={{...(filterCat===c?{...S.subBtnActive,color:c==="הכל"?"#F5F5F5":CAT_COLOR[c]}:{})}} onClick={()=>setFilterCat(c)}>{c}</button>
        ))}
      </div>

      {/* Add / Edit form */}
      {adding && (
        <div className="card card-p" style={{ border:"1px solid #15803D44", marginBottom:14}}>
          <h3 style={{margin:"0 0 12px", fontSize:14, fontWeight:700, color:"#111827"}}>
            {editing ? "עריכת משימה" : "משימה חדשה"}
          </h3>
          <label className="label">שם המשימה</label>
          <input className="input" autoFocus placeholder="למשל: ניקוי מכונת קפה" value={form.title}
            onChange={e=>setForm(f=>({...f,title:e.target.value}))}
            onKeyDown={e=>e.key==="Enter"&&save()}/>
          <div style={{display:"flex",gap:8,marginBottom:8}}>
            <div style={{flex:1}}>
              <label className="label">קטגוריה</label>
              <select className="input" style={{marginBottom:0}} value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>
                {["פתיחה","שוטף","סגירה"].map(c=><option key={c}>{c}</option>)}
              </select>
            </div>
            <div style={{flex:1}}>
              <label className="label">משמרת</label>
              <select className="input" style={{marginBottom:0}} value={form.shift} onChange={e=>setForm(f=>({...f,shift:e.target.value}))}>
                {["כל המשמרות","בוקר","ערב","שבועי"].map(s=><option key={s}>{s}</option>)}
              </select>
            </div>
          </div>
          <label className="label">הערה / הוראות</label>
          <input className="input" placeholder="פרטים נוספים לאחמש..." value={form.note}
            onChange={e=>setForm(f=>({...f,note:e.target.value}))}/>

          <label style={{...S.lbl, marginBottom:6}}>אישור ביצוע</label>
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            {[
              {val:"check", icon:"", label:"סימון בלבד"},
              {val:"photo", icon:"□", label:"חובה לצלם"},
            ].map(opt=>(
              <button key={opt.val} onClick={()=>setForm(f=>({...f,proof:opt.val}))}
                style={{flex:1,padding:"10px 8px",borderRadius:10,border:"none",cursor:"pointer",fontFamily:"inherit",
                  background:form.proof===opt.val?"#111827":"#F9FAFB",
                  border:`1px solid ${form.proof===opt.val?"#111827":"#E5E7EB"}`,
                  color:form.proof===opt.val?"#fff":"#6B7280",fontWeight:500,fontSize:12}}>
                <div style={{fontSize:20,marginBottom:3}}>{opt.icon}</div>
                {opt.label}
              </button>
            ))}
          </div>
          <div style={{display:"flex",gap:8,marginTop:4}}>
            <button className="btn btn-primary btn-full" onClick={save}>{editing?"עדכן":"הוסף"}</button>
            <button className="btn btn-secondary" onClick={cancel}>ביטול</button>
          </div>
        </div>
      )}

      {/* Tasks list grouped by category */}
      {filtered.length === 0 && !adding && (
        <div className="empty">
          <div style={{width:36,height:36,border:"1px solid #E5E7EB",borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px",color:"#9CA3AF",fontWeight:500,fontSize:14}}>—</div>
          <p style={{color:"#9CA3AF"}}>אין משימות -- לחץ + הוסף משימה</p>
        </div>
      )}

      {["פתיחה","שוטף","סגירה"].map(cat => {
        const catTasks = filtered.filter(t => t.category===cat);
        if (!catTasks.length) return null;
        return (
          <div key={cat} style={{marginBottom:16}}>
            {/* Category header */}
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
              <span style={{fontSize:12,fontWeight:700,padding:"3px 12px",borderRadius:8,color:CAT_COLOR[cat],background:CAT_BG[cat]}}>
                {cat}
              </span>
              <span style={{fontSize:11,color:"#9CA3AF"}}>{catTasks.length} משימות</span>
            </div>
            {/* Task rows */}
            {catTasks.map((t, ci) => {
              const globalIdx = tasks.indexOf(t);
              return (
                <div key={t.id} style={{
                  display:"flex", alignItems:"flex-start", gap:10,
                  padding:"11px 13px", marginBottom:7,
                  background:"#FFFFFF", border:"1px solid #E5E7EB", borderRadius:11,
                  borderRight:"2px solid #E5E7EB"
                }}>
                  {/* Drag order */}
                  <div style={{display:"flex",flexDirection:"column",gap:2,paddingTop:2}}>
                    <button style={{...S.iconBtn,padding:"2px 6px",fontSize:10,color:"#9CA3AF"}}
                      onClick={()=>saveTasks(moveUp(globalIdx,tasks))}>▲</button>
                    <button style={{...S.iconBtn,padding:"2px 6px",fontSize:10,color:"#9CA3AF"}}
                      onClick={()=>saveTasks(moveDown(globalIdx,tasks))}>▼</button>
                  </div>
                  {/* Content */}
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:14,color:"#111827",fontWeight:600,marginBottom:3}}>{t.title}</div>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
                      <span style={{fontSize:11,color:"#9CA3AF",background:"#F8FAFC",padding:"1px 7px",borderRadius:8}}>{SHIFT_LABEL(t)}</span>
                      {t.proof==="photo" && <span style={{fontSize:10,color:"#6B7280",background:"#F3F4F6",padding:"1px 6px",borderRadius:3}}>צילום</span>}
                      {t.note && <span style={{fontSize:11,color:"#9CA3AF",fontStyle:"italic"}}>{t.note}</span>}
                    </div>
                  </div>
                  {/* Actions */}
                  <div style={{display:"flex",gap:5,flexShrink:0}}>
                    <button style={{...S.iconBtn,fontSize:12}} onClick={()=>openEdit(t)}>
                    <svg width="12" height="12" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                  </button>
                    <button style={{...S.iconBtn,fontSize:12}} onClick={()=>remove(t.id)}>
                    <svg width="12" height="12" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
                  </button>
                  </div>
                </div>
              );
            })}
          </div>
        );
      })}

      {/* Shift preview */}
      {tasks.length > 0 && (
        <div className="card card-p" style={{ marginTop:8, borderTop:"1px solid #D1D5DB"}}>
          <div style={{fontSize:11,fontWeight:700,color:"#9CA3AF",textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>
            תצוגה מקדימה
          </div>
          <div style={{display:"flex",gap:8}}>
            {["בוקר","ערב"].map(shift=>(
              <div key={shift} style={{flex:1,background:"#F8FAFC",borderRadius:10,padding:"10px 12px"}}>
                <div style={{fontSize:12,fontWeight:700,color:"#6B7280",marginBottom:8}}>{shift}</div>
                {tasks.filter(t=>t.shift===shift||t.shift==="כל המשמרות").length === 0
                  ? <div style={{fontSize:11,color:"#374151"}}>אין משימות</div>
                  : tasks.filter(t=>t.shift===shift||t.shift==="כל המשמרות").map(t=>(
                    <div key={t.id} style={{display:"flex",alignItems:"center",gap:7,marginBottom:5}}>
                      <div style={{width:14,height:14,borderRadius:4,border:`2px solid ${CAT_COLOR[t.category]}55`,flexShrink:0}}/>
                      <span style={{fontSize:12,color:"#6B7280"}}>{t.title}</span>
                    </div>
                  ))
                }
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Shift Manager (Inline Tab) ───────────────────────────────────────────────
const SM_SHIFTS    = ["בוקר","ערב"];
const SM_CATS      = ["פתיחה","שוטף","סגירה"];
const SM_CAT_COLOR = {"פתיחה":"#6B7280","שוטף":"#6B7280","סגירה":"#6B7280"};
const SM_CAT_BG    = {"פתיחה":"#F3F4F6","שוטף":"#F9FAFB","סגירה":"#F3F4F6"};

// PERMISSIONS -- מה כל תפקיד יכול לגשת
// בעתיד: להוסיף { id, name, permissions:["dashboard","forecast",...] } לכל מנהל
// כרגע: מנהלים רואים רק ⚡ משמרות. בעלים רואה הכל.

function ShiftManagerEmbed({ currentUser, setCurrentUser, onNavigate, appUsers=[], saveAppUsers, bizId="", loggedInRole=null }) {
  const [subScreen,  setSubScreen]  = useState("home");
  const [tasks,      setTasks]      = useState([]);
  const [logs,       setLogs]       = useState([]);
  const [activeLog,  setActiveLog]  = useState(null);
  const [ownerTab,   setOwnerTab]   = useState("tasks");
  const [ownerPinIn, setOwnerPinIn] = useState("");
  const [ownerErr,   setOwnerErr]   = useState(false);
  const [incText,    setIncText]    = useState("");
  const [smLoaded,   setSmLoaded]   = useState(false);

  const appUsersRef = appUsers;
  const saveAppUsersRef = saveAppUsers || (()=>{});

  useEffect(()=>{
    const initSM = async () => {
      try {
        const sg2 = async k => { try{return await window.storage.get(k);}catch(_){return null;} };
        const r1=await sg2(`biz:${bizId}:tasks`);      if(r1) setTasks(JSON.parse(r1.value));
        const r2=await sg2(`biz:${bizId}:logs`);       if(r2) setLogs(JSON.parse(r2.value));
        const r5=await sg2(`biz:${bizId}:active-log`); if(r5) setActiveLog(JSON.parse(r5.value));
      } catch(_){}
      setSmLoaded(true);
    };
    if(window._firebaseReady) { initSM(); }
    else { window.addEventListener("firebase-ready", initSM, {once:true}); }
  },[]);

  const saveTasks  = async t => { setTasks(t);    try{await window.storage.set(`biz:${bizId}:tasks`,JSON.stringify(t), true);}catch(_){} };
  const saveLogs   = async l => { setLogs(l);     try{await window.storage.set(`biz:${bizId}:logs`,JSON.stringify(l), true);}catch(_){} };
  const saveActive = async l => { setActiveLog(l);try{await window.storage.set(`biz:${bizId}:active-log`,JSON.stringify(l), true);}catch(_){} };

  const openShift = async (shiftType) => {
    const log = { id:Date.now(), date:TODAY_STR, shiftType, managerName:"", completedTasks:[], incidents:[], proofs:{},
      openedAt:new Date().toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"}), closedAt:null };
    await saveActive(log);
    setSubScreen("shift");
  };

  const closeShift = async () => {
    if(!activeLog) return;
    const closed = {...activeLog, closedAt:new Date().toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"})};
    await saveLogs([closed,...logs]);
    await saveActive(null);
    setSubScreen("home");
  };

  const tryOwnerLogin = () => {
    // PIN is DEPRECATED as an authorization mechanism. Owner-only UI is gated on the
    //   authoritative server role (loggedInRole). Real owner-only actions remain
    //   server-enforced (requireTenantAccess), so knowing an old PIN grants nothing.
    if(loggedInRole==="owner" || loggedInRole==="super_owner"){ setOwnerErr(false); setOwnerPinIn(""); setSubScreen("owner"); }
    else { setOwnerErr(true); setOwnerPinIn(""); }
  };

  const toggleTask = async (task) => {
    if(!activeLog) return;
    if(task.proof==="photo" && !activeLog.completedTasks.includes(task.id)) return;
    const proofs = {...(activeLog.proofs||{})};
    const done = activeLog.completedTasks.includes(task.id)
      ? (delete proofs[task.id], activeLog.completedTasks.filter(x=>x!==task.id))
      : [...activeLog.completedTasks, task.id];
    await saveActive({...activeLog, completedTasks:done, proofs});
  };

  const completeWithPhoto = async (taskId, base64) => {
    if(!activeLog) return;
    const done = activeLog.completedTasks.includes(taskId) ? activeLog.completedTasks : [...activeLog.completedTasks, taskId];
    const proofs = {...(activeLog.proofs||{}), [taskId]: base64};
    await saveActive({...activeLog, completedTasks:done, proofs});
  };

  const addInc = async () => {
    if(!incText.trim()||!activeLog) return;
    const inc = {text:incText.trim(), time:new Date().toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"})};
    await saveActive({...activeLog, incidents:[...(activeLog.incidents||[]),inc]});
    setIncText("");
  };

  const shiftTasks = (log) => tasks.filter(t => t.shift==="כל המשמרות" || t.shift===(log?.shiftType||""));
;

  if(!smLoaded) return <div className="shift-wrap" style={{textAlign:"center",color:"#9CA3AF",paddingTop:40}}>טוען...</div>;

  // ── HOME -- עובר ישירות לצ'קליסט ──
  if(subScreen==="home") {
    if(!activeLog) { openShift("יום"); return null; }
    setTimeout(()=>setSubScreen("shift"),0);
    return null;
  }

  // ── OWNER LOGIN ──
  if(subScreen==="ownerLogin") return (
    <div className="shift-wrap">
      <div style={{maxWidth:340,margin:"0 auto"}}>
        <button className="btn btn-secondary btn-sm" style={{marginBottom:16}} onClick={()=>setSubScreen("home")}>חזרה</button>
        <h3 style={{margin:"0 0 16px",color:"#111827",fontWeight:700,fontSize:15}}>קוד גישה</h3>
        <label className="label">קוד גישה</label>
        <input className="input" style={{textAlign:"center",letterSpacing:10,fontSize:22,padding:"12px"}} type="password" inputMode="numeric" maxLength={6} placeholder="••••••"
          value={ownerPinIn} onChange={e=>setOwnerPinIn(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&tryOwnerLogin()}/>
        {ownerErr && <div style={{color:"#DC2626",fontSize:12,marginBottom:8,padding:"7px 10px",background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:5}}>קוד שגוי</div>}
        <button className="btn btn-primary btn-full" onClick={tryOwnerLogin}>כניסה</button>
        <p style={{color:"#6B7280",fontSize:11,textAlign:"center",marginTop:10}}>ברירת מחדל: 0000</p>
      </div>
    </div>
  );

  // ── ACTIVE SHIFT ──
  if(subScreen==="shift") {
    const log = activeLog;
    if(!log) { setSubScreen("home"); return null; }
    const myTasks = shiftTasks(log);
    const done    = myTasks.filter(t=>log.completedTasks.includes(t.id)).length;
    const pct     = myTasks.length>0 ? Math.round((done/myTasks.length)*100) : 0;
    return (
      <div className="shift-wrap">
        <div className="flex jbet icenter" style={{marginBottom:10}}>
          <div>
            <div style={{fontSize:12,color:"#6B7280",marginBottom:1}}>{log.shiftType} · נפתחה {log.openedAt}</div>
            <div style={{fontSize:11,color:"#9CA3AF"}}>{done}/{myTasks.length} משימות</div>
          </div>
          <div style={{fontSize:28,fontWeight:700,color:pct===100?"#16A34A":"#111827",lineHeight:1,letterSpacing:-1}}>{pct}%</div>
        </div>
        <div style={{height:3,background:"#F3F4F6",borderRadius:2,marginBottom:16,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${pct}%`,background:pct===100?"#16A34A":pct>60?"#D97706":"#DC2626",borderRadius:2,transition:"width 0.4s ease"}}/>
        </div>
        {SM_CATS.map(cat=>{
          const ct = myTasks.filter(t=>t.category===cat);
          if(!ct.length) return null;
          const catDone = ct.filter(t=>log.completedTasks.includes(t.id)).length;
          return (
            <div key={cat} style={{marginBottom:18}}>
              <div className="flex jbet icenter" style={{marginBottom:8}}>
                <span style={{fontSize:10,fontWeight:600,color:"#6B7280",textTransform:"uppercase",letterSpacing:0.8,paddingBottom:4}}>{cat}</span>
                <span style={{color:"#9CA3AF",fontSize:11}}>{catDone}/{ct.length}</span>
              </div>
              {ct.map(task=>{
                const isDone     = log.completedTasks.includes(task.id);
                const isPhoto    = task.proof==="photo";
                const photoProof = (log.proofs||{})[task.id];
                return (
                  <div key={task.id} className="task-row" style={{flexDirection:"column",cursor:"default"}}>
                    <div style={{display:"flex",alignItems:"flex-start",gap:10,width:"100%"}}>
                      <div className={`task-cb${isDone?" on":""}`}
                        onClick={()=>{ if(isDone) toggleTask(task); else if(!isPhoto) toggleTask(task); }}>
                        {isDone && <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="white" strokeWidth="2" strokeLinecap="round"/></svg>}
                        {!isDone && isPhoto && <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" strokeWidth="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>}
                      </div>
                      <div style={{flex:1}}>
                        <div style={{fontSize:13,color:isDone?"#9CA3AF":"#111827",fontWeight:500,textDecoration:isDone?"line-through":"none"}}>{task.title}</div>
                        {task.note&&<div style={{fontSize:11,color:"#9CA3AF",marginTop:2}}>{task.note}</div>}
                      </div>
                      {isPhoto&&!isDone&&(
                        <label style={{flexShrink:0,padding:"5px 10px",background:"#F9FAFB",border:"1px solid #E5E7EB",borderRadius:5,color:"#6B7280",fontSize:11,cursor:"pointer",fontFamily:"inherit",fontWeight:500}}>
                          צלם
                          <input type="file" accept="image/*" capture="camera" style={{display:"none"}}
                            onChange={e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>completeWithPhoto(task.id,ev.target.result);r.readAsDataURL(f);e.target.value="";}}/>
                        </label>
                      )}
                      {isPhoto&&isDone&&(
                        <button style={{flexShrink:0,padding:"3px 7px",background:"transparent",border:"none",color:"#9CA3AF",fontSize:12,cursor:"pointer"}}
                          onClick={()=>toggleTask(task)}><IcoTrash/></button>
                      )}
                    </div>
                    {photoProof&&(
                      <div style={{marginTop:8,width:"100%"}}>
                        <img src={photoProof} alt="הוכחה" style={{width:"100%",maxHeight:160,objectFit:"cover",borderRadius:6,border:"1px solid #E5E7EB"}} onClick={()=>window.open(photoProof,"_blank")}/>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          );
        })}
        {myTasks.length===0&&<div style={{textAlign:"center",padding:"32px 0",color:"#9CA3AF",fontSize:13}}>אין משימות מוגדרות עדיין</div>}
        <div className="card card-p">
          <div style={{fontSize:10,fontWeight:600,color:"#9CA3AF",marginBottom:10,textTransform:"uppercase",letterSpacing:1}}>אירועים</div>
          {(log.incidents||[]).map((inc,i)=>(
            <div key={i} style={{padding:"7px 10px",background:"#F9FAFB",borderRadius:5,marginBottom:5,border:"1px solid #F3F4F6"}}>
              <div style={{fontSize:12,color:"#6B7280"}}>{inc.text}</div>
              <div style={{fontSize:10,color:"#9CA3AF",marginTop:1}}>{inc.time}</div>
            </div>
          ))}
          <div style={{display:"flex",gap:7,marginTop:8}}>
            <input className="input" style={{flex:1,marginBottom:0}} placeholder="תאר אירוע..." value={incText} onChange={e=>setIncText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addInc()}/>
            <button className="btn btn-ghost btn-sm" onClick={addInc}>הוסף</button>
          </div>
        </div>
        {pct===100
          ? <button className="btn btn-primary btn-full" onClick={closeShift}>סגור משמרת</button>
          : <button className="btn btn-primary btn-full" style={{background:"#F9FAFB",color:"#6B7280",border:"1px solid #E5E7EB"}} onClick={closeShift}>סגור משמרת ({myTasks.length-done} פתוחות)</button>
        }
      </div>
    );
  }
  // ── OWNER PANEL ──
  if(subScreen==="owner") return (
    <div className="shift-wrap">
      <nav style={{display:"flex",gap:0,borderBottom:"1px solid #E5E7EB",marginBottom:14}}>
        {[["tasks","משימות"],["logs","יומן"],["users","משתמשים"]].map(([t,l])=>(
          <button key={t} className="shift-tab" style={{...(ownerTab===t?{color:"#111827",fontWeight:600,borderBottom:"2px solid #111827"}:{})}} onClick={()=>setOwnerTab(t)}>{l}</button>
        ))}
        <div style={{flex:1}}/>
        <button className="btn btn-secondary btn-sm" style={{margin:"2px 0"}} onClick={()=>setSubScreen("home")}>יציאה</button>
      </nav>

      {ownerTab==="tasks"    && <SMTasksPanel tasks={tasks} saveTasks={saveTasks} SS={SS}/>}
      {ownerTab==="users"    && <div style={{padding:"0 4px"}}><UserManagement users={appUsersRef} saveUsers={saveAppUsersRef} tenantId={window._currentTenantId} businesses={businesses}/></div>}
      {ownerTab==="logs" && (
        <div>
          <div style={{fontSize:11,fontWeight:700,color:"#6B7280",textTransform:"uppercase",letterSpacing:1,marginBottom:12}}>יומן משמרות</div>
          {logs.length===0 && <p style={{color:"#9CA3AF",textAlign:"center",paddingTop:24}}>אין משמרות עדיין</p>}
          {logs.map((log,i)=>{
            const lt=tasks.filter(t=>t.shift==="כל המשמרות"||t.shift===log.shiftType);
            const dp=lt.length>0?Math.round(((log.completedTasks?.length||0)/lt.length)*100):0;
            return (
              <div key={i} className="card card-p">
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:5}}>
                  <div>
                    <div style={{fontWeight:600,color:"#111827",fontSize:13}}>{log.managerName||"—"}</div>
                    <div style={{fontSize:11,color:"#9CA3AF",marginTop:1}}>{log.date} · {log.shiftType}</div>
                  </div>
                  <div style={{textAlign:"left"}}>
                    <div style={{fontWeight:700,color:dp===100?"#16A34A":"#D97706",fontSize:16,letterSpacing:-0.5}}>{dp}%</div>
                    <div style={{fontSize:10,color:"#9CA3AF"}}>{log.completedTasks?.length||0}/{lt.length}</div>
                  </div>
                </div>
                <div style={{fontSize:11,color:"#9CA3AF"}}>{log.openedAt}{log.closedAt?` — ${log.closedAt}`:""}</div>
                {log.incidents?.length>0&&<div style={{marginTop:8,padding:"7px 10px",background:"#F8FAFC",borderRadius:8}}>
                  {log.incidents.map((inc,j)=><div key={j} style={{fontSize:11,color:"#6B7280"}}>{inc.time} -- {inc.text}</div>)}
                </div>}
                {/* Photo proofs */}
                {log.proofs && Object.keys(log.proofs).length>0 && (
                  <div style={{marginTop:8}}>
                    <div style={{fontSize:10,color:"#9CA3AF",marginBottom:5,fontWeight:600,textTransform:"uppercase",letterSpacing:0.8}}>תמונות הוכחה ({Object.keys(log.proofs).length})</div>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                      {Object.entries(log.proofs).map(([tid, src])=>{
                        const t = tasks.find(x=>String(x.id)===String(tid));
                        return (
                          <div key={tid} style={{position:"relative"}}>
                            <img src={src} alt={t?.title||""}
                              style={{width:70,height:70,objectFit:"cover",borderRadius:8,border:"1px solid #15803D44",cursor:"pointer"}}
                              onClick={()=>window.open(src,"_blank")}/>
                            <div style={{fontSize:9,color:"#9CA3AF",textAlign:"center",marginTop:2,maxWidth:70,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t?.title||tid}</div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );

  return null;
}
