    });
    persistItems(updated);
  };

  const initFromStarter = (key) => {
    if (!confirm(`לאתחל מתבנית "${STARTER_TEMPLATES[key].label}"? פריטים קיימים יסומנו כארכיון (לא יימחקו).`)) return;
    const archived = draft.items.map(x => x.active ? {...x, active:false, archivedAt: Date.now(), archivedBy: ctx.userId} : x);
    const seeded = STARTER_TEMPLATES[key].items.map((s,i) => ({
      ...buildItemFromStarter(s, ctx),
      sortOrder: i,
    }));
    setDraft({...draft, sourceStarter: key, items: [...archived, ...seeded]});
  };

  const duplicateFromBranch = async (sourceBizId) => {
    try {
      const tpl = await readChecklistDoc(`biz:${sourceBizId}:checklist_template`);
      if (!tpl || !Array.isArray(tpl.items)) {
        alert("לסניף המקור אין צ׳ק ליסט להעתקה.");
        return;
      }
      const activeSrc = tpl.items.filter(it => it.active);
      if (!confirm(`להעתיק ${activeSrc.length} פריטים מהסניף הנבחר? פריטים קיימים יישארו כארכיון.`)) return;
      const archived = draft.items.map(x => x.active ? {...x, active:false, archivedAt: Date.now(), archivedBy: ctx.userId} : x);
      const copied = activeSrc.map((src,i) => ({
        ...src,
        id: newId("ci"),
        tenantId: ctx.tenantId, businessId: ctx.businessId, branchId: ctx.branchId,
        sortOrder: i,
        sourceSystemTemplateItemId: src.sourceSystemTemplateItemId || null,
        createdAt: Date.now(), updatedAt: Date.now(),
        createdBy: ctx.userId, updatedBy: ctx.userId,
        active: true, archivedAt: null, archivedBy: null,
      }));
      setDraft({...draft, items: [...archived, ...copied]});
      setDupOpen(false);
    } catch(e) {
      alert("טעינה נכשלה: " + (e?.message || e));
    }
  };

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",display:"flex",alignItems:"center",justifyContent:"center",padding:"12px",zIndex:9999}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#FFFFFF",borderRadius:12,padding:16,width:"100%",maxWidth:780,maxHeight:"94vh",overflowY:"auto"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <h2 style={{margin:0,fontSize:15,fontWeight:700,color:"#111827"}}>עריכת תבנית צ׳ק ליסט</h2>
          <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:18,color:"#9CA3AF"}}>✕</button>
        </div>

        {/* Toolbar */}
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
          <select onChange={e => { if (e.target.value) initFromStarter(e.target.value); e.target.value=""; }} defaultValue=""
            style={{padding:"7px 10px",border:"1px solid #E5E7EB",borderRadius:8,background:"#F9FAFB",color:"#111827",fontFamily:"inherit",fontSize:11}}>
            <option value="">↺ אתחל מתבנית מוכנה…</option>
            {Object.entries(STARTER_TEMPLATES).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
          </select>
          {(businesses || []).filter(b => b.id !== ctx.branchId).length > 0 && (
            <button onClick={() => setDupOpen(true)}
              style={{padding:"7px 10px",border:"1px solid #E5E7EB",borderRadius:8,background:"#F9FAFB",color:"#111827",fontFamily:"inherit",fontSize:11,cursor:"pointer"}}>
              📋 שכפל מסניף אחר
            </button>
          )}
        </div>

        {/* Day-of-week / daily tabs */}
        <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:10,padding:6,background:"#F9FAFB",borderRadius:8}}>
          <button onClick={()=>setTab("daily")}
            style={{padding:"6px 12px",borderRadius:6,border:"none",background:tab==="daily"?"#111827":"transparent",color:tab==="daily"?"#FFFFFF":"#6B7280",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
            יומי
          </button>
          {DOW_KEYS.map((k,i) => (
            <button key={k} onClick={()=>setTab(k)}
              style={{padding:"6px 12px",borderRadius:6,border:"none",background:tab===k?"#1D4ED8":"transparent",color:tab===k?"#FFFFFF":"#6B7280",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
              {DOW_HE_FULL[i]}
            </button>
          ))}
        </div>

        <p style={{margin:"0 0 12px",fontSize:11,color:"#6B7280",lineHeight:1.5}}>
          {tab === "daily"
            ? "פריטים יומיים מופיעים בכל יום ובכל סוג משמרת."
            : `פריטים שבועיים מופיעים רק ביום ${DOW_HE_FULL[DOW_KEYS.indexOf(tab)]} — בנוסף לפריטים היומיים.`}
        </p>

        {PHASE_META.map(({key, emoji, label}) => {
          const bucket = draft.items
            .filter(it => it.active && it.checklistType === key && (tab === "daily" ? it.scheduleType === "daily" : (it.scheduleType === "weekly" && it.dayOfWeek === tab)))
            .sort((a,b) => a.sortOrder - b.sortOrder);
          const groups = bucket.reduce((m,it) => { (m[it.area || "כללי"] = m[it.area || "כללי"] || []).push(it); return m; }, {});
          return (
            <div key={key} style={{marginBottom:14,border:"1px solid #E5E7EB",borderRadius:8,padding:"8px 10px"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
                <h3 style={{margin:0,fontSize:13,fontWeight:700,color:"#111827"}}>{emoji} {label} <span style={{color:"#9CA3AF",fontWeight:400,fontSize:11}}>· {bucket.length}</span></h3>
                <button onClick={() => setEditingItem({
                  id: newId("ci"),
                  tenantId: ctx.tenantId, businessId: ctx.businessId, branchId: ctx.branchId,
                  checklistType: key, scheduleType: tab === "daily" ? "daily" : "weekly", dayOfWeek: tab === "daily" ? null : tab,
                  area: "כללי", title: "", description: "",
                  isRequired: false, requiresPhoto: false, priority: "medium",
                  sortOrder: bucket.length, defaultPosition: null, active: true,
                  sourceSystemTemplateItemId: null,
                  createdAt: Date.now(), updatedAt: Date.now(),
                  createdBy: ctx.userId, updatedBy: ctx.userId,
                  archivedAt: null, archivedBy: null,
                })}
                  style={{padding:"5px 12px",background:"#111827",border:"none",borderRadius:6,color:"#FFFFFF",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                  + פריט
                </button>
              </div>
              {bucket.length === 0 ? (
                <p style={{margin:"6px 4px",fontSize:11,color:"#9CA3AF"}}>אין פריטים. הוסף את הראשון למעלה.</p>
              ) : (
                Object.entries(groups).map(([area, items]) => (
                  <div key={area} style={{marginBottom:8}}>
                    <div style={{fontSize:10,fontWeight:700,color:"#9CA3AF",textTransform:"uppercase",letterSpacing:0.5,padding:"4px 2px"}}>{area}</div>
                    {items.map((it,idx) => (
                      <div key={it.id} style={{display:"flex",alignItems:"center",gap:6,padding:"6px 8px",border:"1px solid #F3F4F6",borderRadius:6,marginBottom:4}}>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:12,fontWeight:600,color:"#111827"}}>{it.title || <span style={{color:"#DC2626"}}>(ללא כותרת)</span>}</div>
                          <div style={{fontSize:10,color:"#9CA3AF",marginTop:2}}>
                            {PRIORITY_META[it.priority].label}
                            {it.isRequired && " · נדרש"}
                            {it.requiresPhoto && " · 📷"}
                          </div>
                        </div>
                        <button onClick={()=>move(it.id, -1)} disabled={idx===0} style={{background:"none",border:"none",cursor:idx===0?"default":"pointer",color:idx===0?"#D1D5DB":"#6B7280",fontSize:12,padding:"2px 6px"}}>▲</button>
                        <button onClick={()=>move(it.id, +1)} disabled={idx===items.length-1} style={{background:"none",border:"none",cursor:idx===items.length-1?"default":"pointer",color:idx===items.length-1?"#D1D5DB":"#6B7280",fontSize:12,padding:"2px 6px"}}>▼</button>
                        <button onClick={()=>setEditingItem(it)} style={{background:"none",border:"none",cursor:"pointer",color:"#1D4ED8",fontSize:11,padding:"2px 6px",fontWeight:600}}>ערוך</button>
                        <button onClick={()=>softDelete(it.id)} style={{background:"none",border:"none",cursor:"pointer",color:"#DC2626",fontSize:11,padding:"2px 6px",fontWeight:600}}>הסר</button>
                      </div>
                    ))}
                  </div>
                ))
              )}
            </div>
          );
        })}

        {/* Archive viewer */}
        {archivedCount > 0 && (
          <details style={{marginBottom:10,padding:"8px 10px",background:"#F9FAFB",borderRadius:8,border:"1px solid #E5E7EB"}}>
            <summary style={{cursor:"pointer",fontSize:11,fontWeight:700,color:"#6B7280"}}>
              ארכיון ({archivedCount} פריטים מוסרים) — לא יופיעו במשמרת
            </summary>
            <div style={{marginTop:8}}>
              {draft.items.filter(x => !x.active).map(it => (
                <div key={it.id} style={{display:"flex",alignItems:"center",gap:6,padding:"4px 0",fontSize:11,color:"#9CA3AF"}}>
                  <span style={{flex:1}}>{it.title} <span style={{color:"#D1D5DB"}}>· {PHASE_META.find(p=>p.key===it.checklistType)?.label} · {it.scheduleType === "weekly" ? `שבועי-${DOW_HE_FULL[DOW_KEYS.indexOf(it.dayOfWeek)]}` : "יומי"}</span></span>
                  <button onClick={()=>restore(it.id)} style={{background:"none",border:"none",cursor:"pointer",color:"#15803D",fontSize:11,fontWeight:600}}>שחזר</button>
                </div>
              ))}
            </div>
          </details>
        )}

        <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:10}}>
          <button onClick={onClose} style={{padding:"9px 16px",background:"#F9FAFB",border:"1px solid #E5E7EB",borderRadius:8,color:"#6B7280",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>ביטול</button>
          <button onClick={()=>onSave(draft)} style={{padding:"9px 16px",background:"#111827",border:"none",borderRadius:8,color:"#FFFFFF",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>שמור</button>
        </div>

        {editingItem && (
          <ItemFormModal
            item={editingItem}
            onClose={()=>setEditingItem(null)}
            onSave={upsertItem}
          />
        )}

        {dupOpen && (
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:10000,padding:12}} onClick={()=>setDupOpen(false)}>
            <div onClick={e=>e.stopPropagation()} style={{background:"#FFFFFF",borderRadius:12,padding:18,width:"100%",maxWidth:420}}>
              <h3 style={{margin:"0 0 10px",fontSize:14,fontWeight:700,color:"#111827"}}>שכפל מסניף</h3>
              <p style={{margin:"0 0 12px",fontSize:11,color:"#6B7280",lineHeight:1.5}}>פריטים פעילים מהסניף הנבחר יועתקו לכאן עם IDs חדשים. הפריטים הקיימים יסומנו כארכיון.</p>
              {(businesses || []).filter(b => b.id !== ctx.branchId).map(b => (
                <button key={b.id} onClick={()=>duplicateFromBranch(b.id)}
                  style={{display:"block",width:"100%",padding:"10px 12px",marginBottom:6,background:"#F9FAFB",border:"1px solid #E5E7EB",borderRadius:8,color:"#111827",textAlign:"right",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
                  {b.name || b.id}
                </button>
              ))}
              <button onClick={()=>setDupOpen(false)} style={{marginTop:6,padding:"7px 14px",background:"#F9FAFB",border:"1px solid #E5E7EB",borderRadius:8,color:"#6B7280",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>ביטול</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Item form (add/edit a single template item) ─────────────────────────────
function ItemFormModal({ item, onClose, onSave }){
  const [form, setForm] = React.useState({...item});
  const set = (k,v) => setForm(prev => ({...prev, [k]: v}));
  const save = () => {
    if (!form.title.trim()) { alert("יש למלא כותרת"); return; }
    onSave(form);
  };
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:10000,padding:12}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#FFFFFF",borderRadius:12,padding:18,width:"100%",maxWidth:520,maxHeight:"90vh",overflowY:"auto"}}>
        <h3 style={{margin:"0 0 12px",fontSize:14,fontWeight:700,color:"#111827"}}>פריט צ׳ק ליסט</h3>

        <label style={{fontSize:11,fontWeight:700,color:"#6B7280"}}>כותרת *</label>
        <input value={form.title} onChange={e=>set("title", e.target.value)}
          style={{width:"100%",padding:"8px 10px",border:"1px solid #E5E7EB",borderRadius:8,fontSize:13,fontFamily:"inherit",marginBottom:10,marginTop:4}}/>

        <label style={{fontSize:11,fontWeight:700,color:"#6B7280"}}>תיאור</label>
        <textarea value={form.description} onChange={e=>set("description", e.target.value)}
          style={{width:"100%",minHeight:50,padding:"8px 10px",border:"1px solid #E5E7EB",borderRadius:8,fontSize:12,fontFamily:"inherit",resize:"vertical",marginBottom:10,marginTop:4}}/>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
          <div>
            <label style={{fontSize:11,fontWeight:700,color:"#6B7280"}}>אזור</label>
            <input list="area-suggest" value={form.area} onChange={e=>set("area", e.target.value)}
              style={{width:"100%",padding:"8px 10px",border:"1px solid #E5E7EB",borderRadius:8,fontSize:12,fontFamily:"inherit",marginTop:4}}/>
            <datalist id="area-suggest">{STARTER_AREAS.map(a => <option key={a} value={a}/>)}</datalist>
          </div>
          <div>
            <label style={{fontSize:11,fontWeight:700,color:"#6B7280"}}>עדיפות</label>
            <select value={form.priority} onChange={e=>set("priority", e.target.value)}
              style={{width:"100%",padding:"8px 10px",border:"1px solid #E5E7EB",borderRadius:8,fontSize:12,fontFamily:"inherit",marginTop:4,background:"#FFFFFF"}}>
              {Object.entries(PRIORITY_META).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
            </select>
          </div>
        </div>

        <div style={{display:"flex",gap:12,marginBottom:10,padding:"8px 10px",background:"#F9FAFB",borderRadius:8}}>
          <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"#111827",cursor:"pointer"}}>
            <input type="checkbox" checked={!!form.isRequired} onChange={e=>set("isRequired", e.target.checked)}/>
            נדרש
          </label>
          <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"#111827",cursor:"pointer"}}>
            <input type="checkbox" checked={!!form.requiresPhoto} onChange={e=>set("requiresPhoto", e.target.checked)}/>
            דורש צילום
          </label>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
          <div>
            <label style={{fontSize:11,fontWeight:700,color:"#6B7280"}}>סוג צ׳ק ליסט</label>
            <select value={form.checklistType} onChange={e=>set("checklistType", e.target.value)}
              style={{width:"100%",padding:"8px 10px",border:"1px solid #E5E7EB",borderRadius:8,fontSize:12,fontFamily:"inherit",marginTop:4,background:"#FFFFFF"}}>
              {PHASE_META.map(p => <option key={p.key} value={p.key}>{p.label}</option>)}
            </select>
          </div>
          <div>
            <label style={{fontSize:11,fontWeight:700,color:"#6B7280"}}>תדירות</label>
            <select value={form.scheduleType} onChange={e=>{
              const v = e.target.value;
              set("scheduleType", v);
              if (v === "daily") set("dayOfWeek", null);
              else if (!form.dayOfWeek) set("dayOfWeek", "sun");
            }}
              style={{width:"100%",padding:"8px 10px",border:"1px solid #E5E7EB",borderRadius:8,fontSize:12,fontFamily:"inherit",marginTop:4,background:"#FFFFFF"}}>
              <option value="daily">יומי</option>
              <option value="weekly">שבועי</option>
            </select>
          </div>
          {form.scheduleType === "weekly" && (
            <div style={{gridColumn:"1 / -1"}}>
              <label style={{fontSize:11,fontWeight:700,color:"#6B7280"}}>יום בשבוע</label>
              <select value={form.dayOfWeek || "sun"} onChange={e=>set("dayOfWeek", e.target.value)}
                style={{width:"100%",padding:"8px 10px",border:"1px solid #E5E7EB",borderRadius:8,fontSize:12,fontFamily:"inherit",marginTop:4,background:"#FFFFFF"}}>
                {DOW_KEYS.map((k,i) => <option key={k} value={k}>{DOW_HE_FULL[i]}</option>)}
              </select>
            </div>
          )}
        </div>

        <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
          <button onClick={onClose} style={{padding:"9px 16px",background:"#F9FAFB",border:"1px solid #E5E7EB",borderRadius:8,color:"#6B7280",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>ביטול</button>
          <button onClick={save} style={{padding:"9px 16px",background:"#111827",border:"none",borderRadius:8,color:"#FFFFFF",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>שמור</button>
        </div>
      </div>
    </div>
  );
}

function DailyInsightsScreen({ tenantId, bizId }) {
  const [docs, setDocs] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState(null);
  const [days, setDays] = React.useState(30); // window size

  // Pull the last `days` docs from Firebase.
  React.useEffect(() => {
    let cancelled = false;
    setLoading(true); setError(null);
    (async () => {
      try {
        if (!tenantId || !bizId) {
          if (!cancelled) { setDocs([]); setLoading(false); }
          return;
        }
        // Build the date keys backwards from today.
        // C1 (H-06 / W-03): keys from the shared Israel business date when the core is ready.
        let keys = [];
        const __F = window.__marjinFinance && window.__marjinFinance.state === "ready" ? window.MarjinFinance : null;
        if (__F) keys = window.MarjinC1.insightsKeys(__F, __F.finance.businessDate.israelBusinessDate(Date.now()), days);
        else {
          const today = new Date();
          for (let i = 1; i <= days; i++) {
            const d = new Date(today);
            d.setDate(d.getDate() - i);
            keys.push(d.toLocaleDateString("en-CA", { timeZone: "Asia/Jerusalem" }));
          }
        }
        // Read each in parallel via storage.get. Misses come back as null.
        // readChecklistDoc unwraps the {key, value, shared} envelope returned
        // by window.storage.get; same helper used by the checklist screen.
        const sortedKeys = [...keys].sort();
        let rangeMap = {};
        try { rangeMap = await apiGetDailyRange("analytics", bizId, sortedKeys[0], sortedKeys[sortedKeys.length - 1]); } catch (_) { rangeMap = {}; }
        const results = keys.map(k => rangeMap[k] || null);
        const filled = results
          .map((raw, i) => {
            if (!raw) return { date: keys[i], _missing: true };
            return raw;
          })
          .filter(Boolean);
        if (!cancelled) { setDocs(filled); setLoading(false); }
      } catch (err) {
        if (!cancelled) { setError(String(err?.message || err)); setLoading(false); }
      }
    })();
    return () => { cancelled = true; };
  }, [tenantId, bizId, days]);

  const present = docs.filter(d => !d._missing);
  const presentCount = present.length;
  const missingCount = docs.length - presentCount;

  // ── Derived stats ──
  // C1 (I-01…I-03): only documents that RECORD a revenue total count; an absent total is a
  // gap ("—"), never ₪0. Formatting through the core presenters; exact mean.
  const __Fi = window.__marjinFinance && window.__marjinFinance.state === "ready" ? window.MarjinFinance : null;
  const revStats = __Fi ? window.MarjinC1.insightsStats(__Fi, present) : { status: "unavailable" };
  const alertDays = present.filter(d => d.alerts?.is_alert_day).length;
  const rainDays = present.filter(d => d.weather?.is_rain_day).length;
  const warDays = present.filter(d => d.operational?.war_day === "full" || d.operational?.war_day === "partial").length;

  // Chart data (oldest → newest)
  const chartData = [...present]
    .sort((a, b) => a.date.localeCompare(b.date))
    .map(d => ({
      date: d.date.slice(5), // MM-DD only for axis
      revenue: window.MarjinC1.insightTotal(d),
      rain: d.weather?.rain_mm || 0,
      alerts: d.alerts?.alert_count || 0,
    }));

  const DOW_HE = ["א'", "ב'", "ג'", "ד'", "ה'", "ו'", "ש'"];
  const warDayColor = {
    regular: { bg: "#F0FDF4", fg: "#166534", label: "רגיל" },
    partial: { bg: "#FFFBEB", fg: "#92400E", label: "חלקי" },
    full:    { bg: "#FEF2F2", fg: "#991B1B", label: "סגור" },
    unknown: { bg: "#F3F4F6", fg: "#6B7280", label: "—" },
  };

  return (
    <div className="screen">
      <div className="card card-p">
        {/* Header */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
          <div>
            <h2 style={{margin:0,fontSize:14,fontWeight:700,color:"#111827"}}>תובנות יומיות</h2>
            <p style={{margin:"2px 0 0",fontSize:11,color:"#9CA3AF"}}>
              קרון ה-analytics אוסף נתוני מזג אוויר, אזעקות ומחזור לכל יום. הצגה מהלילה האחרון.
            </p>
          </div>
          <select
            value={days}
            onChange={e => setDays(Number(e.target.value))}
            style={{padding:"8px 12px",border:"1px solid #E5E7EB",borderRadius:8,background:"#F9FAFB",color:"#111827",fontFamily:"inherit",fontSize:12}}>
            <option value={7}>7 ימים אחרונים</option>
            <option value={14}>14 ימים אחרונים</option>
            <option value={30}>30 ימים אחרונים</option>
            <option value={60}>60 ימים אחרונים</option>
            <option value={90}>90 ימים אחרונים</option>
          </select>
        </div>

        {/* Status banner */}
        {loading && (
          <div style={{padding:"20px",textAlign:"center",color:"#9CA3AF",fontSize:12}}>טוען…</div>
        )}
        {error && (
          <div style={{padding:"12px 14px",background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:8,marginBottom:12,color:"#991B1B",fontSize:12}}>
            שגיאה: {error}
          </div>
        )}
        {!loading && !error && presentCount === 0 && (
          <div style={{padding:"20px",textAlign:"center",color:"#9CA3AF",fontSize:12,lineHeight:1.6}}>
            אין עדיין מספיק נתונים להצגת תובנות.
            <br/>הקרון רץ כל לילה ב-02:00 ושומר מסמך לכל עסק. נסה שוב לאחר הריצה הבאה.
          </div>
        )}

        {/* KPI strip */}
        {!loading && !error && presentCount > 0 && (
          <>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:14}}>
              <KpiTile label="ימים זמינים" value={`${presentCount}/${docs.length}`} sub={missingCount ? `${missingCount} חסרים` : "מלא"}/>
              <KpiTile label="מחזור ממוצע" value={revStats.status==="ready" ? revStats.avgText : "—"} sub={revStats.status==="ready" ? `לכל יום שנרשם בו מחזור (${revStats.revenueDays})` : "לא זמין"}/>
              <KpiTile label="ימי אזעקות" value={String(alertDays)} sub={alertDays ? "ראה טבלה" : "אין"}/>
              <KpiTile label="ימי גשם" value={String(rainDays)} sub={`> 1 מ"מ`}/>
            </div>

            {/* Chart */}
            {chartData.length >= 2 && typeof Recharts !== "undefined" && (() => {
              const { ResponsiveContainer, LineChart, Line, XAxis, YAxis, Tooltip, CartesianGrid, ReferenceDot } = Recharts;
              return (
                <div style={{height:200,marginBottom:14}}>
                  <ResponsiveContainer width="100%" height="100%">
                    <LineChart data={chartData} margin={{top:8,right:8,left:0,bottom:0}}>
                      <CartesianGrid stroke="#F3F4F6" vertical={false}/>
                      <XAxis dataKey="date" tick={{fontSize:10,fill:"#9CA3AF"}}/>
                      <YAxis tick={{fontSize:10,fill:"#9CA3AF"}} width={50}/>
                      <Tooltip
                        contentStyle={{fontSize:11,border:"1px solid #E5E7EB",borderRadius:6}}
                        labelStyle={{color:"#6B7280"}}
                        formatter={(v, name) => {
                          if (name === "revenue") return [(v === null || v === undefined || !__Fi) ? "—" : __Fi.presenters.money.formatShekel(String(v)), "מחזור"];
                          if (name === "rain") return [`${v} מ"מ`, "גשם"];
                          if (name === "alerts") return [v, "אזעקות"];
                          return [v, name];
                        }}/>
                      <Line type="monotone" dataKey="revenue" stroke="#0F172A" strokeWidth={2} dot={false}/>
                      {chartData.map((d, i) =>
                        d.alerts > 0 ? <ReferenceDot key={"a"+i} x={d.date} y={d.revenue} r={4} fill="#DC2626" stroke="none"/> : null
                      )}
                      {chartData.map((d, i) =>
                        d.rain > 1 ? <ReferenceDot key={"r"+i} x={d.date} y={d.revenue} r={4} fill="#3B82F6" stroke="none"/> : null
                      )}
                    </LineChart>
                  </ResponsiveContainer>
                  <div style={{fontSize:10,color:"#9CA3AF",textAlign:"center",marginTop:4}}>
                    קו: מחזור · נקודה אדומה: יום עם אזעקות · נקודה כחולה: יום גשם
                  </div>
                </div>
              );
            })()}

            {/* Table */}
            <div style={{overflowX:"auto",border:"1px solid #E5E7EB",borderRadius:8}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:11,fontFamily:"inherit"}}>
                <thead>
                  <tr style={{background:"#F9FAFB",borderBottom:"1px solid #E5E7EB"}}>
                    <Th>תאריך</Th>
                    <Th>יום</Th>
                    <Th>חג</Th>
                    <Th align="left">מחזור</Th>
                    <Th align="left">מ"מ</Th>
                    <Th align="left">טמפ׳</Th>
                    <Th align="left">אזעקות</Th>
                    <Th align="center">סטטוס</Th>
                  </tr>
                </thead>
                <tbody>
                  {docs.map(d => {
                    if (d._missing) {
                      return (
                        <tr key={d.date} style={{background:"#FAFAFA"}}>
                          <Td>{d.date}</Td>
                          <Td colSpan={7} style={{color:"#9CA3AF",textAlign:"center",fontStyle:"italic"}}>—</Td>
                        </tr>
                      );
                    }
                    const w = warDayColor[d.operational?.war_day] || warDayColor.unknown;
                    const holidayLabel = d.calendar?.holiday_names?.[0] || (d.calendar?.holiday_eve ? "ערב חג" : "");
                    return (
                      <tr key={d.date} style={{borderBottom:"1px solid #F3F4F6"}}>
                        <Td>{d.date.slice(5)}</Td>
                        <Td>{DOW_HE[d.calendar?.dow ?? -1] || "—"}{d.calendar?.weekend ? " 🛋" : ""}</Td>
                        <Td style={{color:holidayLabel?"#111827":"#D1D5DB",maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{holidayLabel||"—"}</Td>
                        <Td align="left" style={{fontVariantNumeric:"tabular-nums",fontWeight:d.revenue?.had_entry?700:400,color:d.revenue?.had_entry?"#111827":"#9CA3AF"}}>
                          {__Fi ? window.MarjinC1.insightMoney(__Fi, d) : "—"}
                        </Td>
                        <Td align="left" style={{color:d.weather?.is_rain_day?"#1D4ED8":"#9CA3AF"}}>
                          {d.weather?.rain_mm == null ? "—" : d.weather.rain_mm.toFixed(1)}
                        </Td>
                        <Td align="left" style={{color:"#6B7280"}}>
                          {d.weather?.temp_avg == null ? "—" : `${d.weather.temp_avg.toFixed(0)}°`}
                        </Td>
                        <Td align="left" style={{color:d.alerts?.alert_count?"#991B1B":"#9CA3AF",fontWeight:d.alerts?.alert_count?700:400}}>
                          {d.alerts ? (d.alerts.alert_count > 0 ? `${d.alerts.alert_count} · ${d.alerts.alert_minutes}'` : "0") : "—"}
                        </Td>
                        <Td align="center">
                          <span style={{padding:"2px 8px",borderRadius:99,background:w.bg,color:w.fg,fontSize:10,fontWeight:700}}>{w.label}</span>
                        </Td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            <p style={{margin:"10px 0 0",fontSize:10,color:"#9CA3AF",lineHeight:1.5}}>
              סטטוס "חלקי" = הייתה הזנת מכירות ביום עם אזעקות. "סגור" = יום עם אזעקות וללא הזנה. "רגיל" = יום ללא אזעקות.
              <br/>
              מקור הנתונים: <code style={{background:"#F3F4F6",padding:"1px 4px",borderRadius:3}}>tenants/{"{tid}"}/biz:{"{bid}"}:analytics:daily:{"{date}"}</code> — נכתב מדי לילה ב-02:00 IST.
            </p>
          </>
        )}
      </div>
    </div>
  );
}

// Tiny helpers used by DailyInsightsScreen. If these names already exist
// in index.html (e.g. `fmt`), reuse them instead.
function KpiTile({ label, value, sub }) {
  return (
    <div style={{background:"#F8FAFC",borderRadius:8,padding:"10px 12px",border:"1px solid #E2E8F0"}}>
      <div style={{fontSize:10,color:"#94A3B8",fontWeight:600,marginBottom:4}}>{label}</div>
      <div style={{fontSize:16,fontWeight:700,color:"#0F172A",letterSpacing:-0.3}}>{value}</div>
      <div style={{fontSize:10,color:"#9CA3AF",marginTop:2}}>{sub}</div>
    </div>
  );
}
function Th({ children, align }) {
  return <th style={{padding:"8px 10px",textAlign:align||"right",fontSize:10,fontWeight:700,color:"#6B7280",textTransform:"uppercase",letterSpacing:0.5}}>{children}</th>;
}
function Td({ children, align, colSpan, style }) {
  return <td colSpan={colSpan} style={{padding:"8px 10px",textAlign:align||"right",color:"#111827",...style}}>{children}</td>;
}

function ForecastScreen({ tenantId="", bizId="", metrics, lastYear, saveLastYear, currentMonth, entries=[], businessConfig={}, TARGETS={salesGrowthPct:5,foodCostPct:33,laborCostPct:27} }) {
  const fileRef = useRef();
  const [mode, setMode] = useState("view"); // view | manual | mapCols
  const [lyDraft, setLyDraft] = useState(() => lastYear.map(m=>({...m})));
  const [headers, setHeaders] = useState([]);
  const [rawRows, setRawRows] = useState([]);
  const [colMap, setColMap] = useState({ month:"", sales:"", food:"", labor:"", gross:"", fixed:"" });
  const [uploadError, setUploadError] = useState("");

  const ly = lastYear[currentMonth];

  // ── Forecast math -- ממוצע 6 מופעים אחרונים לכל יום שבוע ──
  const rem  = DAYS_IN_MONTH - DAY_OF_MONTH;

  // For each remaining day of month, find last 6 entries with same DOW
  const getDowAvg = (entries, targetDow, field) => {
    const matches = [...entries]
      .filter(e => getDateDOW(e.date) === targetDow)
      .sort((a,b) => b.date.localeCompare(a.date))
      .slice(0, 6);
    if (!matches.length) return null;
    const sum = matches.reduce((a,e) => {
      if (field === 'sales')  return a + (Number(e.sales)||0)+(Number(e.deliveries)||0)+(Number(e.other_income)||0);
      if (field === 'food')   return a + (e.supplier_payments?Object.values(e.supplier_payments).filter(v=>v!=='skip').reduce((x,y)=>x+(Number(y)||0),0):0);
      if (field === 'labor')  return a + (Number(e.payroll)||0) + (e.hourly_payroll?Object.values(e.hourly_payroll).reduce((s,v)=>s+(Number(v)||0),0):0);
      return 0;
    }, 0);
    return sum / matches.length;
  };

  // Sum forecasted remaining days
  const { fSalesExtra, fFoodExtra, fLaborExtra, dowDetails } = (() => {
    let fSalesExtra = 0, fFoodExtra = 0, fLaborExtra = 0;
    const dowDetails = {}; // dow → { avg, count, days }
    const fallbackDailySales  = metrics.totalSales   / Math.max(DAY_OF_MONTH,1);
    const fallbackDailyFood   = metrics.totalFood    / Math.max(DAY_OF_MONTH,1);
    const fallbackDailyLabor  = metrics.totalPayroll / Math.max(DAY_OF_MONTH,1);
    for(let d = DAY_OF_MONTH+1; d <= DAYS_IN_MONTH; d++) {
      const ds = `${YEAR}-${MONTH_STR}-${String(d).padStart(2,"0")}`;
      const dow = getDateDOW(ds);
      if(dow === 6) continue; // שבת
      const avgS = getDowAvg(entries, dow, 'sales')  ?? fallbackDailySales;
      const avgF = getDowAvg(entries, dow, 'food')   ?? fallbackDailyFood;
      const avgL = getDowAvg(entries, dow, 'labor')  ?? fallbackDailyLabor;
      fSalesExtra += avgS;
      fFoodExtra  += avgF;
      fLaborExtra += avgL;
      if(!dowDetails[dow]) {
        const cnt = [...entries].filter(e=>getDateDOW(e.date)===dow).length;
        dowDetails[dow] = { avg: Math.round(avgS), count: Math.min(cnt,6), days: [] };
      }
      dowDetails[dow].days.push(d);
    }
    return { fSalesExtra, fFoodExtra, fLaborExtra, dowDetails };
  })();

  // REV_FORECAST/v1 — canonical revenue forecast is the single headline number.
  // (fSalesExtra/dowDetails retained only for the illustrative weekday breakdown.)
  const __mfToday = new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Jerusalem"});
  const __mf = window.MarjinForecast.computeRevenueForecast({tenantId:(tenantId||null),bizId:(bizId||null),today:__mfToday,targetMonth:__mfToday.slice(0,7),history:window.MarjinForecast.entriesToForecastDays(entries)});
  const __mfCard = window.MarjinForecast.buildForecastCardModel(__mf);
  const fSales = __mf.monthEndForecastRevenue!=null ? __mf.monthEndForecastRevenue : (metrics.totalSales + fSalesExtra);
  const fFood  = metrics.totalFood    + fFoodExtra;
  const fLabor = metrics.totalPayroll + fLaborExtra;

  const fFoodPct  = fSales > 0 ? (fFood  / fSales) * 100 : 0;
  const fLaborPct = fSales > 0 ? (fLabor / fSales) * 100 : 0;
  const fGross    = 100 - fFoodPct - fLaborPct - (businessConfig.rentPct||0) - (businessConfig.hasRoyalty?(businessConfig.royaltyPct||0):0);

  // fcColor now defined at module scope
  const dlt  = (cur,prv,inv) => { const d=cur-prv; const good=inv?d<0:d>0; return { str:`${d>=0?"+":""}${d.toFixed(1)}%`, good }; };
  const dltA = (cur,prv,inv) => { const d=cur-prv; const good=inv?d<0:d>0; return { str:`${d>=0?"+":""}${fmt(Math.round(d))}`, good }; };

  // ── Excel parse ──
  const handleFile = (file) => {
    setUploadError("");
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb   = XLSX.read(new Uint8Array(ev.target.result), { type:"array" });
        const ws   = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:"" });
        if (rows.length < 2) { setUploadError("הקובץ ריק"); return; }
        const hdrs = rows[0].map(h => String(h).trim());
        setHeaders(hdrs);
        setRawRows(rows.slice(1).filter(r => r.some(c => c !== "")));
        // auto-detect columns
        const cm = { month:"", sales:"", food:"", labor:"", gross:"", fixed:"" };
        hdrs.forEach(h => {
          const l = h.toLowerCase();
          if (!cm.month  && (l.includes("חוד")  || l.includes("month")))            cm.month  = h;
          if (!cm.sales  && (l.includes("מכיר") || l.includes("הכנסות") || l.includes("sales"))) cm.sales = h;
          if (!cm.food   && (l.includes("פוד")  || l.includes("food")   || l.includes("סחורה"))) cm.food  = h;
          if (!cm.labor  && (l.includes("שכר")  || l.includes("labor")  || l.includes("עובד")))  cm.labor = h;
          if (!cm.gross  && (l.includes("רווח") || l.includes("gross")))             cm.gross  = h;
          if (!cm.fixed  && (l.includes("קבוע") || l.includes("fixed")))             cm.fixed  = h;
        });
        setColMap(cm);
        setMode("mapCols");
      } catch(e) { setUploadError("שגיאה בקריאת הקובץ"); }
    };
    reader.readAsArrayBuffer(file);
  };

  const confirmImport = () => {
    const hIdx = h => headers.indexOf(h);
    const num  = (row, col) => col ? Number(String(row[hIdx(col)]||"0").replace(/[%,₪\s]/g,"")) || 0 : 0;
    const updated = lastYear.map(m=>({...m}));
    rawRows.forEach(row => {
      if (!colMap.month) return;
      const raw = String(row[hIdx(colMap.month)]||"").trim().toLowerCase().replace(/['\s]/g,"");
      const mi  = MONTH_IDX[raw] ?? MONTH_IDX[raw.slice(0,3)];
      if (mi === undefined) return;
      updated[mi] = { month:mi, sales:num(row,colMap.sales), foodCostPct:num(row,colMap.food), laborCostPct:num(row,colMap.labor), grossProfitPct:num(row,colMap.gross), fixedExpenses:num(row,colMap.fixed) };
    });
    saveLastYear(updated);
    setLyDraft(updated);
    setMode("view");
  };

  return (
    <div>

      {/* ── Forecast card ── */}
      {(()=>{
        const tSales  = Math.round((lastYear[currentMonth]?.sales||650000)*(1+(cfgTarget(businessConfig,"salesGrowthPct",TARGETS.salesGrowthPct)/100)));
        const tNet    = fSales > 0 ? (fSales*(1-cfgTarget(businessConfig,"foodCostPct",TARGETS.foodCostPct)/100-cfgTarget(businessConfig,"laborCostPct",TARGETS.laborCostPct)/100-((businessConfig.rentType==="pct"?(businessConfig.rentPct||0):0)+(businessConfig.hasRoyalty?businessConfig.royaltyPct||0:0))/100)-metrics.fixedRegular-(businessConfig.rentType==="fixed"?(businessConfig.rentFixed||0):0)) : 0;
        const tNetPct = fSales > 0 ? (tNet/fSales)*100 : 0;
        return (
          <div className="card card-p" style={{ marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
              <div style={{fontSize:11,fontWeight:700,color:"#6B7280",textTransform:"uppercase",letterSpacing:1}}>
                {__mfCard.title} — REV_FORECAST/v1
              </div>
              <div style={{fontSize:11,color:"#9CA3AF"}}>יום {DAY_OF_MONTH}/{DAYS_IN_MONTH}</div>
            </div>
            <div style={{marginBottom:12,fontSize:12,color:"#374151",lineHeight:1.9}}>
              <div>{__mfCard.actualLine}</div>
              <div>{__mfCard.remainingLine}</div>
              <div style={{fontWeight:700,color:__mfCard.suppressed?"#B45309":"#111827"}}>{__mfCard.monthEndLine}</div>
              <div style={{color:"#6B7280"}}>{__mfCard.completenessLine} · {__mfCard.confidenceLine}</div>
              {__mfCard.missingWarning && <div style={{color:"#92400E",background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:6,padding:"6px 10px",marginTop:6}}>{__mfCard.missingWarning}</div>}
              {__mfCard.partialNote && <div style={{color:"#6B7280",marginTop:4}}>{__mfCard.partialNote}</div>}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:6}}>
              <MetricBox label="הכנסות חזויות"
                value={fmt(Math.round(fSales))}
                color={fSales>=tSales?"#16A34A":"#D97706"}
                sub={`יעד: ${fmt(tSales)}`} />
              <MetricBox label="פוד קוסט"
                value={fmtPct(fFoodPct)}
                color={fcColor(fFoodPct, cfgTarget(businessConfig,"foodCostPct",TARGETS.foodCostPct))}
                sub={`יעד ${cfgTarget(businessConfig,"foodCostPct",TARGETS.foodCostPct)}%`} />
              <MetricBox label="לייבור קוסט"
                value={fmtPct(fLaborPct)}
                color={fcColor(fLaborPct, cfgTarget(businessConfig,"laborCostPct",TARGETS.laborCostPct))}
                sub={`יעד ${cfgTarget(businessConfig,"laborCostPct",TARGETS.laborCostPct)}%`} />
              <MetricBox label="רווח נקי חזוי"
                value={fmt(Math.round(tNet))}
                color={tNet>0?"#16A34A":"#DC2626"}
                sub={`${fmtPct(tNetPct)} מהמחזור`} />
            </div>
            {Object.keys(dowDetails).length > 0 && (
              <div style={{marginTop:14,borderTop:"1px solid #E5E7EB",paddingTop:12}}>
                <div style={{fontSize:11,fontWeight:700,color:"#9CA3AF",textTransform:"uppercase",letterSpacing:1.2,marginBottom:10}}>
                  ממוצע לפי יום שבוע ({rem} ימים נותרו)
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:6}}>
                  {Object.entries(dowDetails).sort((a,b)=>a[0]-b[0]).map(([dow,info])=>(
                    <div key={dow} style={{background:"#F8FAFC",borderRadius:10,padding:"8px 12px"}}>
                      <div style={{fontSize:11,color:"#6B7280",fontWeight:600,marginBottom:3}}>
                        {["ראשון","שני","שלישי","רביעי","חמישי","שישי"][dow]} ({info.count} נתונים)
                      </div>
                      <div style={{fontWeight:700,color:"#111827",fontSize:13}}>{fmt(info.avg)}</div>
                      <div style={{fontSize:10,color:"#9CA3AF",marginTop:2}}>ימים: {info.days.join(", ")}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        );
      })()}

      {/* ── Progress bars ── */}
      <div className="card card-p">
        <div style={{fontSize:11,fontWeight:700,color:"#6B7280",textTransform:"uppercase",letterSpacing:1,marginBottom:12}}>
          ⏱ התקדמות מול תחזית
        </div>
        <ProgressBar label="הכנסות"   current={metrics.totalSales}   target={fSales} color="#16A34A" />
        <ProgressBar label="פוד קוסט" current={metrics.totalFood}    target={fFood}  color="#A3A3A3" />
        <ProgressBar label="שכר"      current={metrics.totalPayroll} target={fLabor} color="#A3A3A3" />
      </div>

      {/* ── Last year comparison ── */}
      <div className="card card-p">
        <div className="flex jbet icenter" style={{marginBottom:12}}>
          <div style={{fontSize:11,fontWeight:700,color:"#6B7280",textTransform:"uppercase",letterSpacing:1}}>
            {MONTH_NAMES[currentMonth]} {YEAR-1} — השוואה
          </div>
          <div style={{display:"flex",gap:6}}>
            <button style={{...S.iconBtn,color:"#6B7280",borderColor:"#40404033",padding:"4px 10px",fontSize:12}}
              onClick={()=>setMode(m=>m==="manual"?"view":"manual")}>ידני</button>
            <button style={{...S.iconBtn,padding:"4px 10px",fontSize:12}}
              onClick={()=>fileRef.current?.click()}>
              ⬆ Excel
            </button>
            <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{display:"none"}}
              onChange={e=>{ if(e.target.files[0]){ handleFile(e.target.files[0]); e.target.value=""; }}}/>
          </div>
        </div>

        {/* Manual input */}
        {mode==="manual" && (
          <div>
            <p style={{color:"#9CA3AF",fontSize:12,margin:"0 0 10px"}}>הזן נתוני {MONTH_NAMES[currentMonth]} {YEAR-1}:</p>
            {[["sales","הכנסות (₪)"],["foodCostPct","פוד קוסט (%)"],["laborCostPct","לייבור קוסט (%)"],["grossProfitPct","רווח גולמי (%)"],["fixedExpenses","הוצ׳ קבועות (₪)"]].map(([f,lbl])=>(
              <div key={f} style={{marginBottom:7}}>
                <label style={{...S.lbl,fontSize:12}}>{lbl}</label>
                <input className="input" style={{marginBottom:0}} type="number" inputMode="decimal" placeholder="0"
                  value={lyDraft[currentMonth][f]||""}
                  onChange={e=>setLyDraft(d=>d.map((m,i)=>i===currentMonth?{...m,[f]:Number(e.target.value)}:m))}/>
              </div>
            ))}
            <div style={{display:"flex",gap:8,marginTop:8}}>
              <button className="btn btn-primary btn-full" onClick={()=>{saveLastYear(lyDraft);setMode("view");}}>שמור</button>
              <button style={{...S.iconBtn,padding:"10px 16px"}} onClick={()=>setMode("view")}>ביטול</button>
            </div>
          </div>
        )}

        {/* Column mapping */}
        {mode==="mapCols" && (
          <div>
            <p style={{color:"#6B7280",fontSize:13,margin:"0 0 10px"}}>נמצאו {rawRows.length} שורות -- התאם עמודות:</p>
            {uploadError && <p style={{color:"#DC2626",fontSize:11,margin:"0 0 8px"}}>{uploadError}</p>}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:12}}>
              {[["month","חודש"],["sales","הכנסות (₪)"],["food","פוד קוסט (%)"],["labor","לייבור (%)"],["gross","רווח גולמי (%)"],["fixed","הוצ׳ קבועות (₪)"]].map(([k,l])=>(
                <div key={k}>
                  <label style={{...S.lbl,fontSize:11}}>{l}</label>
                  <select className="input" style={{padding:"6px 8px",fontSize:12,marginBottom:0}}
                    value={colMap[k]} onChange={e=>setColMap(c=>({...c,[k]:e.target.value}))}>
                    <option value="">-- לא רלוונטי --</option>
                    {headers.map(h=><option key={h} value={h}>{h}</option>)}
                  </select>
                </div>
              ))}
            </div>
            {/* Preview */}
            <div style={{overflowX:"auto",marginBottom:10,borderRadius:8,border:"1px solid #E5E7EB"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                <thead>
                  <tr>{[colMap.month,colMap.sales,colMap.food,colMap.labor].filter(Boolean).map(h=>(
                    <th key={h} style={{padding:"6px 8px",color:"#6B7280",textAlign:"right",background:"#F8FAFC",borderBottom:"1px solid #E5E7EB"}}>{h}</th>
                  ))}</tr>
                </thead>
                <tbody>
                  {rawRows.slice(0,5).map((row,i)=>(
                    <tr key={i}>{[colMap.month,colMap.sales,colMap.food,colMap.labor].filter(Boolean).map(h=>(
                      <td key={h} style={{padding:"5px 8px",color:"#6B7280",borderBottom:"1px solid #E5E7EB"}}>{row[headers.indexOf(h)]}</td>
                    ))}</tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div style={{display:"flex",gap:8}}>
              <button className="btn btn-primary btn-full" onClick={confirmImport}>ייבא נתונים</button>
              <button style={{...S.iconBtn,padding:"10px 16px"}} onClick={()=>setMode("view")}>ביטול</button>
            </div>
          </div>
        )}

        {/* Comparison table */}
        {(mode==="view") && (
          ly.sales===0
            ? <div style={{textAlign:"center",padding:"16px 0",color:"#9CA3AF",fontSize:13}}>
                העלה קובץ Excel ⬆ או הזן ידנית נתוני {MONTH_NAMES[currentMonth]} {YEAR-1}
              </div>
            : <>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:2,padding:"5px 0",borderBottom:"1px solid #D1D5DB",marginBottom:4}}>
                  <span style={{fontSize:10,color:"#9CA3AF"}}>מדד</span>
                  <span style={{fontSize:10,color:"#9CA3AF",textAlign:"center"}}>{YEAR-1}</span>
                  <span style={{fontSize:10,color:"#9CA3AF",textAlign:"center"}}>תחזית {YEAR}</span>
                </div>
                <CompRow label="הכנסות"        lyVal={fmt(ly.sales)}              fVal={fmt(Math.round(fSales))}   d={dltA(fSales,ly.sales,false)} />
                <CompRow label="פוד קוסט %"    lyVal={`${ly.foodCostPct}%`}       fVal={fmtPct(fFoodPct)}          d={dlt(fFoodPct,ly.foodCostPct,true)} />
                <CompRow label="לייבור %"      lyVal={`${ly.laborCostPct}%`}      fVal={fmtPct(fLaborPct)}         d={dlt(fLaborPct,ly.laborCostPct,true)} />
                {ly.networkPct && (() => {
                  const netPct = (businessConfig.rentPct||0)+(businessConfig.hasRoyalty?(businessConfig.royaltyPct||0):0);
                  return <CompRow label="רשת %"  lyVal={`${ly.networkPct}%`}  fVal={fmtPct(netPct)} d={dlt(netPct,ly.networkPct,true)} />;
                })()}
                <CompRow label="הוצ׳ קבועות"  lyVal={fmt(ly.fixedExpenses)}       fVal={fmt(metrics.TOTAL_FIXED)}  d={dltA(metrics.TOTAL_FIXED,ly.fixedExpenses,true)} />
                <CompRow label="רווח נקי %"   lyVal={`${ly.grossProfitPct}%`}    fVal={fmtPct(fGross)}            d={dlt(fGross,ly.grossProfitPct,false)} />
              </>
        )}
      </div>

      {/* 12-month bar chart */}
      <div className="card card-p">
        <div style={{fontSize:11,fontWeight:700,color:"#6B7280",textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>
          הכנסות {YEAR-1} -- כל החודשים
        </div>
        {lastYear.some(m=>m.sales>0) ? (
          <ResponsiveContainer width="100%" height={130}>
            <BarChart data={lastYear.map((m,i)=>({ n:MONTH_NAMES[i].slice(0,3), v:m.sales, cur:i===currentMonth }))}>
              <CartesianGrid strokeDasharray="3 3" stroke="#6B7280"/>
              <XAxis dataKey="n" stroke="#6B7280" tick={{fill:"#6B7280",fontSize:10}}/>
              <YAxis stroke="#6B7280" tick={{fill:"#6B7280",fontSize:10}} tickFormatter={v=>`${(v/1000).toFixed(0)}k`}/>
              <Tooltip contentStyle={TT} formatter={v=>[fmt(v),""]}/>
              <Bar dataKey="v" radius={[3,3,0,0]}
                fill="#A3A3A3"
                shape={(props)=>{
                  const {x,y,width,height,cur} = props;
                  return <rect x={x} y={y} width={width} height={height} rx={2} fill={props.cur?"#111827":"#E5E7EB"}/>;
                }}
              />
            </BarChart>
          </ResponsiveContainer>
        ) : (
          <div style={{textAlign:"center",padding:"16px 0",color:"#374151",fontSize:13}}>
            נתונים יופיעו כאן לאחר ייבוא קובץ שנה שעברה
          </div>
        )}
        {/* mini grid */}
        <div style={{display:"flex",gap:3,marginTop:8,flexWrap:"wrap"}}>
          {lastYear.map((m,i)=>{
            const profitColor = m.grossProfitPct > 5 ? "#16A34A" : m.grossProfitPct > 0 ? "#D97706" : "#DC2626";
            return (
              <div key={i} style={{flex:"0 0 calc(8.33% - 3px)",textAlign:"center",padding:"5px 2px",background:i===currentMonth?"#F3F4F6":"#F9FAFB",borderRadius:5,border:`1px solid ${"#E5E7EB"}`}}>
                <div style={{fontSize:9,color:"#9CA3AF"}}>{MONTH_NAMES[i].slice(0,3)}</div>
                <div style={{fontSize:10,fontWeight:700,color:m.sales>0?"#111827":"#E5E7EB",marginTop:2}}>
                  {m.sales>0?`${Math.round(m.sales/1000)}k`:"--"}
                </div>
                {m.sales>0 && <div style={{fontSize:9,color:profitColor,marginTop:1}}>{m.grossProfitPct > 0 ? "+" : ""}{m.grossProfitPct}%</div>}
              </div>
            );
          })}
        </div>
      </div>

    </div>
  );
}



// ─── Admin Panel ──────────────────────────────────────────────────────────────
function AdminPanel({ loggedInUser }) {
  const [clients, setClients]     = useState([]);
  const [loading, setLoading]     = useState(true);
  const [err, setErr]             = useState(null);
  const [showCreate, setShowCreate] = useState(false);
  const [creating, setCreating]   = useState(false);
  const [createErr, setCreateErr] = useState("");
  const [createOk, setCreateOk]  = useState(null);
  const [form, setForm]           = useState({bizName:"", ownerName:"", ownerEmail:"", ownerUsername:"", ownerPhone:""});
  const [deleting, setDeleting]   = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm]   = useState({bizName:"", ownerName:"", ownerEmail:"", ownerPhone:"", ownerUsername:""});
  const [editErr, setEditErr]     = useState("");
  const [saving, setSaving]       = useState(false);

  const startEdit = (c) => {
    setEditingId(c.tenantId);
    setEditForm({bizName:c.bizName||"", ownerName:c.ownerName||"", ownerEmail:c.ownerEmail||"", ownerPhone:c.ownerPhone||"", ownerUsername:c.ownerUsername||""});
    setEditErr("");
  };

  const saveEdit = async () => {
    if(!editForm.ownerEmail?.trim()) { setEditErr("אימייל הוא שדה חובה"); return; }
    setSaving(true); setEditErr("");
    try {
      const resp = await window.apiFetch("/api/admin?action=edit-client", {
        method:"POST",
        body: JSON.stringify({ tenantId: editingId, ...editForm }),
      });
      const data = await resp.json();
      if(!resp.ok) throw new Error(data.error || `שגיאה ${resp.status}`);
      setEditingId(null);
      load();
    } catch(e) { setEditErr(e.message); }
    setSaving(false);
  };

  const load = async () => {
    setLoading(true); setErr(null);
    try {
      const resp = await window.apiFetch("/api/admin?action=list-clients");
      const text = await resp.text();
      let data;
      try { data = JSON.parse(text); }
      catch(_) { throw new Error(`endpoint לא נמצא (${resp.status}) — ודא שהועלו: api/admin/list-clients.js`); }
      if(!resp.ok) throw new Error(data.error || `שגיאה ${resp.status}`);
      setClients(data.clients || []);
    } catch(e) { setErr(e.message); }
    setLoading(false);
  };

  React.useEffect(()=>{ load(); }, []);

  const createClient = async () => {
    if(!form.bizName.trim()||!form.ownerUsername.trim()||!form.ownerEmail.trim()) {
      setCreateErr("יש למלא שם עסק, שם משתמש ואימייל"); return;
    }
    if(form.ownerEmail.trim().endsWith("@temp.marjin.app")) {
      setCreateErr("נדרש כתובת אימייל אמיתית"); return;
    }
    setCreating(true); setCreateErr("");
    try {
      const resp = await window.apiFetch("/api/admin?action=create-client", {
        method:"POST",
        body: JSON.stringify(form),
      });
      let data;
      const text = await resp.text();
      try { data = JSON.parse(text); }
      catch(_) { throw new Error(`שגיאת שרת (${resp.status}) — endpoint לא נמצא. ודא שהקבצים הועלו לגיטהאב: api/admin/create-client.js`); }
      if(!resp.ok) throw new Error(data.error || `שגיאה ${resp.status}`);
      setCreateOk(data);
      setForm({bizName:"", ownerName:"", ownerEmail:"", ownerUsername:"", ownerPhone:""});
      load();
    } catch(e) { setCreateErr(e.message); }
    setCreating(false);
  };

  const deleteClient = async (tenantId, bizName) => {
    if(!confirm(`למחוק את הלקוח "${bizName || tenantId}"? פעולה זו בלתי הפיכה!`)) return;
    setDeleting(tenantId);
    try {
      const resp = await window.apiFetch("/api/admin?action=delete-client", {
        method:"POST",
        body: JSON.stringify({ tenantId }),
      });
      const data = await resp.json();
      if(!resp.ok) throw new Error(data.error || `שגיאה ${resp.status}`);
      load();
    } catch(e) { alert("שגיאה במחיקה: " + e.message); }
    setDeleting(null);
  };

  const inp = {width:"100%",border:"1px solid #E5E7EB",borderRadius:10,padding:"10px 12px",fontSize:14,fontFamily:"inherit",color:"#111827",background:"#fff",marginBottom:10};
  const statusColor = s => s==="active"?"#16A34A":s==="invited"?"#D97706":"#9CA3AF";

  return (
    <div className="screen" style={{paddingBottom:80}}>
      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <div>
          <h2 style={{fontSize:18,fontWeight:800,color:"#0F172A",letterSpacing:"-.4px"}}>ניהול לקוחות</h2>
          <p style={{fontSize:12,color:"#94A3B8",marginTop:3}}>super_owner · {clients.length} לקוחות</p>
        </div>
        <button
          onClick={()=>{ setShowCreate(true); setCreateOk(null); setCreateErr(""); }}
          style={{padding:"10px 18px",background:"#6366F1",border:"none",borderRadius:10,color:"white",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
          + לקוח חדש
        </button>
      </div>

      {/* Error / loading */}
      {loading && <p style={{textAlign:"center",color:"#94A3B8",padding:40}}>טוען...</p>}
      {err && <div style={{padding:14,background:"#FEF2F2",borderRadius:10,color:"#DC2626",fontSize:13,marginBottom:16}}>{err}</div>}

      {/* Client list */}
      {!loading && clients.map(c=>(
        <div key={c.tenantId} style={{background:"#fff",border:"1px solid #E5E7EB",borderRadius:14,padding:"16px 18px",marginBottom:10,boxShadow:"0 1px 3px rgba(0,0,0,.04)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
            <div>
              <div style={{fontSize:15,fontWeight:700,color:"#0F172A",marginBottom:4}}>{c.bizName||"—"}</div>
              <div style={{fontSize:12,color:"#64748B"}}>👤 {c.ownerName||"—"} · {c.ownerEmail||"—"}</div>
              <div style={{fontSize:11,color:"#94A3B8",marginTop:3}}>Tenant: {c.tenantId}</div>
            </div>
            <div style={{textAlign:"left",flexShrink:0}}>
              <div style={{display:"inline-flex",alignItems:"center",gap:5,background:c.status==="active"?"#F0FDF4":"#FFFBEB",border:`1px solid ${statusColor(c.status)}33`,borderRadius:999,padding:"3px 11px",fontSize:11,fontWeight:600,color:statusColor(c.status),marginBottom:6}}>
                <div style={{width:5,height:5,borderRadius:"50%",background:statusColor(c.status)}}/>
                {c.status==="active"?"פעיל":c.status==="invited"?"ממתין":"לא ידוע"}
              </div>
              <div style={{fontSize:11,color:"#94A3B8"}}>
                {c.createdAt ? new Date(c.createdAt).toLocaleDateString("he-IL") : "—"}
              </div>
            </div>
          </div>
          {c.inviteLink && (
            <div style={{marginTop:10,padding:"8px 12px",background:"#F8FAFC",borderRadius:8,border:"1px solid #E5E7EB",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
              <span style={{fontSize:11,color:"#64748B",wordBreak:"break-all"}}>{c.inviteLink}</span>
              <button onClick={()=>{ navigator.clipboard.writeText(c.inviteLink); }}
                style={{flexShrink:0,padding:"4px 10px",background:"#6366F1",border:"none",borderRadius:6,color:"white",fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>
                העתק
              </button>
            </div>
          )}
          {/* Edit form (inline) */}
          {editingId===c.tenantId && (
            <div style={{marginTop:12,padding:14,background:"#F8FAFC",borderRadius:10,border:"1px solid #E2E8F0"}}>
              <div style={{fontSize:13,fontWeight:700,color:"#0F172A",marginBottom:10}}>עריכת לקוח</div>
              <label style={{fontSize:11,fontWeight:600,color:"#374151",display:"block",marginBottom:4}}>שם העסק</label>
              <input style={inp} value={editForm.bizName} onChange={e=>setEditForm(f=>({...f,bizName:e.target.value}))}/>
              <label style={{fontSize:11,fontWeight:600,color:"#374151",display:"block",marginBottom:4}}>שם הבעלים</label>
              <input style={inp} value={editForm.ownerName} onChange={e=>setEditForm(f=>({...f,ownerName:e.target.value}))}/>
              <label style={{fontSize:11,fontWeight:600,color:"#374151",display:"block",marginBottom:4}}>שם משתמש</label>
              <input style={inp} value={editForm.ownerUsername} onChange={e=>setEditForm(f=>({...f,ownerUsername:e.target.value.replace(/\s/g,"").toLowerCase()}))} autoCapitalize="none"/>
              <label style={{fontSize:11,fontWeight:600,color:"#374151",display:"block",marginBottom:4}}>אימייל (חובה)</label>
              <input style={{...inp,direction:"ltr"}} type="email" value={editForm.ownerEmail} onChange={e=>setEditForm(f=>({...f,ownerEmail:e.target.value.trim()}))}/>
              <label style={{fontSize:11,fontWeight:600,color:"#374151",display:"block",marginBottom:4}}>טלפון</label>
              <input style={{...inp,direction:"ltr"}} type="tel" value={editForm.ownerPhone} onChange={e=>setEditForm(f=>({...f,ownerPhone:e.target.value.replace(/[^0-9+]/g,"")}))}/>
              {editErr && <div style={{color:"#DC2626",fontSize:12,marginBottom:8}}>{editErr}</div>}
              <div style={{display:"flex",gap:8}}>
                <button onClick={saveEdit} disabled={saving}
                  style={{flex:1,padding:"9px",background:saving?"#C7D2FE":"#6366F1",border:"none",borderRadius:8,color:"white",fontSize:12,fontWeight:700,cursor:saving?"default":"pointer",fontFamily:"inherit"}}>
                  {saving ? "שומר..." : "שמור שינויים"}
                </button>
                <button onClick={()=>setEditingId(null)}
                  style={{padding:"9px 16px",background:"#F1F5F9",border:"1px solid #E2E8F0",borderRadius:8,color:"#64748B",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
                  ביטול
                </button>
              </div>
            </div>
          )}
          <div style={{marginTop:10,display:"flex",justifyContent:"flex-end",gap:8}}>
            <button onClick={()=>editingId===c.tenantId ? setEditingId(null) : startEdit(c)}
              style={{padding:"5px 14px",background:"#F0F9FF",border:"1px solid #BAE6FD",borderRadius:8,color:"#0284C7",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
              {editingId===c.tenantId ? "סגור עריכה" : "✏️ ערוך"}
            </button>
            <button onClick={()=>deleteClient(c.tenantId, c.bizName)} disabled={deleting===c.tenantId}
              style={{padding:"5px 14px",background:deleting===c.tenantId?"#FCA5A5":"#FEF2F2",border:"1px solid #FECACA",borderRadius:8,color:"#DC2626",fontSize:11,fontWeight:600,cursor:deleting===c.tenantId?"default":"pointer",fontFamily:"inherit"}}>
              {deleting===c.tenantId ? "מוחק..." : "🗑 מחק לקוח"}
            </button>
          </div>
        </div>
      ))}

      {!loading && clients.length===0 && !err && (
        <div style={{textAlign:"center",padding:60,color:"#94A3B8"}}>
          <div style={{fontSize:32,marginBottom:12}}>🏪</div>
          <div style={{fontSize:14}}>אין לקוחות עדיין</div>
        </div>
      )}

      {/* Create modal */}
      {showCreate && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.4)",zIndex:1000,display:"flex",alignItems:"flex-end"}} onClick={()=>setShowCreate(false)}>
          <div style={{background:"white",width:"100%",maxHeight:"90vh",overflowY:"auto",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px"}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <div style={{fontSize:16,fontWeight:800,color:"#0F172A"}}>לקוח חדש</div>
              <button onClick={()=>setShowCreate(false)} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:"#94A3B8"}}>×</button>
            </div>

            {createOk ? (
              <div>
                <div style={{padding:18,background:"#F0FDF4",borderRadius:12,border:"1px solid #BBF7D0",marginBottom:16}}>
                  <div style={{fontSize:14,fontWeight:700,color:"#16A34A",marginBottom:8}}>✓ לקוח נוצר בהצלחה</div>
                  <div style={{fontSize:12,color:"#166534"}}>Tenant ID: <strong>{createOk.tenantId}</strong></div>
                  {createOk.emailSent && <div style={{fontSize:12,color:"#16A34A",marginTop:4}}>✓ הזמנה נשלחה במייל</div>}
                  {createOk.emailSent===false && <div style={{fontSize:12,color:"#D97706",marginTop:4}}>⚠ שליחת מייל נכשלה — שלח קישור ידנית</div>}
                  {createOk.inviteLink && <>
                    <div style={{fontSize:12,color:"#166534",marginTop:6}}>קישור הזמנה:</div>
                    <div style={{fontSize:11,color:"#15803D",wordBreak:"break-all",background:"white",padding:"8px 10px",borderRadius:8,marginTop:4,border:"1px solid #BBF7D0"}}>
                      {createOk.inviteLink}
                    </div>
                    <button onClick={()=>navigator.clipboard.writeText(createOk.inviteLink)}
                      style={{marginTop:8,width:"100%",padding:"10px",background:"#6366F1",border:"none",borderRadius:10,color:"white",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                      📋 העתק קישור הזמנה
                    </button>
                  </>}
                </div>
                <button onClick={()=>{ setShowCreate(false); setCreateOk(null); }}
                  style={{width:"100%",padding:"12px",background:"#6366F1",border:"none",borderRadius:12,color:"white",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                  סגור
                </button>
              </div>
            ) : (
              <>
                <label style={{fontSize:12,fontWeight:600,color:"#374151",display:"block",marginBottom:6}}>שם העסק</label>
                <input style={inp} placeholder="לדוגמה: קיס גן שמואל" value={form.bizName} onChange={e=>setForm(f=>({...f,bizName:e.target.value}))}/>

                <label style={{fontSize:12,fontWeight:600,color:"#374151",display:"block",marginBottom:6}}>שם הבעלים</label>
                <input style={inp} placeholder="שם מלא" value={form.ownerName} onChange={e=>setForm(f=>({...f,ownerName:e.target.value}))}/>

                <label style={{fontSize:12,fontWeight:600,color:"#374151",display:"block",marginBottom:6}}>שם משתמש</label>
                <input style={inp} placeholder="sagis (ללא רווחים)" value={form.ownerUsername} onChange={e=>setForm(f=>({...f,ownerUsername:e.target.value.replace(/\s/g,"").toLowerCase()}))} autoCapitalize="none"/>

                <label style={{fontSize:12,fontWeight:600,color:"#374151",display:"block",marginBottom:6}}>אימייל (חובה)</label>
                <input style={{...inp,direction:"ltr"}} type="email" placeholder="owner@business.com" value={form.ownerEmail} onChange={e=>setForm(f=>({...f,ownerEmail:e.target.value.trim()}))}/>

                <label style={{fontSize:12,fontWeight:600,color:"#374151",display:"block",marginBottom:6}}>טלפון (אופציונלי)</label>
                <input style={{...inp,direction:"ltr"}} type="tel" placeholder="972541234567" value={form.ownerPhone} onChange={e=>setForm(f=>({...f,ownerPhone:e.target.value.replace(/[^0-9+]/g,"")}))}/>


                {createErr && <div style={{color:"#DC2626",fontSize:13,marginBottom:12}}>{createErr}</div>}

                <button onClick={createClient} disabled={creating}
                  style={{width:"100%",padding:"13px",background:creating?"#C7D2FE":"#6366F1",border:"none",borderRadius:12,color:"white",fontSize:14,fontWeight:700,cursor:creating?"default":"pointer",fontFamily:"inherit"}}>
                  {creating ? "יוצר לקוח..." : "צור לקוח ושלח הזמנה"}
                </button>
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PilotDashboard />);
  
  </script>
</body>
</html>
