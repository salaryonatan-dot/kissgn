<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.sheetjs.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.gstatic.com https://*.firebaseio.com https://*.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; connect-src 'self' https://*.firebaseio.com wss://*.firebaseio.com https://*.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://api.open-meteo.com https://www.oref.org.il https://*.cloudfunctions.net https://firestore.googleapis.com https://firebase.googleapis.com wss://*.firebaseio.com https://*.firebase.com wss://*.firebase.com https://fcmregistrations.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com https://fonts.googleapis.com; object-src 'none'; base-uri 'self';">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Marjin" />
  <title>Marjin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ══ Design Tokens ══════════════════════════════════════════════════════ */
    :root {
      --bg:         #F9FAFB;
      --surface:    #FFFFFF;
      --border:     #E5E7EB;
      --border-sub: #F3F4F6;
      --ink:        #111827;
      --ink-sub:    #6B7280;
      --ink-muted:  #9CA3AF;
      --accent:     #B91C1C;
      --success:    #16A34A;
      --warning:    #D97706;
      --danger:     #DC2626;
      --r:          8px;
      --rsm:        5px;
      --shadow:     0 1px 2px rgba(0,0,0,0.04);
      --shadow-md:  0 4px 12px rgba(0,0,0,0.08);
    }
    @keyframes pulse   { 0%,100%{opacity:1} 50%{opacity:.5} }
    @keyframes fadeIn  { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:none} }
    @keyframes shimmer { from{opacity:.6} to{opacity:1} }

    /* ══ Reset ══════════════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html                   { overflow-x:hidden; }
    html, body, #root      { width:100%; max-width:100vw; min-height:100vh; font-family:'Heebo',sans-serif; background:var(--bg); color:var(--ink); overflow-x:hidden; }
    input, button, select, textarea { font-family:inherit; font-size:inherit; }
    ::-webkit-scrollbar { display:none; } * { scrollbar-width:none; }
    input:focus, select:focus, textarea:focus { outline:none; border-color:var(--ink) !important; }
    button:active { opacity:.85; }
    a { color:inherit; text-decoration:none; }

    /* ══ App shell ══════════════════════════════════════════════════════════ */
    .app { min-height:100vh; background:var(--bg); width:100%; overflow-x:hidden; }

    /* ── Mobile header: 3 stacked rows ── */
    .mhd              { background:#FFFFFF; width:100%; position:sticky; top:0; z-index:50; }
    .mhd-row1         { display:flex; align-items:center; justify-content:space-between; padding:10px 16px 0; }
    .mhd-biz          { min-width:0; flex:1; }
    .mhd-name         { font-size:17px; font-weight:700; color:#0F172A; letter-spacing:-.4px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .mhd-sub          { font-size:11px; color:#94A3B8; margin-top:2px; white-space:nowrap; }
    .mhd-icons        { display:flex; align-items:center; gap:8px; flex-shrink:0; margin-right:12px; }
    .mhd-icon-btn     { width:34px; height:34px; background:#F8FAFC; border:1px solid #E5E7EB; border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#6B7280; flex-shrink:0; }
    .mhd-avatar       { width:34px; height:34px; background:#6366F1; border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:700; flex-shrink:0; cursor:pointer; }
    .mhd-row2         { display:flex; align-items:center; gap:8px; padding:10px 16px 0; }
    .mhd-cta          { flex:1; height:38px; background:#6366F1; color:#fff; border:none; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; letter-spacing:-.2px; }
    .mhd-switch       { height:38px; padding:0 14px; background:#F8FAFC; border:1px solid #E5E7EB; border-radius:10px; font-size:12px; font-weight:500; color:#6B7280; cursor:pointer; font-family:inherit; white-space:nowrap; flex-shrink:0; }
    .mhd-logout       { height:38px; padding:0 14px; background:#F8FAFC; border:1px solid #E5E7EB; border-radius:10px; font-size:12px; font-weight:500; color:#6B7280; cursor:pointer; font-family:inherit; white-space:nowrap; flex-shrink:0; }
    .mhd-nav          { margin-top:6px; border-top:1px solid #F1F5F9; }
    .mhd-nav-inner    { display:flex; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding:0 12px; }
    .mhd-nav-inner::-webkit-scrollbar { display:none; }
    .mhd-tab          { height:38px; padding:0 12px; background:transparent; border:none; border-bottom:2px solid transparent; font-size:12px; font-weight:500; color:#94A3B8; white-space:nowrap; flex-shrink:0; cursor:pointer; font-family:inherit; transition:color .15s, border-color .15s; }
    .mhd-tab.active   { color:#0F172A; font-weight:700; border-bottom-color:#6366F1; }
    .mhd-tab.shift-active { color:#6366F1; font-weight:700; border-bottom-color:#6366F1; }

    /* Keep legacy classes for non-header parts */
    .app-title { font-size:14px; font-weight:700; color:var(--ink); }
    .app-sub   { font-size:11px; color:var(--ink-muted); }
    .app-nav   { display:none; } /* replaced by mhd-nav */
    .app-nav-inner { display:flex; }
    .nav-tab   { height:40px; padding:0 12px; display:inline-flex; align-items:center; font-size:12px; font-weight:500; color:var(--ink-muted); background:transparent; border:none; border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap; flex-shrink:0; }
    .nav-tab.is-active { color:var(--ink); font-weight:600; border-bottom-color:var(--ink); }
    .nav-tab.is-red    { color:var(--accent); font-weight:600; border-bottom-color:var(--accent); }
    .screen { padding:14px 14px 80px; background:var(--bg); min-height:calc(100vh - 120px); width:100%; max-width:100%; overflow-x:hidden; }

    /* ══ Cards ══════════════════════════════════════════════════════════════ */
    .card       { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow); }
    .card-p     { padding:16px; }
    .card-p-sm  { padding:12px 14px; }
    .card + .card { margin-top:10px; }

    /* ══ KPI ════════════════════════════════════════════════════════════════ */
    .kpi-grid  { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:12px; }
    .kpi-card  { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:16px 14px; box-shadow:var(--shadow); }
    .kpi-label { font-size:10px; font-weight:600; color:var(--ink-muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:9px; display:block; }
    .kpi-val   { font-size:22px; font-weight:700; letter-spacing:-.8px; line-height:1; color:var(--ink); }
    .kpi-val.warn   { color:var(--warning); }
    .kpi-val.danger { color:var(--danger); }
    .kpi-sub   { font-size:11px; color:var(--ink-muted); margin-top:5px; line-height:1.3; }

    /* ══ Buttons ════════════════════════════════════════════════════════════ */
    .btn {
      display:inline-flex; align-items:center; justify-content:center; gap:5px;
      cursor:pointer; font-weight:600; font-size:13px;
      border-radius:var(--rsm); border:none; padding:8px 14px;
      line-height:1; transition:opacity .1s; white-space:nowrap;
    }
    .btn:disabled { opacity:.4; cursor:default; pointer-events:none; }
    .btn-primary   { background:var(--ink); color:#fff; }
    .btn-secondary { background:var(--surface); color:var(--ink-sub); border:1px solid var(--border); }
    .btn-ghost     { background:transparent; color:var(--ink-sub); border:1px solid var(--border); }
    .btn-danger    { background:#FEF2F2; color:var(--danger); border:1px solid #FECACA; }
    .btn-sm   { padding:6px 11px; font-size:12px; }
    .btn-xs   { padding:4px 8px;  font-size:11px; }
    .btn-full { width:100%; }
    .btn-full + .btn-full { margin-top:6px; }
    .btn-link { background:none; border:none; color:var(--ink-sub); cursor:pointer; font-size:12px; padding:0; }
    .icon-btn {
      display:inline-flex; align-items:center; justify-content:center;
      width:28px; height:28px; padding:0; border-radius:4px;
      background:transparent; border:none; cursor:pointer; color:var(--ink-muted);
    }
    .icon-btn:hover { background:var(--border-sub); color:var(--ink-sub); }
    .icon-btn svg   { pointer-events:none; }

    /* ══ Forms ══════════════════════════════════════════════════════════════ */
    .field    { margin-bottom:9px; }
    .label    { display:block; font-size:12px; color:var(--ink-sub); margin-bottom:4px; font-weight:500; }
    .input    { width:100%; background:var(--surface); border:1px solid #D1D5DB; border-radius:var(--rsm); padding:9px 11px; color:var(--ink); font-size:13px; outline:none; box-sizing:border-box; }
    .input-sm { padding:7px 9px; font-size:12px; }
    .input-num{ width:64px; text-align:center; }
    .input-pin{ text-align:center; letter-spacing:10px; font-size:22px; padding:12px; }
    .select   { width:100%; appearance:none; background:var(--surface); border:1px solid #D1D5DB; border-radius:var(--rsm); padding:9px 11px; color:var(--ink); font-size:13px; outline:none; box-sizing:border-box; cursor:pointer; }
    .pass-wrap { position:relative; }
    .pass-wrap .input { padding-left:32px; }
    [dir=rtl] .pass-wrap .input { padding-left:11px; padding-right:32px; }
    .pass-eye { position:absolute; left:9px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--ink-muted); padding:4px; line-height:1; font-size:12px; }
    [dir=rtl] .pass-eye { left:auto; right:9px; }
    .form-sec  { font-size:10px; font-weight:600; color:var(--ink-muted); text-transform:uppercase; letter-spacing:1px; margin:16px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--border-sub); }
    .form-err  { background:#FEF2F2; border:1px solid #FECACA; border-radius:var(--rsm); padding:7px 10px; font-size:12px; color:var(--danger); margin-bottom:9px; }
    .form-hint { background:var(--bg); border:1px solid var(--border); border-radius:var(--rsm); padding:8px 11px; font-size:12px; color:var(--ink-sub); margin-bottom:9px; line-height:1.5; }
    .form-ok   { background:#F0FDF4; border:1px solid #D1FAE5; border-radius:var(--rsm); padding:7px 10px; font-size:12px; color:#166534; margin-bottom:9px; }

    /* ══ Badges ═════════════════════════════════════════════════════════════ */
    .badge         { display:inline-block; padding:2px 7px; border-radius:3px; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.4px; }
    .badge-neutral { background:var(--border-sub); color:var(--ink-sub); }
    .badge-pending { background:#FFFBEB; color:#92400E; border:1px solid #FDE68A; }
    .badge-success { background:#F0FDF4; color:#166534; border:1px solid #D1FAE5; }
    .badge-danger  { background:#FEF2F2; color:#991B1B; border:1px solid #FECACA; }
    .badge-dot     { position:absolute; top:-4px; left:-4px; background:var(--accent); color:#fff; font-size:9px; font-weight:700; border-radius:50%; width:14px; height:14px; display:flex; align-items:center; justify-content:center; }

    /* ══ Section headers ════════════════════════════════════════════════════ */
    .sec-head  { font-size:10px; font-weight:600; color:var(--ink-muted); text-transform:uppercase; letter-spacing:1px; margin:0 0 12px; }
    .page-head { font-size:14px; font-weight:700; color:var(--ink); }
    .page-sub  { font-size:11px; color:var(--ink-muted); margin-top:2px; }

    /* ══ Status / Alerts ════════════════════════════════════════════════════ */
    .status-strip { display:flex; align-items:center; gap:8px; font-size:12px; margin-bottom:12px; color:var(--ink-muted); }
    .status-dot   { width:5px; height:5px; border-radius:50%; flex-shrink:0; }
    .banner       { border-radius:var(--rsm); padding:9px 12px; font-size:12px; font-weight:500; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
    .banner-ok    { background:#F0FDF4; border:1px solid #D1FAE5; color:#166534; }
    .banner-warn  { background:#FFFBEB; border:1px solid #FDE68A; color:#92400E; }
    .banner-alert { background:#FEF2F2; border:1px solid #FECACA; color:#991B1B; }
    .alert-box    { background:#FEF2F2; border:1px solid #FECACA; border-radius:var(--rsm); padding:10px 12px; margin-bottom:12px; }
    .alert-title  { color:#991B1B; font-weight:600; font-size:12px; margin-bottom:5px; }
    .alert-tag    { background:#FEE2E2; border:1px solid #FECACA; color:#991B1B; padding:2px 7px; border-radius:3px; font-size:11px; font-weight:500; display:inline-block; margin:2px; }
    .alert-row    { display:flex; align-items:flex-start; gap:9px; }
    .alert-row + .alert-row { margin-top:10px; padding-top:10px; border-top:1px solid var(--border-sub); }

    /* ══ Progress / Gauge ═══════════════════════════════════════════════════ */
    .progress      { height:3px; background:var(--border-sub); border-radius:2px; overflow:hidden; }
    .progress-fill { height:100%; border-radius:2px; transition:width .4s ease; }
    .gauge         { height:4px; background:var(--border-sub); border-radius:2px; overflow:hidden; position:relative; }
    .gauge-fill    { height:100%; border-radius:2px; transition:width .5s ease; }
    .gauge-marker  { position:absolute; top:0; bottom:0; width:1px; background:var(--ink-muted); opacity:.4; }

    /* ══ Data tables ════════════════════════════════════════════════════════ */
    .data-table      { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); overflow:hidden; }
    .data-table-head { display:flex; align-items:center; padding:8px 14px; background:var(--bg); border-bottom:1px solid var(--border-sub); }
    .th  { font-size:10px; font-weight:600; color:var(--ink-muted); text-transform:uppercase; letter-spacing:1px; }
    .data-row { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--border-sub); background:var(--surface); }
    .data-row:last-child { border-bottom:none; }

    /* ══ Empty states ═══════════════════════════════════════════════════════ */
    .empty      { text-align:center; padding:52px 20px; color:var(--ink-muted); }
    .empty-icon { width:36px; height:36px; border:1px solid var(--border); border-radius:var(--rsm); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; font-size:14px; }
    .empty p    { font-size:13px; margin:0 0 14px; color:var(--ink-muted); }

    /* ══ Modals ═════════════════════════════════════════════════════════════ */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:999; display:flex; align-items:center; justify-content:center; padding:24px; }
    .modal-box     { background:var(--surface); border-radius:var(--r); padding:22px 24px; width:100%; max-width:380px; border:1px solid var(--border); box-shadow:0 8px 32px rgba(0,0,0,.12); direction:rtl; animation:fadeIn .15s ease; }
    .modal-title   { font-size:15px; font-weight:700; color:var(--ink); margin:0 0 4px; }
    .modal-sub     { font-size:12px; color:var(--ink-muted); margin:0 0 18px; }
    .modal-actions { display:flex; gap:8px; margin-top:16px; }

    /* ══ Auth screens ═══════════════════════════════════════════════════════ */
    .auth-root   { min-height:100vh; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; direction:rtl; }
    .auth-box    { background:var(--surface); border-radius:var(--r); padding:28px 24px; width:100%; max-width:380px; border:1px solid var(--border); box-shadow:0 1px 3px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.04); }
    .auth-logo   { width:32px; height:32px; background:var(--ink); border-radius:7px; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
    .auth-logo span { color:#fff; font-size:13px; font-weight:700; }
    .auth-title  { font-size:17px; font-weight:700; color:var(--ink); text-align:center; letter-spacing:-.3px; }
    .auth-sub    { font-size:12px; color:var(--ink-muted); text-align:center; margin-top:3px; }
    .auth-footer { text-align:center; margin-top:14px; font-size:11px; color:var(--ink-muted); }

    /* ══ Setup Wizard ═══════════════════════════════════════════════════════ */
    .wizard-root   { position:fixed; inset:0; background:var(--bg); overflow-y:auto; z-index:1000; direction:rtl; }
    .wizard-wrap   { max-width:420px; margin:0 auto; padding:20px 20px 80px; }
    .wizard-header { text-align:center; padding:20px 0 16px; }
    .wizard-step   { font-size:11px; color:var(--ink-muted); margin-bottom:4px; }
    .wizard-title  { font-size:17px; font-weight:700; color:var(--ink); letter-spacing:-.3px; }
    .wizard-sub    { font-size:12px; color:var(--ink-muted); margin-top:2px; }
    .wizard-prog   { height:2px; background:var(--border); border-radius:1px; margin-bottom:22px; overflow:hidden; }
    .wizard-bar    { height:100%; background:var(--ink); border-radius:1px; transition:width .3s ease; }
    .toggle-wrap   { width:38px; height:20px; border-radius:10px; border:none; cursor:pointer; position:relative; flex-shrink:0; transition:background .2s; }
    .toggle-knob   { position:absolute; top:3px; width:14px; height:14px; border-radius:50%; background:#fff; transition:left .2s; pointer-events:none; }
    .day-btn       { width:32px; height:32px; border-radius:var(--rsm); border:1px solid var(--border); background:var(--bg); color:var(--ink-sub); cursor:pointer; font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:center; }
    .day-btn.on    { background:var(--ink); border-color:var(--ink); color:#fff; }

    /* ══ Shift Manager ══════════════════════════════════════════════════════ */
    .shift-wrap { padding:14px 18px 80px; }
    .task-row     { display:flex; align-items:flex-start; gap:9px; padding:10px; background:var(--surface); border:1px solid var(--border); border-radius:var(--rsm); margin-bottom:5px; }
    .task-row.done{ background:var(--bg); }
    .task-cb      { width:20px; height:20px; border-radius:4px; border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; cursor:pointer; }
    .task-cb.on   { background:#16A34A; border-color:#16A34A; color:#fff; }
    .shift-nav    { display:flex; border-bottom:1px solid var(--border); margin-bottom:14px; }
    .shift-tab    { padding:0 11px; height:36px; background:transparent; border:none; border-bottom:2px solid transparent; color:var(--ink-muted); cursor:pointer; font-size:12px; font-weight:500; white-space:nowrap; display:inline-flex; align-items:center; }
    .shift-tab.on { color:var(--ink); font-weight:600; border-bottom-color:var(--ink); }

    /* ══ Forecast ═══════════════════════════════════════════════════════════ */
    .forecast-card  { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:16px; margin-bottom:12px; box-shadow:var(--shadow); }
    .forecast-grid  { display:grid; grid-template-columns:repeat(3,1fr); gap:0; border-top:1px solid var(--border-sub); padding-top:13px; }
    .forecast-cell  { }
    .forecast-cell:not(:last-child) { padding-left:14px; border-left:1px solid var(--border-sub); margin-left:14px; }

    /* ══ Utility classes ════════════════════════════════════════════════════ */
    .flex    { display:flex; }
    .fcol    { flex-direction:column; }
    .icenter { align-items:center; }
    .istart  { align-items:flex-start; }
    .jbet    { justify-content:space-between; }
    .jcenter { justify-content:center; }
    .g1 { gap:4px; }  .g2 { gap:8px; }  .g3 { gap:12px; }  .g4 { gap:16px; }
    .f1 { flex:1; }   .f0 { flex-shrink:0; }
    .fw { width:100%; }
    .tc { text-align:center; } .tl { text-align:left; }
    .rel { position:relative; } .abs { position:absolute; }
    .of-h { overflow:hidden; } .trunc { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .mt1 { margin-top:4px; }   .mt2 { margin-top:8px; }   .mt3 { margin-top:12px; }  .mt4 { margin-top:16px; }
    .mb0 { margin-bottom:0; }  .mb1 { margin-bottom:4px; } .mb2 { margin-bottom:8px; } .mb3 { margin-bottom:12px; } .mb4 { margin-bottom:16px; }
    .mr2 { margin-right:8px; } .mr3 { margin-right:12px; }
    .p2 { padding:8px; }  .p3 { padding:12px; }  .p4 { padding:16px; }
    .px3 { padding-left:12px; padding-right:12px; }
    .py1 { padding-top:4px; padding-bottom:4px; }
    .py2 { padding-top:8px; padding-bottom:8px; }
    .t-xs   { font-size:10px; }  .t-sm  { font-size:12px; }  .t-base { font-size:13px; }  .t-md { font-size:14px; }
    .fw5 { font-weight:500; }  .fw6 { font-weight:600; }  .fw7 { font-weight:700; }
    .c-ink   { color:var(--ink); }
    .c-sub   { color:var(--ink-sub); }
    .c-muted { color:var(--ink-muted); }
    .c-ok    { color:var(--success); }
    .c-warn  { color:var(--warning); }
    .c-err   { color:var(--danger); }
    .bg-bg   { background:var(--bg); }
    .bg-surface { background:var(--surface); }
    .divider { border:none; border-top:1px solid var(--border-sub); margin:12px 0; }
    .sep     { font-size:11px; color:var(--border); }
    .border  { border:1px solid var(--border); }
    .border-b{ border-bottom:1px solid var(--border-sub); }
    .rounded   { border-radius:var(--rsm); }
    .rounded-md{ border-radius:var(--r); }
    .shadow-sm { box-shadow:var(--shadow); }
    .shadow-md { box-shadow:var(--shadow-md); }

    /* ══ Dashboard ══════════════════════════════════════════════════════════ */
    .dash            { padding:0 0 96px; background:linear-gradient(180deg,#F8FAFC 0%,#EEF2F7 100%); min-height:100vh; width:100%; overflow-x:hidden; }
    .dash-wrap       { max-width:980px; width:100%; margin:0 auto; padding:0 14px; box-sizing:border-box; }
    .dash-section    { margin-top:36px; }

    /* Status strip */
    .dash-status { display:flex; align-items:center; gap:10px; font-size:12px; color:#94A3B8; padding:16px 0 6px; line-height:1.5; }
    .dash-dot    { width:6px; height:6px; border-radius:50%; flex-shrink:0; }

    /* ── KPI row — flat, secondary ── */
    .kpi-row  { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; width:100%; }
    .kpi-card {
      background:#FFFFFF; border-radius:16px; padding:20px 20px 17px;
      box-shadow:0 1px 3px rgba(0,0,0,.05); border:1px solid rgba(0,0,0,.04);
      transition:transform .2s ease, box-shadow .2s ease; cursor:default;
    }
    .kpi-card:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,.09); border-color:rgba(0,0,0,.06); }
    .kpi-card-link  { cursor:pointer; }
    .kpi-card-link:active { transform:translateY(0); box-shadow:0 1px 3px rgba(0,0,0,.05); background:#FAFBFF; }
    .kpi-forecast   { font-size:10px; color:#94A3B8; margin-top:6px; line-height:1.4; font-weight:400; }
    .kpi-pct-badge  { font-size:10px; font-weight:600; margin-top:5px; display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
    .kpi-pct-bar    { height:3px; background:#F1F5F9; border-radius:3px; overflow:hidden; margin-top:7px; }
    .kpi-pct-fill   { height:100%; border-radius:3px; transition:width .6s ease; }
    .kpi-label { font-size:10px; font-weight:400; color:#94A3B8; letter-spacing:.5px; text-transform:uppercase; margin-bottom:9px; display:block; line-height:1.4; }
    .kpi-val   { font-size:21px; font-weight:600; color:#64748B; letter-spacing:-.8px; line-height:1; }
    .kpi-val.s-warn { color:#D97706; }
    .kpi-val.s-bad  { color:#818CF8; }
    .kpi-ctx   { font-size:11px; color:#CBD5E1; margin-top:5px; font-weight:400; line-height:1.4; }

    /* ── HERO — a section, not a card ── */
    .hero-card {
      background:#EEF2FF;
      border-radius:20px; padding:56px 20px 48px;
      width:100%; overflow:hidden;
      box-shadow:0 2px 4px rgba(99,102,241,.04),
                 0 8px 20px rgba(99,102,241,.06),
                 0 20px 50px rgba(0,0,0,.08);
      position:relative; overflow:hidden; border:none;
    }
    .hero-card::before {
      content:''; position:absolute; top:0; left:0; right:0; height:3px;
      background:linear-gradient(90deg,#818CF8 0%,#6366F1 50%,#A5B4FC 100%);
      border-radius:20px 20px 0 0;
    }
    .hero-card::after {
      content:''; position:absolute; top:-60px; right:-60px;
      width:200px; height:200px;
      background:radial-gradient(circle, rgba(129,140,248,.08) 0%, transparent 65%);
      pointer-events:none;
    }
    .hero-header  { margin-bottom:22px; position:relative; z-index:1; }
    .hero-eyebrow { font-size:11px; font-weight:500; color:#818CF8; letter-spacing:.6px; text-transform:uppercase; margin-bottom:12px; line-height:1.4; display:flex; align-items:center; gap:8px; }
    .hero-eyebrow::before { content:''; width:6px; height:6px; border-radius:50%; background:#818CF8; flex-shrink:0; }
    .hero-main    { display:flex; justify-content:space-between; align-items:flex-end; position:relative; z-index:1; }
    .hero-left    { }
    .hero-amount  { font-size:76px; font-weight:800; color:#0F172A; letter-spacing:-4.5px; line-height:1; }
    .hero-target  { font-size:13px; color:#64748B; font-weight:500; margin-top:10px; line-height:1.5; }
    .hero-badge   { font-size:12px; font-weight:600; padding:6px 16px; border-radius:999px; align-self:flex-start; margin-top:4px; }
    .hero-badge.ok   { background:rgba(129,140,248,.18); color:#4F46E5; }
    .hero-badge.warn { background:rgba(253,230,138,.4); color:#B45309; }

    /* Progress bar — 6px, premium */
    .prog-wrap   { margin-top:22px; margin-bottom:8px; position:relative; z-index:1; }
    .prog-track  { height:6px; background:rgba(15,23,42,.08); border-radius:999px; position:relative; overflow:hidden; }
    .prog-fill   { height:100%; border-radius:999px; background:linear-gradient(90deg,#6366F1 0%,#818CF8 60%,#A5B4FC 100%); transition:width 1.1s cubic-bezier(.16,1,.3,1); box-shadow:0 0 10px rgba(99,102,241,.25); }
    .prog-marker { position:absolute; top:0; bottom:0; width:1.5px; background:rgba(15,23,42,.2); border-radius:2px; }
    .prog-labels { display:flex; justify-content:space-between; font-size:10px; color:#94A3B8; margin-top:8px; line-height:1.4; }

    /* Hero forecast footer */
    .hm-row  { display:grid; grid-template-columns:repeat(2,1fr); padding-top:26px; margin-top:26px; border-top:1px solid rgba(99,102,241,.1); position:relative; z-index:1; }
    .hm-cell { }
    .hm-cell:not(:last-child) { padding-left:28px; border-left:1px solid rgba(99,102,241,.1); margin-left:28px; }
    .hm-label { font-size:11px; font-weight:600; color:#64748B; letter-spacing:.2px; margin-bottom:7px; line-height:1.4; }
    .hm-val   { font-size:22px; font-weight:700; color:#0F172A; letter-spacing:-.8px; line-height:1; }
    .hm-val.neg { color:#818CF8; }
    .hm-sub   { font-size:11px; color:#64748B; margin-top:5px; line-height:1.4; font-weight:500; }

    /* ── 2-col grid ── */
    .dash-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; }

    .chart-card  { background:#FFFFFF; border-radius:16px; padding:24px 16px 18px; box-shadow:0 1px 3px rgba(0,0,0,.05); border:1px solid rgba(0,0,0,.04); transition:transform .2s ease, box-shadow .2s ease; width:100%; overflow:hidden; }
    .chart-card:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,.09); border-color:rgba(0,0,0,.06); }
    .chart-label { font-size:10px; font-weight:400; color:#94A3B8; letter-spacing:.5px; text-transform:uppercase; margin-bottom:20px; line-height:1.4; }

    .bd-card  { background:#FFFFFF; border-radius:16px; padding:24px 16px; box-shadow:0 1px 3px rgba(0,0,0,.05); border:1px solid rgba(0,0,0,.04); transition:transform .2s ease, box-shadow .2s ease; width:100%; overflow:hidden; }
    .bd-card:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,.09); border-color:rgba(0,0,0,.06); }
    .bd-label { font-size:10px; font-weight:400; color:#94A3B8; letter-spacing:.5px; text-transform:uppercase; margin-bottom:22px; line-height:1.4; }
    .bd-row   { margin-bottom:16px; }
    .bd-row:last-child { margin-bottom:0; }
    .bd-hdr   { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
    .bd-lbl   { font-size:13px; font-weight:500; color:#64748B; line-height:1.4; }
    .bd-val   { font-size:13px; font-weight:600; color:#334155; }
    .bd-pct   { font-size:10px; color:#CBD5E1; margin-right:10px; }
    .bd-track { height:4px; background:#F1F5F9; border-radius:999px; overflow:hidden; }
    .bd-fill  { height:100%; border-radius:999px; transition:width .6s ease; }

    .alert-card { background:#FEFCE8; border-radius:16px; padding:16px 20px; border:1px solid #FDE68A; box-shadow:none; transition:box-shadow .2s ease; }
    .alert-card:hover { box-shadow:0 4px 12px rgba(251,191,36,.1); }
    .alert-item { display:flex; align-items:flex-start; gap:10px; }
    .alert-item + .alert-item { margin-top:11px; padding-top:11px; border-top:1px solid rgba(253,230,138,.5); }
    .alert-dot  { width:6px; height:6px; border-radius:50%; flex-shrink:0; margin-top:4px; }
    .alert-ttl  { font-size:12px; font-weight:600; color:#374151; margin-bottom:2px; line-height:1.4; }
    .alert-body { font-size:11px; color:#9CA3AF; line-height:1.5; }
    @keyframes fadeUp   { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
    @keyframes countUp  { from{opacity:0} to{opacity:1} }
    .dash-section       { animation:fadeUp .35s ease both; }
    .kpi-card           { animation:fadeUp .3s ease both; }
    .kpi-card:nth-child(1){ animation-delay:.04s; }
    .kpi-card:nth-child(2){ animation-delay:.08s; }
    .kpi-card:nth-child(3){ animation-delay:.12s; }
    .kpi-card:nth-child(4){ animation-delay:.16s; }
    .hero-card          { animation:fadeUp .4s .1s ease both; }

    /* ══ Mobile-first responsive overrides ══════════════════════════════════ */
    @media (max-width: 640px) {

      /* ── Overflow containment ── */
      .app, .dash, .screen { overflow-x:hidden !important; }
      .app-header  { padding:0 10px; gap:6px; }
      .app-nav     { overflow:hidden; }
      .app-nav-inner { padding:0 10px; overflow-x:auto; -webkit-overflow-scrolling:touch; }

      /* ── Page & container ── */
      .dash-wrap       { padding:0 12px; }
      .dash-section    { margin-top:18px; }
      .screen          { padding:10px 12px 80px; }

      /* ── Status strip ── */
      .dash-status { font-size:11px; padding:12px 0 4px; gap:8px; }

      /* ── KPI: 2-column grid on mobile ── */
      .kpi-row  { grid-template-columns:repeat(2,1fr); gap:10px; }
      .kpi-card { padding:14px 14px 12px; border-radius:14px; }
      .kpi-label{ font-size:10px; margin-bottom:7px; }
      .kpi-val  { font-size:20px; letter-spacing:-.6px; }
      .kpi-ctx  { font-size:10px; margin-top:4px; }

      /* ── Hero: compact, not dominant ── */
      .hero-card    { padding:24px 18px 20px; border-radius:16px; }
      .hero-header  { margin-bottom:14px; }
      .hero-eyebrow { font-size:10px; margin-bottom:8px; }
      .hero-amount  { font-size:36px; letter-spacing:-2px; word-break:break-all; }
      .hero-target  { font-size:11px; margin-top:6px; }
      .hero-badge   { font-size:11px; padding:5px 12px; }
      .hero-main    { align-items:center; }

      /* ── Progress bar: thinner ── */
      .prog-wrap  { margin-top:16px; margin-bottom:6px; }
      .prog-track { height:4px; }
      .prog-labels{ font-size:9px; margin-top:5px; }

      /* ── Hero metrics footer: tighter ── */
      .hm-row   { padding-top:16px; margin-top:16px; }
      .hm-cell:not(:last-child) { padding-left:16px; margin-left:16px; }
      .hm-label { font-size:9px; margin-bottom:5px; }
      .hm-val   { font-size:17px; letter-spacing:-.5px; }
      .hm-sub   { font-size:10px; margin-top:3px; }

      /* ── Chart & breakdown: single column ── */
      .dash-grid { grid-template-columns:1fr; gap:10px; }
      .chart-card{ padding:18px 16px 14px; border-radius:14px; }
      .bd-card   { padding:18px 16px; border-radius:14px; }
      .bd-row    { margin-bottom:13px; }
      .bd-lbl    { font-size:12px; }
      .bd-val    { font-size:12px; }
      .bd-track  { height:4px; }

      /* ── Alerts: tighter ── */
      .alert-card { padding:13px 14px; border-radius:14px; }
      .alert-ttl  { font-size:12px; }
      .alert-body { font-size:11px; }

      /* ── App header ── */
      .app-header { padding:0 14px; height:48px; }
      .app-nav    { padding:0 14px; }

      /* ── Disable hover animations on touch ── */
      .kpi-card:hover,
      .chart-card:hover,
      .bd-card:hover,
      .alert-card:hover { transform:none; box-shadow:0 1px 3px rgba(0,0,0,.05); }

      /* ── Tighten animation delays ── */
      .kpi-card:nth-child(3){ animation-delay:.06s; }
      .kpi-card:nth-child(4){ animation-delay:.1s; }
    }

    /* Slightly bigger phones / small tablets */
    @media (min-width: 641px) and (max-width: 768px) {
      .dash-wrap  { padding:0 18px; }
      .kpi-row    { grid-template-columns:repeat(2,1fr); gap:12px; }
      .hero-amount{ font-size:52px; }
      .dash-grid  { grid-template-columns:1fr; }
    }


    /* ══ AI Chat — Floating Button + Panel ══════════════════════════════════ */
    .ai-fab          { position:fixed; bottom:24px; left:20px; z-index:200;
                       width:48px; height:48px; border-radius:50%; background:#6366F1; border:none;
                       cursor:pointer; display:flex; align-items:center; justify-content:center;
                       box-shadow:0 4px 18px rgba(99,102,241,.45); transition:all .2s; }
    .ai-fab:hover    { transform:scale(1.08); box-shadow:0 6px 24px rgba(99,102,241,.6); }
    .ai-fab-dot      { position:absolute; top:4px; left:4px; width:10px; height:10px;
                       background:#EF4444; border:2px solid white; border-radius:50%;
                       display:none; }
    .ai-fab-dot.show { display:block; animation:pulse 1.5s infinite; }

    .ai-panel        { position:fixed; bottom:84px; left:16px; right:16px; z-index:200;
                       background:#FFFFFF; border-radius:20px;
                       box-shadow:0 8px 40px rgba(0,0,0,.18), 0 0 0 1px rgba(99,102,241,.1);
                       overflow:hidden; transition:all .25s cubic-bezier(.4,0,.2,1);
                       transform-origin:bottom left; }
    .ai-panel.closed { opacity:0; transform:scale(.92) translateY(12px); pointer-events:none; }
    .ai-panel.open   { opacity:1; transform:scale(1) translateY(0); }
    .ai-panel-head   { background:#F8FAFC; border-bottom:1px solid #E5E7EB;
                       padding:12px 16px; display:flex; align-items:center; justify-content:space-between; }
    .ai-panel-title  { font-size:13px; font-weight:700; color:#0F172A; display:flex; align-items:center; gap:7px; }
    .ai-panel-dot    { width:7px; height:7px; background:#10B981; border-radius:50%; }
    .ai-panel-close  { width:26px; height:26px; border-radius:7px; background:#F1F5F9; border:none;
                       cursor:pointer; font-size:15px; color:#94A3B8; display:flex; align-items:center; justify-content:center; line-height:1; }
    .ai-panel-body   { padding:12px 14px; }
    .ai-answer       { background:#FAFBFF; border:1px solid #E0E7FF; border-radius:12px;
                       padding:12px 14px; margin-bottom:10px; font-size:13px; line-height:1.65;
                       color:#1E293B; max-height:160px; overflow-y:auto; }
    .ai-answer-label { font-size:10px; font-weight:600; color:#818CF8; letter-spacing:.5px;
                       text-transform:uppercase; margin-bottom:6px; display:flex; align-items:center; gap:5px; }
    .ai-answer-dot   { width:6px; height:6px; border-radius:50%; background:#818CF8; animation:pulse 1.2s infinite; }
    .ai-chips        { display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; scrollbar-width:none; margin-bottom:8px; }
    .ai-chips::-webkit-scrollbar { display:none; }
    .ai-chip         { white-space:nowrap; font-size:11px; font-weight:500; padding:5px 11px;
                       background:#F1F5F9; border:1px solid #E2E8F0; border-radius:999px;
                       color:#475569; cursor:pointer; font-family:inherit; flex-shrink:0; transition:all .15s; }
    .ai-chip:hover   { background:#EEF2FF; border-color:#C7D2FE; color:#4F46E5; }
    .ai-bar-input    { display:flex; gap:8px; align-items:center; }
    .ai-input        { flex:1; background:#F8FAFC; border:1.5px solid #E2E8F0; border-radius:12px;
                       padding:10px 14px; font-size:14px; font-family:inherit; color:#111827;
                       outline:none; direction:rtl; transition:border-color .15s; }
    .ai-input:focus  { border-color:#6366F1; background:#FAFBFF; }
    .ai-input::placeholder { color:#9CA3AF; }
    .ai-send         { width:40px; height:40px; border-radius:12px; background:#6366F1; border:none;
                       cursor:pointer; display:flex; align-items:center; justify-content:center;
                       flex-shrink:0; transition:opacity .15s; }
    .ai-send:disabled{ opacity:.45; cursor:default; }
    .ai-loading      { display:flex; gap:4px; align-items:center; padding:4px 0; }
    .ai-dot          { width:6px; height:6px; border-radius:50%; background:#818CF8; animation:aiBounce .9s ease infinite; }
    .ai-dot:nth-child(2){ animation-delay:.15s; }
    .ai-dot:nth-child(3){ animation-delay:.3s; }
    @keyframes aiBounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-5px)} }
    @keyframes spin      { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

    /* ══ Demo / Onboarding ═══════════════════════════════════════════════════ */
    .demo-banner   { background:linear-gradient(135deg,#6366F1,#818CF8); color:#fff;
                     text-align:center; padding:7px 16px; font-size:12px; font-weight:600;
                     letter-spacing:.2px; position:sticky; top:0; z-index:60; }
    .demo-banner span { opacity:.8; font-weight:400; margin-right:8px; }

    .conv-modal    { position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:1000;
                     display:flex; align-items:flex-end; padding:0;
                     backdrop-filter:blur(3px); }
    .conv-sheet    { background:#FFFFFF; width:100%; border-radius:24px 24px 0 0;
                     padding:28px 24px 36px; animation:slideUp .3s cubic-bezier(.4,0,.2,1); }
    @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
    .conv-title    { font-size:20px; font-weight:800; color:#0F172A; letter-spacing:-.5px;
                     margin-bottom:8px; line-height:1.3; }
    .conv-body     { font-size:14px; color:#64748B; line-height:1.7; margin-bottom:24px; }
    .conv-btn-main { width:100%; padding:15px; background:#6366F1; color:#fff; border:none;
                     border-radius:14px; font-size:15px; font-weight:700; cursor:pointer;
                     font-family:inherit; letter-spacing:-.2px; margin-bottom:10px; }
    .conv-btn-skip { width:100%; padding:10px; background:none; border:none; color:#94A3B8;
                     font-size:13px; cursor:pointer; font-family:inherit; }

    .connect-screen { padding:28px 20px 80px; max-width:500px; margin:0 auto; direction:rtl; }
    .connect-hero   { text-align:center; margin-bottom:32px; }
    .connect-step   { display:flex; gap:14px; align-items:flex-start; margin-bottom:20px; }
    .connect-icon   { width:36px; height:36px; background:#EEF2FF; border-radius:10px;
                      display:flex; align-items:center; justify-content:center; flex-shrink:0; }

  </style>

    // ── Config loaded from server (keeps keys out of static HTML) ──────────────
    let firebaseConfig;
    try {
      const res = await fetch("/api/config");
      if (!res.ok) throw new Error("config fetch failed");

  if (entriesMode === null || entriesMode === undefined) return { state: "storage_unresolved", writable: false, revision };
  if (entriesMode === "malformed") return { state: "storage_malformed", writable: false, revision };
  const phase = rec ? rec.phase : "legacy";
  if (phase === "legacy") {
    if (entriesMode === "v2") return { state: "v2_without_policy", writable: false, revision };
    if (entriesMode === "absent") return { state: "initialization_not_enabled", writable: false, reason: rec ? "phase_legacy" : "no_policy", revision };
    return { state: "legacy", writable: true, revision };
  }
  if (entriesMode === "legacy") return { state: "conversion_pending", writable: false, revision };
  if (entriesMode === "absent") return rec.allowV2Initialization === true
    ? { state: "v2", writable: true, revision, initialization: true }
    : { state: "initialization_not_enabled", writable: false, reason: "flag_false", revision };
  return { state: "v2", writable: true, revision };
}
// Selection-scoped policy lane: resolves the record, remembers the highest revision it has
// seen (a later LOWER revision is a rollback → fail closed), and re-derives the decision
// whenever the policy or the RAW storage mode changes.
function createPolicyLane(clientProtocol) {
  let resolved = false, parsed = null, error = false, maxRevision = 0, decision = null;
  const derive = (mode) => {
    if (!resolved) decision = { state: error ? "policy_unavailable" : "policy_unresolved", writable: false, revision: null };
    else {
      decision = decideEntriesAccess(parsed, mode, clientProtocol);
      if (parsed.status === "valid" && parsed.record.policyRevision < maxRevision) decision = { state: "policy_rollback", writable: false, revision: null, observed: maxRevision, current: parsed.record.policyRevision };
    }
    return decision;
  };
  return {
    resolve: (raw, mode) => { resolved = true; error = false; parsed = parsePolicyRecord(raw); if (parsed.status === "valid" && parsed.record.policyRevision > maxRevision) maxRevision = parsed.record.policyRevision; return derive(mode); },
    fail: (mode) => { resolved = false; error = true; parsed = null; return derive(mode); },
    recompute: (mode) => derive(mode),
    decision: () => decision,
    parsed: () => parsed,
    revision: () => (decision ? decision.revision : null),
  };
}
// Dispatch gate: the coordinator hands every job to the router through this check with
// the binding it captured at SUBMISSION. A non-writable policy state, or a revision that
// moved since submission, is a typed refusal BEFORE any transaction. Never restamps.
function gatePolicyDispatch(decision, binding) {
  if (!decision) return { status: "blocked_policy", reason: "policy_unresolved" };
  if (!decision.writable) return { status: "blocked_policy", reason: decision.state, detail: decision.reason };
  if (!binding || typeof binding !== "object" || !Object.prototype.hasOwnProperty.call(binding, "policyRevision")) return { status: "blocked_policy", reason: "intent_not_bound_to_policy" };
  if (binding.policyRevision !== decision.revision) return { status: "blocked_policy", reason: "policy_changed", bound: binding.policyRevision, live: decision.revision };
  return null;
}
// Operator-facing surface for a non-writable lane (null = nothing to show).
function describePolicyState(decision) {
  if (!decision || decision.writable) return null;
  switch (decision.state) {
    case "update_required":
      return { kind: "update", reload: true, text: "נדרש עדכון גרסה של האפליקציה. השינויים שלך לא יישמרו עד שתרענן את הדף." };
    case "maintenance_read_only":
      return { kind: "maintenance", text: decision.reason === "recovery_hold" ? "העסק במצב שחזור — צפייה בלבד. שינויים לא יישמרו." : "העסק במצב תחזוקה (מעבר אחסון) — צפייה בלבד. שינויים לא יישמרו." };
    case "initialization_not_enabled":
      return { kind: "maintenance", text: "העסק עדיין לא הופעל לאחסון החדש. פנה לתמיכה לפני הזנת רשומה ראשונה." };
    case "policy_malformed": case "policy_rollback": case "v2_without_policy": case "conversion_pending": case "storage_malformed": case "policy_unavailable":
      return { kind: "blocked", text: "מדיניות האחסון של העסק אינה תקינה או אינה זמינה — צפייה בלבד. פנה לתמיכה." };
    default:
      return null;   // policy_unresolved / storage_unresolved: transient loading, no banner
  }
}

function LoginScreen({ onLogin, tenantId, autoDemo=false }) {
  const [username,    setUsername]    = useState("");
  const [password,    setPassword]    = useState("");
  const [err,         setErr]         = useState("");
  const [loading,     setLoading]     = useState(false);
  const [showPass,    setShowPass]    = useState(false);
  const [resetMode,   setResetMode]   = useState(false);
  const [resetEmail,  setResetEmail]  = useState("");
  const [resetSent,   setResetSent]   = useState(false);

  // Auto-enter demo mode if URL param
  React.useEffect(()=>{
    if(autoDemo) { onLogin({_demo:true,name:"Demo",role:"owner"}); }
  }, [autoDemo]);

  // ── Hardcoded master user fallback ─────────────────────────────────────────
  const MASTER_USERS = {
    "yonatan": { email: "salaryonatan@gmail.com", tenantId: "biz_1772560427387", name: "יונתן סלרי" }
  };

  const tryLogin = async () => {
    if(!username.trim() || !password.trim()) { setErr("יש למלא שם משתמש וסיסמה"); return; }
    setLoading(true); setErr("");
    const dbg = []; // debug log
    try {
      const input = username.trim();
      const isEmail = input.includes("@");
      const uname = isEmail ? null : input.toLowerCase();
      let email = isEmail ? input.toLowerCase() : null;
      let foundTenantId = null;
      dbg.push("input=" + input + " isEmail=" + isEmail + " tenantId=" + tenantId);

      // ── Path A: username given -- lookup email ────────────────────────────────
      if(!email) {
        // Fast: tenantId already known
        if(tenantId) {
          try {
            const snap = await window._rtdbGet(`tenants/${tenantId}/lookup/${uname}`);
            dbg.push("fast-lookup=" + JSON.stringify(snap));
            if(snap && snap.email) { email = snap.email; foundTenantId = tenantId; }
          } catch(e){ dbg.push("fast-err=" + e.message); }
        }
        // Medium: username_index
        if(!email) {
          try {
            const indexed = await window._rtdbGet("username_index/" + uname);
            dbg.push("index=" + JSON.stringify(indexed));
            if(indexed && indexed.email) { email = indexed.email; foundTenantId = indexed.tenantId; }
            else if(indexed && indexed.tenantId) {
              foundTenantId = indexed.tenantId;
              const snap2 = await window._rtdbGet(`tenants/${indexed.tenantId}/lookup/${uname}`);
              dbg.push("lookup2=" + JSON.stringify(snap2));
              if(snap2 && snap2.email) email = snap2.email;
            }
          } catch(e){ dbg.push("index-err=" + e.message); }
        }
        // Hardcoded master fallback
        if(!email && MASTER_USERS[uname]) {
          email = MASTER_USERS[uname].email;
          foundTenantId = MASTER_USERS[uname].tenantId;
          dbg.push("master-fallback=true");
        }
        if(!email) { setErr("debug: " + dbg.join(" | ")); setLoading(false); return; }
      }

      // ── Sign in with Firebase Auth ─────────────────────────────────────────
      dbg.push("before-signIn email=" + email);
      const fbUser = await window.firebaseSignIn(email, password);
      dbg.push("signIn-ok uid=" + fbUser.uid);

      // ── Find tenantId ─────────────────────────────────────────────────────────
      if(!foundTenantId) {
        try {
          const t = await window._rtdbGet("user_tenants/" + fbUser.uid);
          dbg.push("user_tenants=" + t);
          if(t && typeof t === "string") foundTenantId = t;
        } catch(e){ dbg.push("user_tenants-err=" + e.message); }
      }
      if(!foundTenantId) {
        try {
          const cached = sessionStorage.getItem("marjin_tid_" + fbUser.uid);
          dbg.push("ls-cache=" + cached);
          if(cached) foundTenantId = cached;
        } catch(_){}
      }
      dbg.push("foundTenantId=" + foundTenantId);
      if(!foundTenantId) { setErr("debug: " + dbg.join(" | ")); setLoading(false); return; }

      // ── Load user profile ────────────────────────────────────────────────────
      let users = [];
      try {
        const userSnap = await window._rtdbGet(`tenants/${foundTenantId}/app/users`);
        users = userSnap?._v ? JSON.parse(userSnap._v) : [];
      } catch(_) { users = []; }
      // Find by username or by email (support both inputs)
      let u = uname
        ? users.find(u => u.username?.toLowerCase() === uname)
        : users.find(u => u.email?.toLowerCase() === email.toLowerCase());
      dbg.push("users=" + users.length + " searching-" + (uname||email));
      // Fallback: build user from master data if not found in app/users
      if(!u && uname && MASTER_USERS[uname]) {
        u = { id: 1, username: uname, name: MASTER_USERS[uname].name,
               email: MASTER_USERS[uname].email, role: "super_owner", firebaseUid: fbUser.uid };
        dbg.push("user-from-master=true");
        // Write to app/users so future logins find it
        try {
          await window._rtdbSet("username_index/" + uname, { tenantId: foundTenantId, email: u.email });
          await window._rtdbSet("user_tenants/" + fbUser.uid, foundTenantId);
        } catch(_){}
      }
      dbg.push("u=" + (u ? u.username : "null"));
      if(!u) { setErr("debug: " + dbg.join(" | ")); setLoading(false); return; }

      // Cache tenant + biz to sessionStorage + RTDB on every login
      try {
        sessionStorage.setItem("marjin_tid_" + fbUser.uid, foundTenantId);
        sessionStorage.setItem("marjin_biz_" + fbUser.uid, foundTenantId);
        await window._rtdbSet("user_tenants/" + fbUser.uid, foundTenantId);
        // Always update username_index so new browsers can find this user
        if(u.username) await window._rtdbSet("username_index/" + u.username.toLowerCase(), { tenantId: foundTenantId, email: u.email });
      } catch(_){}
      setErr("");
      // Store username in Firebase Auth displayName for tenant discovery fallback
      try { await window.firebaseUpdateDisplayName(fbUser, uname); } catch(_){}
      onLogin({...u, _tenantId: foundTenantId, firebaseUid: fbUser.uid});
    } catch(e) {
      const msg = e.code === "auth/wrong-password" || e.code === "auth/invalid-credential"
        ? "סיסמה שגויה" : e.code === "auth/too-many-requests"
        ? "יותר מדי ניסיונות -- נסה שוב מאוחר יותר" : (e.message||"err") + " | " + dbg.join(" | ");
      setErr(msg);
    }
    setLoading(false);
  };

  const trySendReset = async () => {
    if(!resetEmail.trim()) { setErr("יש להזין כתובת מייל"); return; }
    setLoading(true); setErr("");
    try {
      await window.firebaseSendReset(resetEmail.trim());
      setResetSent(true);
    } catch(e) {
      setErr(e.code === "auth/user-not-found" ? "מייל לא נמצא במערכת" : "שגיאה בשליחת המייל");
    }
    setLoading(false);
  };

  return (
    <div className="auth-root">
      <div className="auth-box">
        <div className="tc mb4">
          <div className="auth-logo">
            <span style={{color:"#fff",fontSize:16,fontWeight:700,letterSpacing:-0.5}}>M</span>
          </div>
          <h1 className="auth-title">Marjin</h1>
          <p className="auth-sub" style={{marginBottom:0}}>מערכת ניהול מסעדות</p>
        </div>
        <label className="label">שם משתמש</label>
        <input className="input" placeholder="username" value={username}
          onChange={e=>{setUsername(e.target.value);setErr(false);}}
          onKeyDown={e=>e.key==="Enter"&&tryLogin()}
          autoCapitalize="none" autoCorrect="off"/>
        <label className="label">סיסמה</label>
        <div className="pass-wrap field">
          <input className="input" type={showPass?"text":"password"} placeholder="••••••"
            value={password} onChange={e=>{setPassword(e.target.value);setErr(false);}}
            onKeyDown={e=>e.key==="Enter"&&tryLogin()}/>
          <button className="pass-eye" onClick={()=>setShowPass(p=>!p)}>
            {showPass ? "×" : <svg width="14" height="14" fill="none" stroke="#9CA3AF" strokeWidth="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>}
          </button>
        </div>
        {err && <div className="form-err">{err}</div>}
        <button className="btn btn-primary btn-full" style={{opacity:loading?0.6:1}} onClick={loading?null:tryLogin} disabled={loading}>
          {loading ? "מתחבר..." : "כניסה"}
        </button>
        <div style={{textAlign:"center",marginTop:16}}>
          <button className="btn-link" onClick={()=>{setResetMode(true);setErr("");}}>שכחתי סיסמה

        <div style={{marginTop:24,paddingTop:20,borderTop:"1px solid #F1F5F9",textAlign:"center"}}>
          <div style={{fontSize:12,color:"#94A3B8",marginBottom:10}}>רוצה לראות איך זה עובד?</div>
          <button

              color:"#fff",border:"none",borderRadius:12,fontSize:14,fontWeight:700,
              cursor:"pointer",fontFamily:"inherit",letterSpacing:"-.2px",
              boxShadow:"0 4px 14px rgba(99,102,241,.35)"}}>
            🚀 התחל עכשיו — Demo חינם
          </button>
          <div style={{fontSize:11,color:"#CBD5E1",marginTop:8}}>ללא הרשמה · נתונים לדוגמה</div>
        </div>
      </div>
      {/* ── Forgot password modal ─────────────────────────────────────── */}
      {resetMode && (
        <div className="modal-overlay" style={{zIndex:9999}}>
          <div className="modal-box" style={{maxWidth:360}}>
            {resetSent ? (
              <>
                <div style={{width:36,height:36,background:"#F9FAFB",borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px"}}>
                  <svg width="18" height="18" fill="none" stroke="#16A34A" strokeWidth="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.82a19.79 19.79 0 01-3.07-8.67A2 2 0 012 1h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 8.91a16 16 0 006.18 6.18l1.28-1.28a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
                </div>
                <h3 className="modal-title tc mb2">קישור נשלח</h3>
                <p className="t-sm c-sub tc mb4">בדוק את תיבת הדואר ולחץ על הקישור לאיפוס הסיסמה.</p>
                <button onClick={()=>{setResetMode(false);setResetSent(false);setResetEmail("");}}
                  className="btn btn-primary btn-full">
                  סגור
                </button>

            ) : (
              <>
                <h3 className="modal-title mb1">איפוס סיסמה</h3>
                <p className="t-sm c-sub mb3">הזן את כתובת המייל ונשלח לך קישור לאיפוס.</p>
                <input className="input mb2" style={{direction:"ltr"}}
                  type="email" placeholder="your@email.com"
                  value={resetEmail} onChange={e=>setResetEmail(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&trySendReset()}/>
                {err && <div className="form-err">{err}</div>}
                <div className="modal-actions">
                  <button onClick={trySendReset} disabled={loading}
                    className="btn btn-primary" style={{flex:1,opacity:loading?0.6:1}}>
                    {loading ? "שולח..." : "שלח קישור"}
                  </button>
                  <button onClick={()=>{setResetMode(false);setErr("");}}
                    style={{padding:"11px 14px",background:"#FFFFFF",border:"1px solid #E5E7EB",borderRadius:8,color:"#6B7280",fontWeight:500,fontSize:14,cursor:"pointer",fontFamily:"inherit"}}>
                    ביטול
                  </button>
                </div>
              </>
            )}

        </div>
      )}
    </div>
  );
}

// ─── User Management Panel ────────────────────────────────────────────────────
function UserManagement({ users, saveUsers, tenantId, businesses }) {
  const [showAdd, setShowAdd] = useState(false);
  const [editId,  setEditId]  = useState(null);
  const [form, setForm] = useState({name:"",username:"",email:"",phone:"",role:"manager",allowedBizIds:[]});
  const [err,  setErr]  = useState("");
  const [saving, setSaving] = useState(false);

  const resetForm = () => { setForm({name:"",username:"",email:"",phone:"",role:"manager",allowedBizIds:[]}); setErr(""); setShowAdd(false); setEditId(null); };

  const toggleBiz = (bizId) => {
    setForm(f => ({
      ...f,
      allowedBizIds: f.allowedBizIds.includes(bizId)
        ? f.allowedBizIds.filter(id => id !== bizId)
        : [...f.allowedBizIds, bizId]
    }));
  };

  const needsBizAccess = form.role !== "super_owner" && form.role !== "owner";

  const save = async () => {
    if(!form.name.trim()||!form.username.trim()) return setErr("יש למלא שם ושם משתמש");
    if(!editId && !form.email.trim()) return setErr("יש להזין כתובת אימייל");
    if(users.find(u=>u.username===form.username.trim()&&u.id!==editId)) return setErr("שם משתמש כבר קיים");
    if(needsBizAccess && form.allowedBizIds.length===0 && businesses.length>1) return setErr("יש לבחור לפחות עסק אחד");
    setSaving(true); setErr("");
    try {
      const allowedBizIds = needsBizAccess
        ? (businesses.length === 1 ? [businesses[0].id] : form.allowedBizIds)
        : null;
      if(editId) {
        // ── Layer 2: route edit through /api/admin?action=update-user ──
        const existing = users.find(u => u.id === editId);
        const targetUid = existing?.firebaseUid;
        if (!targetUid) {
          setErr("חסר מזהה משתמש — לא ניתן לערוך");
          setSaving(false); return;
        }
        const token = await window.getIdToken().catch(() => null);
        if (!token) {
          setErr("שגיאה: אין חיבור למערכת — יש להתחבר מחדש");
          setSaving(false); return;
        }
        const upResp = await fetch("/api/admin?action=update-user", {
          method: "POST",
          headers: {"Content-Type":"application/json","Authorization":"Bearer " + token},
          body: JSON.stringify({
            tenantId,
            firebaseUid: targetUid,
            name:  form.name.trim(),
            email: form.email.trim(),
            phone: form.phone.trim(),
            role:  form.role,
            allowedBizIds,
          })
        });
        const upResult = await upResp.json().catch(() => ({}));
        if (!upResp.ok) {
          if      (upResp.status === 409) setErr(upResult.error || "כתובת האימייל כבר קיימת במערכת");
          else if (upResp.status === 403) setErr(upResult.error || "אין הרשאה לעריכת המשתמש");
          else                            setErr(upResult.error || "שגיאה בשמירת המשתמש");
          setSaving(false); return;
        }
        // ── Layer 2 review: backend is the source of truth on update. Do NOT
        //    write to RTDB from here — that would overwrite the backend's
        //    updatedAt/updatedBy. The window.storage.subscribe on "app-users"
        //    (parent's `sub` at startup) will refresh local state from the
        //    backend's write within a tick.
      } else {
        // ── Create user via server API (atomic + rollback) ──────────────
        const token = await window.getIdToken().catch(() => null);
        if (!token) {
          setErr("שגיאה: אין חיבור למערכת — יש להתחבר מחדש");
          setSaving(false); return;
        }
        const resp = await fetch("/api/admin?action=create-user", {
          method: "POST",
          headers: {"Content-Type":"application/json","Authorization":"Bearer " + token},
          body: JSON.stringify({
            tenantId,
            email: form.email.trim(),
            username: form.username.trim(),
            name: form.name.trim(),
            phone: form.phone.trim(),
            role: form.role,
            allowedBizIds
          })
        });
        const result = await resp.json();
        if (!resp.ok) {
          setErr(result.error || "שגיאה ביצירת המשתמש");
          setSaving(false); return;
        }
        // Backend is the source of truth on create: the create-user API now
        //   persists app/users, users/{uid} and biz_access atomically (with the
        //   validated allowedBizIds). Do NOT write app/users from here — the
        //   window.storage.subscribe on "app-users" refreshes local state from
        //   the backend within a tick (same pattern as the update path above).
      }
      resetForm();
    } catch(e) {
      const msg = e.code==="auth/weak-password" ? "סיסמה חלשה מדי"
        : e.message || "שגיאה ביצירת המשתמש";
      setErr(msg);
    }
    setSaving(false);
  };

  const startEdit = (u) => { setEditId(u.id); setForm({name:u.name,username:u.username,email:u.email||"",phone:u.phone||"",role:u.role,allowedBizIds:u.allowedBizIds||[]}); setShowAdd(true); };
  const deleteUser = async (id) => {
    const u = users.find(u=>u.id===id);
    if(!u || u.role==="super_owner") return;
    if(!u.firebaseUid) {
      setErr("לא ניתן למחוק — חסר מזהה משתמש. יש לפנות לתמיכה.");
      return;
    }
    if(!confirm(`למחוק את המשתמש "${u.name}"? פעולה זו תמחק את החשבון לגמרי.`)) return;
    // Delete from Firebase Auth + RTDB via API. A stable requestId is generated
    //   ONCE per user action so retries are idempotent (owner-affecting deletes
    //   resume through the durable owner guard rather than double-applying).
    const delRequestId = (window.crypto && window.crypto.randomUUID)
      ? window.crypto.randomUUID()
      : ("del-" + Date.now() + "-" + Math.random().toString(36).slice(2));
    try {
      const token = await window.getIdToken().catch(() => null);
      if(!token) { setErr("שגיאה: אין חיבור למערכת — יש להתחבר מחדש"); return; }
      const resp = await fetch("/api/admin?action=delete-user", {
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
        body: JSON.stringify({ tenantId, firebaseUid: u.firebaseUid, username: u.username, requestId: delRequestId })
      });
      const result = await resp.json();
      if(!resp.ok) {
        setErr(result.error || "שגיאה במחיקת המשתמש");
        return;
      }
    } catch(e) {
      setErr("שגיאה במחיקת המשתמש — יש לנסות שוב");
      return;
    }
    saveUsers(users.filter(u=>u.id!==id));
  };

  return (
    <div className="fw">
      {users.map(u=>(
        <div key={u.id} className="data-row">
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",alignItems:"center",gap:7}}>
              <div style={{fontWeight:600,color:"#111827",fontSize:13}}>{u.name}</div>
              {u.mustCompleteProfile && (
                <span style={{fontSize:10,background:"#F9FAFB",border:"1px solid #E5E7EB",color:"#6B7280",borderRadius:3,padding:"1px 6px"}}>
                  ממתין
                </span>
              )}
            </div>
            <div style={{fontSize:11,color:"#9CA3AF",marginTop:1}}>@{u.username}</div>
          </div>
          <span style={{fontSize:10,fontWeight:600,padding:"2px 7px",borderRadius:3,textTransform:"uppercase",letterSpacing:0.4,color:ROLE_COLORS[u.role]?.color||"#6B7280",background:ROLE_COLORS[u.role]?.bg||"#F9FAFB"}}>
            {ROLES[u.role]?.label||u.role}
          </span>
          {u.allowedBizIds && u.allowedBizIds.length > 0 && businesses && (
            <span style={{fontSize:10,color:"#9CA3AF",flexShrink:0}}>
              {u.allowedBizIds.length===businesses.length ? "הכל" : `${u.allowedBizIds.length} עסקים`}
            </span>
          )}
          <button className="icon-btn" onClick={()=>startEdit(u)} title="עריכה"><IcoEdit/></button>
          {u.role!=="super_owner" && <button className="icon-btn" onClick={()=>deleteUser(u.id)}><IcoTrash/></button>}
        </div>
      ))}

      {showAdd ? (
        <div className="card card-p mb3">
          <div style={{fontWeight:600,color:"#111827",fontSize:13,marginBottom:12}}>{editId?"עריכת משתמש":"הוספת משתמש"}</div>
          {!editId && (
            <div className="form-hint">
              המשתמש יקבל הזמנה במייל עם סיסמא זמנית ויגדיר סיסמה אישית בכניסה הראשונה
            </div>
          )}
          {err && <div className="form-err">{err}</div>}
          <label className="label">שם מלא</label>
          <input className="input" placeholder="ישראל ישראלי" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/>
          <label className="label">שם משתמש</label>
          <input className="input" placeholder="username" autoCapitalize="none" value={form.username} onChange={e=>setForm(f=>({...f,username:e.target.value}))} disabled={!!editId}/>
          <label className="label">אימייל{!editId ? " (חובה — לשליחת הזמנה)" : ""}</label>
          <input className="input" type="email" placeholder="user@example.com" style={{direction:"ltr"}} value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value.trim()}))}/>
          {editId && (
            <div style={{fontSize:11,color:"#92400E",background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:5,padding:"6px 9px",margin:"4px 0 10px"}}>
              שינוי מייל יעדכן גם את חשבון ההתחברות
            </div>
          )}
          <label className="label">טלפון (אופציונלי)</label>
          <input className="input" type="tel" placeholder="972541234567" style={{direction:"ltr"}} value={form.phone} onChange={e=>setForm(f=>({...f,phone:e.target.value.replace(/[^0-9+]/g,"")}))}/>
          <label className="label">תפקיד</label>
          <select className="select" value={form.role} onChange={e=>setForm(f=>({...f,role:e.target.value, allowedBizIds:[]}))}>
            <option value="manager">מנהל — לוח בקרה מלא</option>
            <option value="shift_manager">אחמש — משמרות וניהול</option>
            <option value="viewer">צופה — צפייה בלבד</option>
          </select>
          {needsBizAccess && businesses && businesses.length > 1 && (
            <div style={{marginBottom:10}}>
              <label className="label" style={{marginBottom:6}}>גישה לעסקים</label>
              <div style={{display:"flex",flexDirection:"column",gap:5}}>
                {businesses.map(biz => (
                  <label key={biz.id} style={{display:"flex",alignItems:"center",gap:9,padding:"8px 11px",background:form.allowedBizIds.includes(biz.id)?"#F9FAFB":"#FFFFFF",border:"1px solid "+(form.allowedBizIds.includes(biz.id)?"#D1D5DB":"#E5E7EB"),borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>
                    <input type="checkbox" checked={form.allowedBizIds.includes(biz.id)} onChange={()=>toggleBiz(biz.id)} style={{width:14,height:14,accentColor:"#111827",cursor:"pointer",flexShrink:0}}/>
                    <span style={{fontSize:13,fontWeight:500,color:"#111827"}}>{biz.name}</span>
                  </label>
                ))}
              </div>
            </div>
          )}
          <div style={{display:"flex",gap:7,marginTop:4}}>
            <button className="btn btn-primary" onClick={save} disabled={saving}>{saving?"שומר...":"שמור"}</button>
            <button className="btn btn-secondary" onClick={resetForm}>ביטול</button>
          </div>
        </div>
      ) : (
        <button className="btn btn-ghost btn-full mt2" onClick={()=>{setShowAdd(true);setEditId(null);}}>הוסף משתמש</button>
      )}
    </div>
  );
}

// ─── Profile Completion Screen (first login) ──────────────────────────────────
function ProfileCompletionScreen({ user, onComplete }) {
  const [email,    setEmail]    = useState("");
  const [pass,     setPass]     = useState("");
  const [pass2,    setPass2]    = useState("");
  const [showPass, setShowPass] = useState(false);
  const [err,      setErr]      = useState("");
  const [loading,  setLoading]  = useState(false);
  const [step,     setStep]     = useState(1); // 1=welcome, 2=form

  const save = async () => {
    if(!email.trim()) return setErr("יש להזין כתובת מייל");
    if(!/^[^@]+@[^@]+\.[^@]+$/.test(email.trim())) return setErr("כתובת מייל לא תקינה");
    if(!pass) return setErr("יש לבחור סיסמה חדשה");
    if(pass.length < 6) return setErr("סיסמה חייבת להיות לפחות 6 תווים");
    if(pass !== pass2) return setErr("הסיסמאות אינן תואמות");
    setLoading(true); setErr("");
    try {
      // Use Admin SDK server-side to update email + password (avoids auth/requires-recent-login)
      const token = await window._auth?.currentUser?.getIdToken();
      const resp = await fetch("/api/admin?action=complete-profile", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ newEmail: email.trim(), newPassword: pass })
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || "שגיאה בשמירת הפרטים");
      // Re-sign in with new credentials so Firebase Auth session uses the new email
      try { await window.firebaseSignIn(email.trim(), pass); } catch(_){}
      // Update user record
      onComplete({ email: email.trim() });
    } catch(e) {
      const msg = e.message?.includes("email-already-exists")
        ? "כתובת המייל כבר בשימוש -- נסה כתובת אחרת"
        : e.message?.includes("invalid-email")
        ? "כתובת מייל לא תקינה"
        : e.message || "שגיאה בשמירת הפרטים";
      setErr(msg);
    }
    setLoading(false);
  };

  if(step === 1) return (
    <div className="auth-root">
      <div className="auth-box">
        <div style={{width:36,height:36,background:"#111827",borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 18px"}}>
          <span style={{color:"#fff",fontSize:14,fontWeight:700}}>M</span>
        </div>
        <h2 className="auth-title mb1">ברוך הבא, {user.name}</h2>
        <p className="c-muted t-sm tc mb4">נגדיר מייל וסיסמה אישית לחשבון שלך</p>
        <div className="tc fw6 c-muted t-sm mb4 card card-p-sm">@{user.username}</div>
        <div style={{background:"#F9FAFB",border:"1px solid #E5E7EB",borderRadius:7,padding:"12px 14px",marginBottom:18}}>
          <div style={{fontSize:11,fontWeight:600,color:"#6B7280",textTransform:"uppercase",letterSpacing:0.8,marginBottom:8}}>מה נגדיר</div>
          {["כתובת מייל לשחזור סיסמה","סיסמה אישית שרק אתה יודע"].map((text,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:8,fontSize:12,color:"#6B7280",marginBottom:i===0?5:0}}>
              <div style={{width:5,height:5,borderRadius:"50%",background:"#D1D5DB",flexShrink:0}}/>
              <span>{text}</span>
            </div>
          ))}
        </div>
        <button className="btn btn-primary btn-full" onClick={()=>setStep(2)}>המשך</button>
      </div>
    </div>
  );

  return (
    <div className="auth-root">
      <div className="auth-box">
        <div className="flex jcenter g2 mb3">
          <div style={{width:6,height:6,borderRadius:"50%",background:"#D1D5DB"}}/>
          <div style={{width:6,height:6,borderRadius:"50%",background:"#111827"}}/>
        </div>
        <h2 className="auth-title mb1">הגדרת פרטים אישיים</h2>
        <p className="c-muted t-sm tc">פרטים אלו שמורים אצלך בלבד</p>

        <label className="label">כתובת מייל (לשחזור סיסמה)</label>
        <input className="input" style={{direction:"ltr"}} type="email" placeholder="your@email.com"
          value={email} onChange={e=>{setEmail(e.target.value);setErr("");}}
          onKeyDown={e=>e.key==="Enter"&&save()}/>

        <label className="label">סיסמה חדשה</label>
        <div className="pass-wrap field">
          <input className="input" type={showPass?"text":"password"} placeholder="לפחות 6 תווים"
            value={pass} onChange={e=>{setPass(e.target.value);setErr("");}}/>
          <button className="pass-eye" onClick={()=>setShowPass(p=>!p)}>{showPass?"×":"···"}</button>
        </div>

        <label className="label">אימות סיסמה</label>
        <input className="input" style={{border:`1px solid ${pass2&&pass2!==pass?"#FECACA":pass2?"#E5E7EB":"#D1D5DB"}`}}
          type="password" placeholder="הכנס שוב"
          value={pass2} onChange={e=>{setPass2(e.target.value);setErr("");}}
          onKeyDown={e=>e.key==="Enter"&&save()}/>
        {pass2 && pass2!==pass && <div style={{fontSize:11,color:"var(--danger)",marginTop:-5,marginBottom:7}}>הסיסמאות אינן תואמות</div>}
        {pass2 && pass2===pass && <div style={{fontSize:11,color:"var(--success)",marginTop:-5,marginBottom:7}}>הסיסמאות תואמות</div>}

        {err && <div className="form-err">{err}</div>}
        <button className="btn btn-primary btn-full" style={{opacity:loading?0.6:1}} onClick={loading?null:save} disabled={loading}>
          {loading?"שומר...":"שמור וכנס למערכת"}
        </button>
      </div>
    </div>
  );
}

const ALL_SUBS_LIGHT = REGIONS_LIGHT.flatMap(r =>
  r.sub.map(s => ({ ...s, regionId: r.id, regionName: r.name }))
);
const haversineKm = (a, b) => {
  const R = 6371;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat);
  const dLon = toRad(b.lon - a.lon);
  const lat1 = toRad(a.lat), lat2 = toRad(b.lat);
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
};
const findNearestSubRegion = (point) => {
  let best = null, bestDist = Infinity;
  for (const s of ALL_SUBS_LIGHT) {
    const d = haversineKm(point, s.center);
    if (d < bestDist) { best = s; bestDist = d; }
  }
  return best ? { ...best, distanceKm: bestDist } : null;
};
