// ─── P&L Screen ──────────────────────────────────────────────────────────────
function PnLScreen({ entries=[], fixedList=[], businessConfig={}, lastYear=[], finView, finSrc, finCoreState, todayStr, requestFinanceFrom }) {
  // C1 (P-01…P-10, U-4…U-11): every figure is a field of the selected month's report
  // (open month = Actual through D-1; a past month = closed month) and of the prior-year
  // same month's closed report. VD-50 (the "רווח גולמי" line) is OWNER-PENDING: shown as "—".
  const today0 = todayStr || `${YEAR}-${MONTH_STR}-01`;
  const [selYear, setSelYear] = useState(Number(today0.slice(0, 4)));
  const [selMonth, setSelMonth] = useState(Number(today0.slice(5, 7)) - 1);
  const monthKey = `${selYear}-${String(selMonth+1).padStart(2,"0")}`;
  const prevKey = `${selYear-1}-${String(selMonth+1).padStart(2,"0")}`;
  const pv = React.useMemo(() => (typeof finView === "function" ? finView((F, S) => window.MarjinC1.pnl(F, S, monthKey, prevKey)) : { status: "unavailable" }), [finSrc, finCoreState, monthKey, prevKey]);
  useEffect(() => {
    if (typeof requestFinanceFrom !== "function" || !pv) return;
    if ((pv.status === "loading" && pv.reason === "ledger_range") || pv.prevLoading) requestFinanceFrom(prevKey + "-01");
  }, [pv, prevKey]);
  const F = window.MarjinFinance;
  const ready = pv.status === "ready";

  // P-03 (U12, RETAINED): the manually imported last-year month is the comparison basis ONLY
  // when the prior-year month has no recorded Actual. Its numbers are imported values (not
  // computed here); only the four mapped rows get a delta, and no profit is derived from them.
  const lyData = lastYear[selMonth] || {};
  const lyAmount = (v) => (F && typeof v === "number" && isFinite(v) && v > 0) ? F.finance.decimal.serializeDec(F.finance.decimal.decFromNumber(v)) : null;
  const lyMap = { revenue: lyAmount(lyData.sales), purchases: lyAmount(lyData.foodCost), labor: lyAmount(lyData.laborCost), fixedRent: lyAmount(lyData.fixedExpenses) };
  const lyUsable = ready && !pv.hasPrev && Object.values(lyMap).some(x => x !== null);
  const hasPrev = ready && (pv.hasPrev || lyUsable);
  const deltaOf = (key) => {
    if (!ready) return { text: "—", delta: null };
    const r = pv.rows[key];
    if (pv.hasPrev) return { text: r.deltaText, delta: r.delta };
    const p = lyUsable ? lyMap[key] : null;
    if (p === null || p === undefined || r.amount === null) return { text: "—", delta: null };
    const d = F.finance.decimal.serializeRat(F.finance.decimal.ratSub(F.finance.decimal.parseAmountString(r.amount), F.finance.decimal.parseAmountString(p)));
    const n = F.metrics.adapters.legacyNumber.amountToNumber(d);
    return { text: (n > 0 ? "+" : "") + F.presenters.money.formatShekel(d), delta: d };
  };
  const signOf = (d) => (d === null || !F) ? null : F.metrics.adapters.legacyNumber.amountToNumber(d);

  // Month navigation
  const goMonth = (dir) => {
    let nm = selMonth + dir;
    let ny = selYear;
    if (nm < 0) { nm = 11; ny--; }
    if (nm > 11) { nm = 0; ny++; }
    setSelMonth(nm); setSelYear(ny);
  };
  const atCurrent = monthKey >= today0.slice(0, 7);

  const PnLRow = ({ label, text, shareText, delta, isBold, isNegative, negativeValue, showPct, indent, c1 }) => {
    const d = signOf(delta ? delta.delta : null);
    return (
      <div data-c1={c1} style={{
        display:"grid", gridTemplateColumns: hasPrev ? "1fr auto auto auto" : "1fr auto auto",
        gap:8, padding:"10px 14px", borderBottom:"1px solid #F1F5F9",
        background: isBold ? "#F8FAFC" : "transparent",
        paddingRight: indent ? 28 : 14,
      }}>
        <span style={{fontSize:13, fontWeight:isBold?700:400, color:isBold?"#0F172A":"#334155"}}>{label}</span>
        <span style={{fontSize:13, fontWeight:isBold?700:500, color:negativeValue?"#EF4444":"#0F172A", textAlign:"left", minWidth:75, fontVariantNumeric:"tabular-nums"}}>
          {text}
        </span>
        {showPct !== false && (
          <span style={{fontSize:11, color:"#94A3B8", textAlign:"left", minWidth:42, fontVariantNumeric:"tabular-nums"}}>
            {shareText || "—"}
          </span>
        )}
        {hasPrev && (
          <span style={{fontSize:11, minWidth:65, textAlign:"left", fontVariantNumeric:"tabular-nums",
            color: d==null ? "#CBD5E1" : d > 0 ? (isNegative?"#EF4444":"#22C55E") : d < 0 ? (isNegative?"#22C55E":"#EF4444") : "#94A3B8"
          }}>
            {delta ? delta.text : "—"}
          </span>
        )}
      </div>
    );
  };

  const SectionHeader = ({ label }) => (
    <div style={{padding:"8px 14px", background:"#F1F5F9", fontSize:11, fontWeight:700, color:"#64748B", textTransform:"uppercase", letterSpacing:1}}>
      {label}
    </div>
  );
  const row = (k) => ready ? pv.rows[k] : { text: "—", shareText: "—", negative: false };
  const net = row("net");
  const netDelta = ready && pv.hasPrev ? deltaOf("net") : { text: "—", delta: null };
  const netNum = ready ? signOf(pv.rows.net.amount) : null;

  return (
    <div>
      {/* Month selector */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
        <button onClick={()=>goMonth(-1)} style={{background:"#F1F5F9",border:"none",borderRadius:8,width:36,height:36,cursor:"pointer",fontSize:16,color:"#64748B",display:"flex",alignItems:"center",justifyContent:"center"}}>→</button>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:18,fontWeight:700,color:"#0F172A"}}>{MONTH_NAMES[selMonth]} {selYear}</div>
          <div data-c1="pnl-days" style={{fontSize:11,color:"#94A3B8"}}>{ready ? `${pv.days.recognized} ימים בפועל מתוך ${pv.days.inMonth} · ${pv.days.present} הוזנו${pv.days.closed ? ` · ${pv.days.closed} סגורים` : ""}` : "—"} · P&L</div>
          {ready && pv.configurationBasis.indexOf("current_applied_retrospectively") !== -1 && <div style={{fontSize:10,color:"#94A3B8"}}>{F.presenters.labels.LABELS.configurationBasis.current_applied_retrospectively}</div>}
        </div>
        <button onClick={()=>goMonth(1)} style={{background:"#F1F5F9",border:"none",borderRadius:8,width:36,height:36,cursor:"pointer",fontSize:16,color:"#64748B",display:"flex",alignItems:"center",justifyContent:"center"}}
          disabled={atCurrent}>←</button>
      </div>

      {!ready ? (
        <div className="empty" data-c1="fin-unavailable" style={{padding:40}}>
          <p style={{fontSize:14,color:pv.status==="loading"?"#94A3B8":"#92400E",margin:0}}>{pv.status==="loading" ? "טוען נתונים כספיים…" : "הנתונים הכספיים אינם זמינים כעת — לא מוצגים סכומים ואחוזים."}</p>
        </div>
      ) : pv.empty ? (
        <div className="empty" style={{padding:40}}>
          <div style={{fontSize:32,marginBottom:12}}>📊</div>
          <p style={{fontSize:14,color:"#94A3B8",margin:0}}>אין נתונים עבור {MONTH_NAMES[selMonth]} {selYear}</p>
          <p style={{fontSize:12,color:"#CBD5E1",marginTop:4}}>נסה לבחור חודש אחר</p>
        </div>
      ) : (
        <div style={{background:"#FFFFFF",borderRadius:12,border:"1px solid #E2E8F0",overflow:"hidden"}}>
          {/* Header row */}
          <div style={{
            display:"grid", gridTemplateColumns: hasPrev ? "1fr auto auto auto" : "1fr auto auto",
            gap:8, padding:"10px 14px", background:"#0F172A", color:"#94A3B8", fontSize:10, fontWeight:600, textTransform:"uppercase", letterSpacing:1
          }}>
            <span>סעיף</span>
            <span style={{minWidth:75,textAlign:"left"}}>{MONTH_NAMES[selMonth].slice(0,3)} {String(selYear).slice(2)}</span>
            <span style={{minWidth:42,textAlign:"left"}}>%</span>
            {hasPrev && <span style={{minWidth:65,textAlign:"left"}}>{pv.hasPrev ? "שינוי" : "שינוי (נתוני שנה קודמת ידניים)"}</span>}
          </div>
          {pv.disclosure.warning && <div data-c1="revenue-warning" style={{padding:"8px 14px",fontSize:11,color:"#DC2626",borderBottom:"1px solid #F1F5F9"}}>{pv.disclosure.warning}</div>}
          {pv.disclosure.closures && <div data-c1="closures" style={{padding:"6px 14px",fontSize:11,color:"#64748B",borderBottom:"1px solid #F1F5F9"}}>{pv.disclosure.closures}</div>}

          {/* Revenue */}
          <SectionHeader label="הכנסות" />
          <PnLRow c1="pnl-revenue" label="הכנסות" text={pv.rows.revenue.text} delta={deltaOf("revenue")} isBold showPct={false} />
          {pv.deliveries.show && <PnLRow c1="pnl-deliveries" label="מתוכן משלוחים" text={pv.deliveries.text} shareText={"—"} indent />}

          {/* COGS */}
          <SectionHeader label="עלויות" />
          <PnLRow c1="pnl-purchases" label="קניות (פוד קוסט)" text={pv.rows.purchases.text} shareText={pv.rows.purchases.shareText} delta={deltaOf("purchases")} isNegative />
          <PnLRow c1="pnl-labor" label="עלות עובדים (לייבור)" text={pv.rows.labor.text} shareText={pv.rows.labor.shareText} delta={deltaOf("labor")} isNegative />
          {pv.showOther && <PnLRow c1="pnl-other" label="הוצאות אחרות" text={pv.rows.other.text} shareText={pv.rows.other.shareText} isNegative />}

          {/* VD-50 — OWNER DECISION PENDING: no approved definition; isolated, shown as "—". */}
          <PnLRow c1="pnl-vd50" label="רווח גולמי" text={pv.gross.text} shareText={"—"} delta={{text:"—",delta:null}} isBold />

          {/* Fixed */}
          <SectionHeader label="הוצאות קבועות" />
          <PnLRow c1="pnl-fixed" label="קבועות + שכ״ד" text={pv.rows.fixedRent.text} shareText={pv.rows.fixedRent.shareText} delta={deltaOf("fixedRent")} isNegative />
          {pv.showRoyalty && <PnLRow c1="pnl-royalty" label="תמלוגים" text={pv.rows.royalty.text} shareText={pv.rows.royalty.shareText} isNegative />}

          {/* Net profit */}
          <div data-c1="pnl-net" style={{padding:"14px",background:"linear-gradient(135deg,#0F172A,#1E293B)",display:"grid",
            gridTemplateColumns: hasPrev ? "1fr auto auto auto" : "1fr auto auto", gap:8, alignItems:"center"}}>
            <span style={{fontSize:14,fontWeight:700,color:"#F8FAFC"}}>רווח נקי</span>
            <span style={{fontSize:16,fontWeight:700,color:netNum===null?"#94A3B8":netNum>=0?"#4ADE80":"#F87171",minWidth:75,textAlign:"left",fontVariantNumeric:"tabular-nums"}}>
              {net.text}
            </span>
            <span style={{fontSize:12,fontWeight:600,color:pv.netPct.negative?"#F87171":"#4ADE80",minWidth:42,textAlign:"left"}}>
              {pv.netPct.text}
            </span>
            {hasPrev && (
              <span style={{fontSize:11,color:signOf(netDelta.delta)===null?"#94A3B8":signOf(netDelta.delta)>0?"#4ADE80":"#F87171",minWidth:65,textAlign:"left",fontVariantNumeric:"tabular-nums"}}>
                {netDelta.text}
              </span>
            )}
          </div>
        </div>
      )}

      {/* Summary KPIs below (P-08: colour literals retained, applied to values only) */}
      {ready && !pv.empty && (
        <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8,marginTop:14}}>
          <div style={{background:"#F8FAFC",borderRadius:10,padding:"12px 14px",border:"1px solid #E2E8F0"}}>
            <div style={{fontSize:10,color:"#94A3B8",fontWeight:600,marginBottom:4}}>פוד קוסט</div>
            <div data-c1="pnl-kpi-purchases" style={{fontSize:18,fontWeight:700,color:pv.purchasesPct.num===null?"#94A3B8":pv.purchasesPct.num>35?"#EF4444":pv.purchasesPct.num>33?"#F59E0B":"#0F172A"}}>{pv.purchasesPct.text}</div>
          </div>
          <div style={{background:"#F8FAFC",borderRadius:10,padding:"12px 14px",border:"1px solid #E2E8F0"}}>
            <div style={{fontSize:10,color:"#94A3B8",fontWeight:600,marginBottom:4}}>לייבור</div>
            <div data-c1="pnl-kpi-labor" style={{fontSize:18,fontWeight:700,color:pv.laborPct.num!==null&&pv.laborPct.num>30?"#EF4444":pv.laborPct.num===null?"#94A3B8":"#0F172A"}}>{pv.laborPct.text}</div>
          </div>
          <div style={{background:"#F8FAFC",borderRadius:10,padding:"12px 14px",border:"1px solid #E2E8F0"}}>
            <div style={{fontSize:10,color:"#94A3B8",fontWeight:600,marginBottom:4}}>ממוצע יומי (ימי פעילות)</div>
            <div data-c1="pnl-kpi-avg" style={{fontSize:18,fontWeight:700,color:"#0F172A"}}>{pv.avgPerDay}</div>
          </div>
          <div style={{background:"#F8FAFC",borderRadius:10,padding:"12px 14px",border:"1px solid #E2E8F0"}}>
            <div style={{fontSize:10,color:"#94A3B8",fontWeight:600,marginBottom:4}}>רווח נקי %</div>
            <div data-c1="pnl-kpi-net" style={{fontSize:18,fontWeight:700,color:pv.netPct.text==="—"?"#94A3B8":pv.netPct.negative?"#EF4444":"#22C55E"}}>{pv.netPct.text}</div>
          </div>
        </div>
      )}
    </div>
  );
}

function businessDayKey(now = new Date()){
  const ms = now.getTime() - 4*60*60*1000;
  return new Date(ms).toLocaleDateString("en-CA",{timeZone:"Asia/Jerusalem"});
}
function dowForBusinessKey(key){
  const [y,m,d] = key.split("-").map(Number);
  return new Date(Date.UTC(y,m-1,d,9,0,0)).getUTCDay();
}

// ── Builders ────────────────────────────────────────────────────────────────
function buildItemFromStarter(starterItem, ctx){
  const now = Date.now();
  return {
    id: newId("ci"),
    tenantId:    ctx.tenantId,
    businessId:  ctx.businessId,
    branchId:    ctx.branchId,
    checklistType: starterItem.checklistType,
    scheduleType:  starterItem.scheduleType,
    dayOfWeek:     starterItem.dayOfWeek,
    area:          starterItem.area,
    title:         starterItem.title,
    description:   "",
    isRequired:    !!starterItem.isRequired,
    requiresPhoto: !!starterItem.requiresPhoto,
    priority:      starterItem.priority || "medium",
    sortOrder:     0,        // assigned after the fact
    defaultPosition: null,
    active:        true,
    sourceSystemTemplateItemId: starterItem._starterId,
    createdAt: now, updatedAt: now,
    createdBy: ctx.userId, updatedBy: ctx.userId,
    archivedAt: null, archivedBy: null,
  };
}
function buildTemplateFromStarter(starterKey, ctx){
  const starter = STARTER_TEMPLATES[starterKey];
  if (!starter) return null;
  const items = starter.items.map((it,i) => ({
    ...buildItemFromStarter(it, ctx),
    sortOrder: i,
  }));
  return {
    version: "2.0",
    branchId: ctx.branchId,
    sourceStarter: starterKey,
    items,
    updatedAt: Date.now(),
    updatedBy: ctx.userId,
  };
}
function blankTemplate(ctx){
  return {
    version: "2.0",
    branchId: ctx.branchId,
    sourceStarter: null,
    items: [],
    updatedAt: Date.now(),
    updatedBy: ctx.userId,
  };
}

// ── Storage envelope helper (hotfix 2026-05-31) ─────────────────────────────
// window.storage.get returns { key, value, shared } where `value` is the
// JSON string. Unwrap into the actual document object.
async function readChecklistDoc(key) {
  const env = await window.storage.get(key);
  const raw = env && typeof env === "object" && "value" in env ? env.value : env;
  if (raw == null) return null;
  if (typeof raw === "string") {
    try { return JSON.parse(raw); } catch { return null; }
  }
  return raw;
}

// ── Server-mediated access for PARAMETERIZED business keys (checklist_* +
//    analytics/insights). Direct RTDB access is denied by Rules; these go through
//    the authenticated /api/admin dispatcher (auth + tenant + biz_access enforced). ──
async function apiGetChecklistDoc(kind, bizId, params) {
  const q = new URLSearchParams({ tenantId: window._currentTenantId || "", bizId: bizId || "", ...params });
  const resp = await window.apiFetch(`/api/admin?action=get-checklist-${kind}&` + q.toString(), { method: "GET" });
  if (!resp.ok) throw new Error("read_" + resp.status);
  const d = await resp.json().catch(() => ({}));
  return { document: d.document ?? null, versionToken: d.versionToken || null };
}
async function apiSetChecklistDoc(kind, bizId, body) {
  const resp = await window.apiFetch(`/api/admin?action=set-checklist-${kind}`, { method: "POST", body: JSON.stringify({ tenantId: window._currentTenantId, bizId, ...body }) });
  const d = await resp.json().catch(() => ({}));
  if (!resp.ok) { const e = new Error(d.error || ("write_" + resp.status)); e.status = resp.status; e.conflict = (resp.status === 409 && d.error === "checklist_conflict"); throw e; }
  return { document: d.document ?? null, versionToken: d.versionToken || null };
}
async function apiGetDailyRange(kind, bizId, fromDate, toDate, tenantId) {
  // R4: tenant identity may be supplied EXPLICITLY (captured selection ctx). When
  // omitted, falls back to the mutable global (analytics-range view path).
  const q = new URLSearchParams({ tenantId: tenantId != null ? tenantId : (window._currentTenantId || ""), bizId: bizId || "", fromDate, toDate });
  const resp = await window.apiFetch(`/api/admin?action=get-${kind}-daily&` + q.toString(), { method: "GET" });
  if (!resp.ok) throw new Error("read_" + resp.status);
  const d = await resp.json().catch(() => ({}));
  return d.docs || {};
}

// ── Phase 1: version pinning for runs ────────────────────────────────────────
// Build a day-scoped snapshot of the template items relevant to one business
// day (active + daily, or weekly matching that day-of-week), keeping only the
// minimal fields a run needs. Frozen onto a run at creation so later template
// edits never change that run's items or completion %.
function buildDaySnapshotItems(template, weekKey) {
  if (!template || !Array.isArray(template.items)) return [];
  return template.items
    .filter(it => it.active && (it.scheduleType === "daily" || (it.scheduleType === "weekly" && it.dayOfWeek === weekKey)))
    .map(it => ({
      id: it.id,
      checklistType: it.checklistType,
      scheduleType: it.scheduleType,
      dayOfWeek: it.dayOfWeek ?? null,
      area: it.area || "כללי",
      title: it.title,
      description: it.description || "",
      isRequired: !!it.isRequired,
      requiresPhoto: !!it.requiresPhoto,
      priority: it.priority || "medium",
      sortOrder: it.sortOrder ?? 0,
      createdAt: it.createdAt || 0, // preserve the existing sortOrder→createdAt tie-break
      active: true, // snapshot items are pre-filtered to active; stamp explicitly
    }));
}
// Filter a flat item list to one phase + day, sorted. Works uniformly for both
// a frozen snapshot (each item carries active:true) and a live template's items.
// Requires active === true — preserves the live-template behavior exactly and
// never widens the list for items missing/undefined `active`.
function phaseItemsFrom(sourceItems, phaseKey, weekKey) {
  if (!Array.isArray(sourceItems)) return [];
  const eligible = sourceItems.filter(it =>
    it.active === true && it.checklistType === phaseKey &&
    (it.scheduleType === "daily" || (it.scheduleType === "weekly" && it.dayOfWeek === weekKey))
  );
  return [...eligible].sort((a,b) => ((a.sortOrder||0) - (b.sortOrder||0)) || ((a.createdAt||0) - (b.createdAt||0)));
}

function ShiftChecklistScreen({ businessConfig, saveBusinessConfig, bizId, businesses, currentUserName, currentUserUid, canEdit }) {
  const tenantId = window._currentTenantId || "";
  const ctx = { tenantId, businessId: bizId, branchId: bizId, userId: currentUserUid || "" };

  const [template, setTemplate]   = React.useState(null);
  const [loadingTpl, setLoadingTpl] = React.useState(true);

  const [todayKey, setTodayKey] = React.useState(() => businessDayKey());
  const [runs, setRuns]         = React.useState(null);
  const [loadingRuns, setLoadingRuns] = React.useState(true);

  const [editorOpen, setEditorOpen] = React.useState(false);
  const [editItem, setEditItem] = React.useState(null); // {runType, item, statusEdit, noteEdit, photoEdit}

  // ── Step 2.0/2.1: template registry (read-only) + selector ────────────────
  const [templates, setTemplates] = React.useState([SHIFT_TEMPLATE_ENTRY]);
  const [selectedTemplateId, setSelectedTemplateId] = React.useState("shift");
  // ── Step 2.2: create-template modal state ─────────────────────────────────
  const [showCreate, setShowCreate] = React.useState(false);
  const [newName, setNewName] = React.useState("");
  const [newType, setNewType] = React.useState("cleaning");
  // ── Step 2.2b: simple-template items (preview) + items editor ──────────────
  const [simpleItems, setSimpleItems] = React.useState([]);
  const [itemsEditorOpen, setItemsEditorOpen] = React.useState(false);
  // ── Step 2.3: simple daily run (item completion states) ────────────────────
  const [simpleRun, setSimpleRun] = React.useState(null);
  // Optimistic-concurrency version tokens for the server-mediated checklist docs.
  const runsTokenRef = React.useRef(null);
  const itemsTokenRef = React.useRef(null);
  const simpleRunTokenRef = React.useRef(null);

  // ── Part 1: async write-context guards ────────────────────────────────────
  // A stale server response (arriving after the user switched business, tenant,
  // business-date or template) must never mutate the currently rendered editor.
  // ctxRef is refreshed during render, so it always reflects the latest
  // committed context. Per-document-family monotonic generations reject
  // out-of-order writes for the same context (older response ignored).
  const ctxRef = React.useRef(null);
  ctxRef.current = { tenantId, bizId, todayKey, selectedTemplateId };
  const runGenRef = React.useRef(0);
  const simpleRunGenRef = React.useRef(0);
  const itemsGenRef = React.useRef(0);
  const runKey       = (c) => `run|${c.tenantId}|${c.bizId}|${c.todayKey}`;
  const simpleRunKey = (c) => `simplerun|${c.tenantId}|${c.bizId}|${c.todayKey}|${c.selectedTemplateId}`;
  const itemsKey     = (c) => `items|${c.tenantId}|${c.bizId}|${c.selectedTemplateId}`;
  // True only when the captured context key AND generation are still current.
  const stillCurrent = (capKey, keyFn, capGen, genRef) => (capKey === keyFn(ctxRef.current) && capGen === genRef.current);

  const dow     = dowForBusinessKey(todayKey);
  const weekKey = DOW_KEYS[dow];

  // ── Load template (with auto-migration from legacy businessConfig.shiftChecklists) ──
  React.useEffect(() => {
    let cancelled = false;
    setLoadingTpl(true);
    (async () => {
      try {
        if (!bizId) { if (!cancelled){ setTemplate(null); setLoadingTpl(false);} return; }
        const tpl = await readChecklistDoc(`biz:${bizId}:checklist_template`);
        if (tpl && Array.isArray(tpl.items)) {
          if (!cancelled){ setTemplate(tpl); setLoadingTpl(false); } return;
        }
        // No new-shape template yet — try to migrate the old shiftChecklists shape.
        const legacy = businessConfig?.shiftChecklists;
        if (legacy && (legacy.daily || legacy.weekly)) {
          const items = [];
          let order = 0;
          for (const phase of ["opening","handover","closing"]) {
            for (const it of (legacy.daily?.[phase] || [])) {
              items.push({
                id: newId("ci"),
                tenantId, businessId: bizId, branchId: bizId,
                checklistType: phase, scheduleType:"daily", dayOfWeek: null,
                area: "כללי", title: it.label || "פריט ללא שם", description:"",
                isRequired: true, requiresPhoto:false, priority:"medium",
                sortOrder: order++, defaultPosition: null, active: true,
                sourceSystemTemplateItemId: null,
                createdAt: Date.now(), updatedAt: Date.now(),
                createdBy: ctx.userId, updatedBy: ctx.userId,
                archivedAt: null, archivedBy: null,
              });
            }
          }
          for (const k of DOW_KEYS) {
            for (const phase of ["opening","handover","closing"]) {
              for (const it of (legacy.weekly?.[k]?.[phase] || [])) {
                items.push({
                  id: newId("ci"),
                  tenantId, businessId: bizId, branchId: bizId,
                  checklistType: phase, scheduleType:"weekly", dayOfWeek: k,
                  area:"כללי", title: it.label || "פריט ללא שם", description:"",
                  isRequired:true, requiresPhoto:false, priority:"medium",
                  sortOrder: order++, defaultPosition: null, active: true,
                  sourceSystemTemplateItemId: null,
                  createdAt: Date.now(), updatedAt: Date.now(),
                  createdBy: ctx.userId, updatedBy: ctx.userId,
                  archivedAt: null, archivedBy: null,
                });
              }
            }
          }
          const migrated = { version:"2.0", branchId: bizId, sourceStarter: null, items,
            updatedAt: Date.now(), updatedBy: ctx.userId, migratedFromLegacyAt: Date.now() };
          // Part 4: the derived runtime template is usable immediately for EVERY
          // role. Legacy auto-migration PERSISTENCE to the manager-only
          // checklist_template key is attempted only by manager/owner/super_owner
          // (canEdit). shift_manager/viewer never attempt the denied write, and a
          // failed manager persist must NOT blank the already-derived template.
          if (canEdit) {
            try { await window.storage.set(`biz:${bizId}:checklist_template`, JSON.stringify(migrated)); }
            catch (persistErr) { console.warn("[checklist] template migration persist failed (runtime template retained):", persistErr?.message || persistErr); }
          }
          if (!cancelled){ setTemplate(migrated); setLoadingTpl(false); } return;
        }
        if (!cancelled){ setTemplate(blankTemplate(ctx)); setLoadingTpl(false); }
      } catch(e) {
        console.error("[checklist] template load failed:", e);
        if (!cancelled){ setTemplate(blankTemplate(ctx)); setLoadingTpl(false); }
      }
    })();
    return () => { cancelled = true; };
  }, [bizId, businessConfig?.shiftChecklists]);

  // ── Load today's runs ─────────────────────────────────────────────────────
  React.useEffect(() => {
    let cancelled = false;
    setLoadingRuns(true);
    runsTokenRef.current = null; // Part 1: drop prior node's version token on business/date change
    (async () => {
      try {
        if (!bizId) { if (!cancelled){ setRuns(null); setLoadingRuns(false);} return; }
        const { document: doc, versionToken } = await apiGetChecklistDoc("run", bizId, { businessDate: todayKey });
        if (!cancelled){ setRuns(doc || null); runsTokenRef.current = versionToken; setLoadingRuns(false); }
      } catch(e) {
        if (!cancelled){ setRuns(null); setLoadingRuns(false); }
      }
    })();
    return () => { cancelled = true; };
  }, [bizId, todayKey]);

  // ── Step 2.0: load checklist_templates registry (READ-ONLY, no writes) ────
  React.useEffect(() => {
    let cancelled = false;
    setSelectedTemplateId("shift"); // reset to default whenever the business changes
    (async () => {
      try {
        let list = [];
        if (bizId) {
          const reg = await readChecklistDoc(`biz:${bizId}:checklist_templates`);
          if (reg && typeof reg === "object") {
            const raw = Array.isArray(reg) ? reg : Object.values(reg);
            // Drop any registry entry with templateId "shift" so the virtual one is never duplicated.
            // Treat a template missing `active` as active by default (unlike template ITEMS).
            list = raw.filter(t => t && t.templateId && t.templateId !== "shift" && t.active !== false);
          }
        }
        if (!cancelled) setTemplates([SHIFT_TEMPLATE_ENTRY, ...list]); // virtual "shift" always first
      } catch (e) {
        console.error("[checklist] templates registry load failed:", e);
        if (!cancelled) setTemplates([SHIFT_TEMPLATE_ENTRY]); // fallback — never crash
      }
    })();
    return () => { cancelled = true; };
  }, [bizId]);

  // ── Step 2.2b: load the selected simple template's items (READ-ONLY here) ──
  React.useEffect(() => {
    let cancelled = false;
    const st = templates.find(t => t.templateId === selectedTemplateId) || SHIFT_TEMPLATE_ENTRY;
    itemsTokenRef.current = null; // Part 1: invalidate prior template's items token on template/business switch
    if (!bizId || st.kind !== "simple") { setSimpleItems([]); return; }
    (async () => {
      try {
        const { document: doc, versionToken } = await apiGetChecklistDoc("template-items", bizId, { templateId: st.templateId });
        const items = (doc && Array.isArray(doc.items)) ? doc.items : [];
        if (!cancelled) { setSimpleItems(items); itemsTokenRef.current = versionToken; }
      } catch (e) {
        if (!cancelled) setSimpleItems([]); // missing/parse error → safe empty
      }
    })();
    return () => { cancelled = true; };
  }, [bizId, selectedTemplateId, templates]);

  // ── Step 2.3: load the simple daily run for selected template + business day ─
  React.useEffect(() => {
    let cancelled = false;
    const st = templates.find(t => t.templateId === selectedTemplateId) || SHIFT_TEMPLATE_ENTRY;
    if (!bizId || st.kind !== "simple" || !st.templateId) { setSimpleRun(null); return; }
    setSimpleRun(null); simpleRunTokenRef.current = null; // Part 1: clear stale run + token before async read (template/date switch)
    (async () => {
      try {
        const { document: doc, versionToken } = await apiGetChecklistDoc("simple-run", bizId, { businessDate: todayKey, templateId: st.templateId });
        if (!cancelled) { setSimpleRun(doc && typeof doc === "object" ? doc : null); simpleRunTokenRef.current = versionToken; }
      } catch (e) {
        if (!cancelled) setSimpleRun(null); // missing/malformed → no completions yet
      }
    })();
    return () => { cancelled = true; };
  }, [bizId, selectedTemplateId, todayKey, templates]);

  // ── Cross-04:00 boundary refresh ──────────────────────────────────────────
  React.useEffect(() => {
    const t = setInterval(() => {
      const k = businessDayKey();
      if (k !== todayKey) setTodayKey(k);
    }, 60_000);
    return () => clearInterval(t);
  }, [todayKey]);

  // ── Today's items per phase ──────────────────────────────────────────────
  // Snapshot-aware: if the loaded run was created with a frozen
  // templateSnapshotItems, use it (so template edits never change this run).
  // Otherwise fall back to the live template — unchanged behavior for old runs.
  const itemsForPhase = (phaseKey) => {
    const source = (runs && Array.isArray(runs.templateSnapshotItems))
      ? runs.templateSnapshotItems
      : (template ? template.items : []);
    return phaseItemsFrom(source, phaseKey, weekKey);
  };

  // ── Mark item — opens the action sheet ───────────────────────────────────
  const openItemEditor = (runType, item) => {
    const st = runs?.runs?.[runType]?.status;
    if (st === "locked" || st === "submitted") return; // submitted+locked = read-only
    const existing = runs?.runs?.[runType]?.items?.[item.id];
    setEditItem({
      runType, item,
      statusEdit: existing?.status || "pending",
      noteEdit:   existing?.note || "",
      photoEdit:  existing?.photoUrl || "",
    });
  };
  const closeItemEditor = () => setEditItem(null);

  // ── Persist a single item interaction ────────────────────────────────────
  const saveItemEdit = async () => {
    if (!editItem) return;
    const { runType, item, statusEdit, noteEdit, photoEdit } = editItem;
    // Validate
    if ((statusEdit === "not_done" || statusEdit === "issue") && !noteEdit.trim()) {
      alert("נדרשת הערה כאשר הסטטוס הוא 'לא בוצע' או 'תקלה'.");
      return;
    }
    if (item.requiresPhoto && statusEdit === "done" && !photoEdit) {
      alert("הפריט דורש צילום. צרף תמונה לפני סימון 'בוצע'.");
      return;
    }
    const now = Date.now();
    const newRuns = JSON.parse(JSON.stringify(runs || {
      tenantId, businessId: bizId, branchId: bizId,
      businessDate: todayKey, businessDayOfWeek: weekKey,
      // Phase 1: freeze the template version + day-scoped items at run creation.
      templateUpdatedAt: (template && template.updatedAt) || null,
      templateSnapshotItems: buildDaySnapshotItems(template, weekKey),
      runs: {
        opening:  { id: newId("run"), status:"draft", openedByManagerId:"", openedAt:null, submittedAt:null, completionPercent:0, items:{} },
        handover: { id: newId("run"), status:"draft", openedByManagerId:"", openedAt:null, submittedAt:null, completionPercent:0, items:{} },
        closing:  { id: newId("run"), status:"draft", openedByManagerId:"", openedAt:null, submittedAt:null, completionPercent:0, items:{} },
      },
    }));
    const run = newRuns.runs[runType];
    if (run.status === "draft") {
      run.status = "in_progress";
      run.openedByManagerId = ctx.userId;
      run.openedAt = now;
    }
    run.items = run.items || {};
    if (statusEdit === "pending") {
      delete run.items[item.id];
    } else {
      run.items[item.id] = {
        source: item.scheduleType,
        status: statusEdit,
        note: noteEdit,
        photoUrl: photoEdit || null,
        checkedByManagerId: ctx.userId,
        checkedAt: now,
        titleSnapshot:         item.title,
        areaSnapshot:          item.area,
        prioritySnapshot:      item.priority,
        requiresPhotoSnapshot: !!item.requiresPhoto,
      };
    }
    // Recompute completion %
    const todaysItems = itemsForPhase(runType);
    const doneCount = todaysItems.filter(it => run.items[it.id]?.status === "done").length;
    run.completionPercent = todaysItems.length ? Math.round(doneCount * 100 / todaysItems.length) : 0;
    const capKey = runKey(ctxRef.current); const capGen = ++runGenRef.current;
    try {
      const { document, versionToken } = await apiSetChecklistDoc("run", bizId, { businessDate: todayKey, doc: newRuns, expectedVersionToken: runsTokenRef.current });
      if (!stillCurrent(capKey, runKey, capGen, runGenRef)) return; // stale: context switched or newer write superseded
      setRuns(document); runsTokenRef.current = versionToken; closeItemEditor();
    } catch (e) {
      if (!stillCurrent(capKey, runKey, capGen, runGenRef)) return; // stale error — show nothing in the new context
      if (e.conflict) { alert("הנתונים השתנו על ידי משתמש אחר. יש לטעון מחדש לפני שמירה נוספת."); try { const r = await apiGetChecklistDoc("run", bizId, { businessDate: todayKey }); if (!stillCurrent(capKey, runKey, capGen, runGenRef)) return; setRuns(r.document || null); runsTokenRef.current = r.versionToken; } catch (_) {} }
      else alert("שמירה נכשלה — נסה שוב");
    }
  };

  // ── Submit a phase run (locks it) ────────────────────────────────────────
  const submitRun = async (runType) => {
    if (!runs?.runs?.[runType]) return;
    const todayItems = itemsForPhase(runType);
    const run = runs.runs[runType];
    const missingCritical = todayItems.filter(it =>
      it.priority === "critical" && run.items?.[it.id]?.status !== "done"
    );
    if (missingCritical.length > 0) {
      const labels = missingCritical.map(i => `• ${i.title}`).join("\n");
      if (!confirm(`יש ${missingCritical.length} פריטי "קריטי" שלא סומנו כ-'בוצע':\n\n${labels}\n\nלשלוח את הצ׳ק ליסט בכל זאת?`)) return;
    }
    const requiredMissing = todayItems.filter(it =>
      it.isRequired && (!run.items?.[it.id] || run.items[it.id].status === "pending")
    );
    if (requiredMissing.length > 0) {
      if (!confirm(`${requiredMissing.length} פריטים נדרשים לא סומנו כלל. לשלוח בכל זאת?`)) return;
    }
    const now = Date.now();
    const newRuns = JSON.parse(JSON.stringify(runs));
    newRuns.runs[runType].status = "submitted";
    newRuns.runs[runType].submittedAt = now;
    newRuns.runs[runType].submittedBy = ctx.userId;
    const capKey = runKey(ctxRef.current); const capGen = ++runGenRef.current;
    try {
      const { document, versionToken } = await apiSetChecklistDoc("run", bizId, { businessDate: todayKey, doc: newRuns, expectedVersionToken: runsTokenRef.current });
      if (!stillCurrent(capKey, runKey, capGen, runGenRef)) return; // stale: context switched or newer write superseded
      setRuns(document); runsTokenRef.current = versionToken;
    } catch (e) {
      if (!stillCurrent(capKey, runKey, capGen, runGenRef)) return; // stale error — show nothing in the new context
      if (e.conflict) { alert("הנתונים השתנו על ידי משתמש אחר. יש לטעון מחדש לפני שמירה נוספת."); try { const r = await apiGetChecklistDoc("run", bizId, { businessDate: todayKey }); if (!stillCurrent(capKey, runKey, capGen, runGenRef)) return; setRuns(r.document || null); runsTokenRef.current = r.versionToken; } catch (_) {} }
      else alert("שמירה נכשלה — נסה שוב");
    }
  };

  // ── Step 2.2: read current registry map (safe: missing key → {}) ──────────
  const readRegistryMap = async () => {
    let reg = null;
    try { reg = await readChecklistDoc(`biz:${bizId}:checklist_templates`); } catch (_) { reg = null; }
    return (reg && typeof reg === "object" && !Array.isArray(reg)) ? { ...reg } : {};
  };

  // ── Step 2.2: create a new "simple" template shell (name + type only) ─────
  const createSimpleTemplate = async () => {
    const name = (newName || "").trim();
    if (!name) { alert("יש להזין שם לצ׳ק ליסט."); return; }
    if (!SIMPLE_TYPE_LABELS[newType]) { alert("יש לבחור סוג חוקי."); return; }
    if (!bizId) return;
    const templateId = newId("tpl"); // never "shift"
    const now = Date.now();
    const entry = {
      id: templateId, templateId, name, type: newType, kind: "simple",
      active: true, currentVersion: 1, itemsCount: 0,
      createdBy: ctx.userId, createdAt: now, updatedBy: ctx.userId, updatedAt: now,
    };
    const capBizKey = `${ctxRef.current.tenantId}|${ctxRef.current.bizId}`; const capGen = ++itemsGenRef.current;
    try {
      // Write the items doc FIRST. If the registry write below fails, this stays
      // an orphan items doc (invisible — no chip), which is safer than a visible
      // chip pointing at a missing items doc.
      const { versionToken: itCreateToken } = await apiGetChecklistDoc("template-items", bizId, { templateId });
      await apiSetChecklistDoc("template-items", bizId, { templateId, expectedVersionToken: itCreateToken, doc: { templateId, currentVersion: 1, items: [], updatedAt: now, updatedBy: ctx.userId } });
      // Only after the items doc exists, make the template visible in the registry.
      const map = await readRegistryMap();
      map[templateId] = entry;
      await window.storage.set(`biz:${bizId}:checklist_templates`, JSON.stringify(map));
      if (`${ctxRef.current.tenantId}|${ctxRef.current.bizId}` !== capBizKey || capGen !== itemsGenRef.current) return; // stale: business/tenant switched during creation
      setTemplates(prev => [...prev, entry]);
      setSelectedTemplateId(templateId);
      setShowCreate(false); setNewName(""); setNewType("cleaning");
    } catch (e) {
      if (`${ctxRef.current.tenantId}|${ctxRef.current.bizId}` !== capBizKey || capGen !== itemsGenRef.current) return; // stale failure — no alert/error/log in the new context
      console.error("[checklist] create template failed:", e);
      alert("יצירת הצ׳ק ליסט נכשלה — נסה שוב.");
    }
  };

  // ── Step 2.2: disable (hide) a simple template — never deletes items doc ──
  const disableTemplate = async (templateId) => {
    if (!templateId || templateId === "shift" || !bizId) return; // shift can never be disabled
    if (!confirm("לכבות את הצ׳ק ליסט? הוא יוסתר מהרשימה (הנתונים נשמרים).")) return;
    try {
      const map = await readRegistryMap();
      if (map[templateId]) {
        map[templateId] = { ...map[templateId], active: false, updatedBy: ctx.userId, updatedAt: Date.now() };
        await window.storage.set(`biz:${bizId}:checklist_templates`, JSON.stringify(map));
      }
      setTemplates(prev => prev.filter(t => t.templateId !== templateId));
      setSelectedTemplateId(prev => prev === templateId ? "shift" : prev);
    } catch (e) {
      console.error("[checklist] disable template failed:", e);
      alert("כיבוי הצ׳ק ליסט נכשל — נסה שוב.");
    }
  };

  // ── Step 2.2b: persist the simple template's items + sync registry itemsCount.
  // Writes ONLY checklist_template_items:{templateId} and the registry map.
  // currentVersion is preserved (NOT bumped). Never touches shift paths.
  const saveSimpleItems = async (nextItems) => {
    const st = templates.find(t => t.templateId === selectedTemplateId) || SHIFT_TEMPLATE_ENTRY;
    if (!bizId || st.kind !== "simple" || !st.templateId) return;
    const tplId = st.templateId;
    const now = Date.now();
    const capKey = itemsKey(ctxRef.current); const capGen = ++itemsGenRef.current;
    try {
      // preserve currentVersion from the existing items doc (fallback 1 if missing)
      let doc = null, itToken = null;
      try { const r = await apiGetChecklistDoc("template-items", bizId, { templateId: tplId }); doc = r.document; itToken = r.versionToken; } catch (_) { doc = null; itToken = null; }
      const currentVersion = (doc && doc.currentVersion) || 1;
      const setR = await apiSetChecklistDoc("template-items", bizId, { templateId: tplId, expectedVersionToken: itToken, doc: { templateId: tplId, currentVersion, items: nextItems, updatedAt: now, updatedBy: ctx.userId } });
      if (!stillCurrent(capKey, itemsKey, capGen, itemsGenRef)) return; // stale after items write — no token/registry/UI setter
      itemsTokenRef.current = setR.versionToken;
      // registry: itemsCount = active items only; bump updatedAt/By; keep currentVersion.
      // The server writes (items + registry) may complete after a context switch;
      // we NEVER roll those back — we only refuse to mutate UI state for a context
      // the user is no longer viewing. Re-verify current context+generation after
      // EVERY await and before EVERY setter (setTemplates was previously unguarded).
      const map = await readRegistryMap();
      if (!stillCurrent(capKey, itemsKey, capGen, itemsGenRef)) return; // stale after registry read
      if (map[tplId]) {
        const activeCount = nextItems.filter(i => i.active !== false).length;
        map[tplId] = { ...map[tplId], itemsCount: activeCount, updatedBy: ctx.userId, updatedAt: now };
        await window.storage.set(`biz:${bizId}:checklist_templates`, JSON.stringify(map));
        if (!stillCurrent(capKey, itemsKey, capGen, itemsGenRef)) return; // stale after registry write — do NOT touch registry UI state
        setTemplates(prev => prev.map(t => t.templateId === tplId ? { ...t, itemsCount: activeCount } : t));
      }
      if (!stillCurrent(capKey, itemsKey, capGen, itemsGenRef)) return; // stale — no items/editor setter
      setSimpleItems(nextItems);
      setItemsEditorOpen(false);
    } catch (e) {
      if (!stillCurrent(capKey, itemsKey, capGen, itemsGenRef)) return; // stale failure — no alert/error/log in the new context
      console.error("[checklist] save simple items failed:", e);
      alert(e && e.conflict ? "הנתונים השתנו על ידי משתמש אחר. יש לטעון מחדש לפני שמירה נוספת." : "שמירת הפריטים נכשלה — נסה שוב.");
    }
  };

  // ── Step 2.3: toggle one item's completion in the simple daily run.
  // Lazily creates the run doc on first change. Writes ONLY the namespaced
  // checklist_simple_runs path. Never touches shift / template / items docs.
  const toggleSimpleItem = async (itemId) => {
    const st = templates.find(t => t.templateId === selectedTemplateId) || SHIFT_TEMPLATE_ENTRY;
    if (!bizId || st.kind !== "simple" || !st.templateId) return;
    const tplId = st.templateId;
    const now = Date.now();
    const prevRun = simpleRun; // for rollback if the write fails
    const base = simpleRun || {
      templateId: tplId, businessDate: todayKey, kind: "simple",
      currentVersion: (st.currentVersion || 1), itemStates: {}, createdAt: now, updatedAt: now, updatedBy: ctx.userId,
    };
    const prevDone = !!(base.itemStates && base.itemStates[itemId] && base.itemStates[itemId].done);
    const next = {
      ...base,
      itemStates: { ...(base.itemStates || {}), [itemId]: { done: !prevDone, updatedAt: now, updatedBy: ctx.userId } },
      updatedAt: now, updatedBy: ctx.userId,
    };
    const capKey = simpleRunKey(ctxRef.current); const capGen = ++simpleRunGenRef.current;
    try {
      const { document, versionToken } = await apiSetChecklistDoc("simple-run", bizId, { businessDate: todayKey, templateId: tplId, doc: next, expectedVersionToken: simpleRunTokenRef.current });
      if (!stillCurrent(capKey, simpleRunKey, capGen, simpleRunGenRef)) return; // stale: context switched or newer write superseded
      setSimpleRun(document); simpleRunTokenRef.current = versionToken;
    } catch (e) {
      console.error("[checklist] save simple run failed:", e);
      if (!stillCurrent(capKey, simpleRunKey, capGen, simpleRunGenRef)) return; // stale response — no message/rollback in the new context
      if (e.conflict) { alert("הנתונים השתנו על ידי משתמש אחר. יש לטעון מחדש לפני שמירה נוספת."); try { const r = await apiGetChecklistDoc("simple-run", bizId, { businessDate: todayKey, templateId: tplId }); if (!stillCurrent(capKey, simpleRunKey, capGen, simpleRunGenRef)) return; setSimpleRun(r.document || null); simpleRunTokenRef.current = r.versionToken; } catch (_) { if (stillCurrent(capKey, simpleRunKey, capGen, simpleRunGenRef)) setSimpleRun(prevRun || null); } }
      else { setSimpleRun(prevRun || null); alert("שמירת הסימון נכשלה — נסה שוב."); }
    }
  };

  if (!bizId) {
    return <div className="card card-p"><p style={{margin:0,fontSize:13,color:"#6B7280"}}>בחר עסק כדי לראות את הצ׳ק ליסט.</p></div>;
  }

  // ── Render ───────────────────────────────────────────────────────────────
  const todayLabel = new Date(todayKey + "T12:00:00").toLocaleDateString("he-IL",{timeZone:"Asia/Jerusalem"});
  const selectedTemplate = templates.find(t => t.templateId === selectedTemplateId) || SHIFT_TEMPLATE_ENTRY;

  return (
    <div>
      <div className="card card-p" style={{marginBottom:12}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,flexWrap:"wrap"}}>
          <div>
            <h2 style={{margin:0,fontSize:14,fontWeight:700,color:"#111827"}}>צ׳ק ליסט משמרת</h2>
            <p style={{margin:"2px 0 0",fontSize:11,color:"#9CA3AF"}}>
              {DOW_HE_FULL[dow]} · {todayLabel} · יום עסקי 04:00→04:00
            </p>
          </div>
          {canEdit && (
            <button onClick={() => setEditorOpen(true)}
              style={{padding:"8px 14px",background:"#F9FAFB",border:"1px solid #E5E7EB",borderRadius:10,color:"#6B7280",fontWeight:600,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>
              ערוך תבנית
            </button>
          )}
        </div>
        {template?.sourceStarter && (
          <p style={{margin:"6px 0 0",fontSize:10,color:"#9CA3AF"}}>
            תבנית מקור: {STARTER_TEMPLATES[template.sourceStarter]?.label || template.sourceStarter}
          </p>
        )}
      </div>

      {/* Step 2.1: template selector chips — currently the single virtual "shift" entry.
          Horizontal scroll, no wrap, so one chip never breaks mobile layout. */}
      <div style={{display:"flex",gap:8,overflowX:"auto",whiteSpace:"nowrap",WebkitOverflowScrolling:"touch",paddingBottom:4,marginBottom:12}}>
        {templates.map(t => {
          const sel = t.templateId === selectedTemplateId;
          return (
            <button key={t.templateId} onClick={() => setSelectedTemplateId(t.templateId)}
              style={{flex:"0 0 auto",padding:"7px 16px",borderRadius:99,border:`1.5px solid ${sel?"#111827":"#E5E7EB"}`,background:sel?"#111827":"#FFFFFF",color:sel?"#FFFFFF":"#6B7280",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
              {t.name}
            </button>
          );
        })}
        {canEdit && (
          <button key="__add" onClick={() => setShowCreate(true)}
            style={{flex:"0 0 auto",padding:"7px 16px",borderRadius:99,border:"1.5px dashed #D1D5DB",background:"#FFFFFF",color:"#6B7280",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
            + צ׳ק ליסט
          </button>
        )}
      </div>

      {selectedTemplate.kind === "shift" ? (
        loadingTpl || loadingRuns ? (
        <div className="card card-p"><p style={{margin:0,fontSize:12,color:"#9CA3AF"}}>טוען…</p></div>
      ) : !template || template.items.length === 0 ? (
        <div className="card card-p">
          <p style={{margin:0,fontSize:13,color:"#6B7280",lineHeight:1.6}}>
            אין עדיין צ׳ק ליסט לסניף הזה.
            {canEdit ? <><br/>פתח את העורך וצור פריטים, או אתחל מתבנית מוכנה.</> : <><br/>פנה למנהל כדי שיתחיל את התבנית.</>}
          </p>
        </div>
      ) : PHASE_META.map(({key, emoji, label, color}) => {
        const items = itemsForPhase(key);
        const run = runs?.runs?.[key] || { status:"draft", items:{}, completionPercent: 0 };
        const doneCount = items.filter(it => run.items?.[it.id]?.status === "done").length;
        const total = items.length;
        const pct = total ? Math.round(doneCount*100/total) : 0;
        const isLocked = run.status === "locked";
        const isSubmitted = run.status === "submitted";
        const groups = items.reduce((m,it) => { (m[it.area || "כללי"] = m[it.area || "כללי"] || []).push(it); return m; }, {});

        return (
          <div key={key} className="card card-p" style={{marginBottom:12}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,flexWrap:"wrap",gap:6}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:18}}>{emoji}</span>
                <h3 style={{margin:0,fontSize:13,fontWeight:700,color:"#111827"}}>{label}</h3>
                <span style={{fontSize:11,color:"#9CA3AF"}}>· {doneCount}/{total}</span>
                {isSubmitted && <span style={{fontSize:10,fontWeight:700,color:"#15803D",padding:"2px 8px",background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:99}}>נשלח</span>}
                {isLocked && <span style={{fontSize:10,fontWeight:700,color:"#6B7280",padding:"2px 8px",background:"#F3F4F6",border:"1px solid #E5E7EB",borderRadius:99}}>נעול</span>}
              </div>
              {total > 0 && (
                <div style={{flex:"0 0 80px",height:6,background:"#F3F4F6",borderRadius:99,overflow:"hidden"}}>
                  <div style={{width:`${pct}%`,height:"100%",background:color,transition:"width .2s"}}/>
                </div>
              )}
            </div>

            {total === 0 ? (
              <div style={{padding:"14px",textAlign:"center",color:"#9CA3AF",fontSize:12}}>אין משימות בשלב הזה היום.</div>
            ) : (
              Object.entries(groups).map(([area, areaItems]) => (
                <div key={area} style={{marginBottom:10}}>
                  <div style={{fontSize:10,fontWeight:700,color:"#9CA3AF",textTransform:"uppercase",letterSpacing:0.5,padding:"4px 4px 6px"}}>{area}</div>
                  {areaItems.map(it => {
                    const cur = run.items?.[it.id];
                    const sm = ITEM_STATUS_META[cur?.status || "pending"];
                    return (
                      <div key={it.id}
                        onClick={() => openItemEditor(key, it)}
                        style={{
                          display:"flex",alignItems:"flex-start",gap:10,
                          padding:"10px 12px",marginBottom:6,
                          background: sm.bg, border:`1px solid ${sm.border}`, borderRadius:8,
                          cursor: (isLocked || isSubmitted) ? "default" : "pointer", userSelect:"none",
                          opacity: (isLocked || isSubmitted) ? 0.85 : 1,
                        }}>
                        <div style={{
                          width:22, height:22, borderRadius:5, flexShrink:0,
                          border:`2px solid ${cur?.status === "done" ? "#16A34A" : "#D1D5DB"}`,
                          background: cur?.status === "done" ? "#16A34A" : sm.bg,
                          display:"flex",alignItems:"center",justifyContent:"center",
                          color:"#FFFFFF",fontSize:13,fontWeight:700,marginTop:1,
                        }}>{cur?.status === "done" ? "✓" : sm.icon}</div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:13,fontWeight:600,color:sm.fg,lineHeight:1.4,
                            textDecoration: cur?.status === "done" || cur?.status === "not_relevant" ? "line-through" : "none"}}>
                            {it.title}
                            {it.scheduleType === "weekly" && (
                              <span style={{marginInlineStart:8,padding:"1px 7px",background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:99,color:"#1D4ED8",fontSize:9,fontWeight:700,letterSpacing:0.3,verticalAlign:"middle"}}>שבועי · {DOW_HE_FULL[dow]}</span>
                            )}
                            {it.requiresPhoto && (
                              <span style={{marginInlineStart:6,fontSize:11,color:"#6B7280"}}>📷</span>
                            )}
                            {it.priority === "critical" && (
                              <span style={{marginInlineStart:6,fontSize:10,fontWeight:700,color:"#DC2626"}}>קריטי</span>
                            )}
                          </div>
                          {it.description && (
                            <div style={{fontSize:11,color:"#9CA3AF",marginTop:2,lineHeight:1.4}}>{it.description}</div>
                          )}
                          {cur && cur.status !== "pending" && (
                            <div style={{fontSize:10,color:"#6B7280",marginTop:3,lineHeight:1.4}}>
                              {ITEM_STATUS_META[cur.status].label} · {new Date(cur.checkedAt).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Jerusalem"})}
                              {cur.note ? ` · "${cur.note}"` : ""}
                              {cur.photoUrl ? " · 📷" : ""}
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              ))
            )}

            {total > 0 && !isSubmitted && !isLocked && (
              <div style={{display:"flex",justifyContent:"flex-end",marginTop:6}}>
                <button onClick={() => submitRun(key)}
                  style={{padding:"8px 18px",background:color,border:"none",borderRadius:8,color:"#FFFFFF",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                  שלח {label}
                </button>
              </div>
            )}
          </div>
        );
      })
      ) : (
        <div className="card card-p">
          {(() => {
            // Step 2.3: real daily runtime for a simple checklist (isolated from shift).
            const activeItems = simpleItems.filter(i => i.active !== false)
              .sort((a,b)=>((a.sortOrder||0)-(b.sortOrder||0))||((a.createdAt||0)-(b.createdAt||0)));
            const states = (simpleRun && simpleRun.itemStates) || {};
            const isDone = (id) => !!(states[id] && states[id].done);
            const total = activeItems.length;
            const doneCount = activeItems.filter(it => isDone(it.id)).length;
            const reqItems = activeItems.filter(it => it.isRequired !== false);
            const reqDone = reqItems.filter(it => isDone(it.id)).length;
            const allDone = total > 0 && doneCount === total;
            const allReqDone = reqItems.length > 0 && reqDone === reqItems.length;
            const pct = total ? Math.round(doneCount*100/total) : 0;
            return (<>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,flexWrap:"wrap",marginBottom:10}}>
                <div>
                  <h3 style={{margin:0,fontSize:14,fontWeight:700,color:"#111827"}}>{selectedTemplate.name}</h3>
                  {total>0 && <p style={{margin:"2px 0 0",fontSize:11,color:"#9CA3AF"}}>{doneCount}/{total} הושלמו{reqItems.length?` · חובה ${reqDone}/${reqItems.length}`:""}</p>}
                </div>
                {canEdit && (
                  <button onClick={() => setItemsEditorOpen(true)}
                    style={{padding:"7px 14px",background:"#F9FAFB",border:"1px solid #E5E7EB",borderRadius:8,color:"#6B7280",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>ערוך פריטים</button>
                )}
              </div>
              {total>0 && (
                <div style={{height:6,background:"#F3F4F6",borderRadius:99,overflow:"hidden",marginBottom:12}}>
                  <div style={{width:`${pct}%`,height:"100%",background:allDone?"#16A34A":"#6366F1",transition:"width .2s"}}/>
                </div>
              )}
              {total === 0 ? (
                <p style={{margin:0,fontSize:13,color:"#9CA3AF",lineHeight:1.6}}>
                  עדיין אין פריטים בצ׳ק ליסט הזה.{canEdit ? " לחץ \"ערוך פריטים\" כדי להוסיף." : " פנה למנהל כדי שיוסיף פריטים."}
                </p>
              ) : (
                <div>
                  {activeItems.map(it => {
                    const done = isDone(it.id);
                    return (
                      <div key={it.id} onClick={() => toggleSimpleItem(it.id)}
                        style={{display:"flex",alignItems:"flex-start",gap:10,padding:"10px 12px",marginBottom:6,background:done?"#F0FDF4":"#F9FAFB",border:`1px solid ${done?"#BBF7D0":"#E5E7EB"}`,borderRadius:8,cursor:"pointer",userSelect:"none"}}>
                        <div style={{width:22,height:22,borderRadius:5,flexShrink:0,border:`2px solid ${done?"#16A34A":"#D1D5DB"}`,background:done?"#16A34A":"#FFFFFF",display:"flex",alignItems:"center",justifyContent:"center",color:"#FFFFFF",fontSize:13,fontWeight:700,marginTop:1}}>{done?"✓":""}</div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:13,fontWeight:600,color:done?"#15803D":"#111827",textDecoration:done?"line-through":"none"}}>
                            {it.title}
                            {it.requiresPhoto && <span style={{marginInlineStart:6,fontSize:11}}>📷</span>}
                            {it.isRequired !== false && <span style={{marginInlineStart:6,fontSize:10,color:"#6B7280"}}>· נדרש</span>}
                            {it.priority==="critical" && <span style={{marginInlineStart:6,fontSize:10,fontWeight:700,color:"#DC2626"}}>קריטי</span>}
                          </div>
                          {it.description && <div style={{fontSize:11,color:"#9CA3AF",marginTop:2,lineHeight:1.4}}>{it.description}</div>}
                        </div>
                        <span style={{fontSize:10,color:"#9CA3AF",flexShrink:0,marginTop:2}}>{it.area || "כללי"}</span>
                      </div>
                    );
                  })}
                  <div style={{marginTop:10,padding:"10px 12px",background:allDone?"#F0FDF4":"#F8FAFC",border:`1px solid ${allDone?"#BBF7D0":"#E5E7EB"}`,borderRadius:8,fontSize:12,color:"#374151"}}>
                    <div style={{fontWeight:600}}>{allDone ? "✓ כל הפריטים הושלמו" : `נותרו ${total-doneCount} פריטים`}</div>
                    {reqItems.length>0 && <div style={{marginTop:2,color:allReqDone?"#15803D":"#92400E"}}>{allReqDone ? "כל פריטי החובה הושלמו" : `חובה: ${reqDone}/${reqItems.length}`}</div>}
                    {simpleRun && simpleRun.updatedAt && (
                      <div style={{marginTop:4,fontSize:10,color:"#9CA3AF"}}>עודכן: {new Date(simpleRun.updatedAt).toLocaleString("he-IL",{timeZone:"Asia/Jerusalem",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}{simpleRun.updatedBy ? ` · ${simpleRun.updatedBy}` : ""}</div>
                    )}
                  </div>
                </div>
              )}
              {canEdit && (
                <button onClick={() => disableTemplate(selectedTemplate.templateId)}
                  style={{marginTop:12,padding:"8px 14px",background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:8,color:"#991B1B",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                  כבה צ׳ק ליסט
                </button>
              )}
            </>);
          })()}
        </div>
      )}

      {editItem && (
        <ItemActionSheet
          editItem={editItem}
          setEditItem={setEditItem}
          onClose={closeItemEditor}
          onSave={saveItemEdit}
        />
      )}

      {editorOpen && canEdit && (
        <ShiftChecklistEditor
          template={template}
          ctx={ctx}
          businesses={businesses}
          onClose={() => setEditorOpen(false)}
          onSave={async (next) => {
            const ts = Date.now();
            const stamped = { ...next, updatedAt: ts, updatedBy: ctx.userId };
            setTemplate(stamped);
            await window.storage.set(`biz:${bizId}:checklist_template`, JSON.stringify(stamped));
            setEditorOpen(false);
          }}
        />
      )}

      {/* Step 2.2: create-template modal (name + type only) */}
      {showCreate && canEdit && (
        <div onClick={() => setShowCreate(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:9999}}>
          <div onClick={e => e.stopPropagation()} style={{background:"#FFFFFF",borderRadius:"16px 16px 0 0",padding:18,width:"100%",maxWidth:560}}>
            <h3 style={{margin:"0 0 12px",fontSize:14,fontWeight:700,color:"#111827"}}>צ׳ק ליסט חדש</h3>
            <div style={{fontSize:11,fontWeight:700,color:"#6B7280",marginBottom:6}}>שם</div>
            <input value={newName} onChange={e => setNewName(e.target.value)} placeholder="לדוגמה: ניקיון יומי"
              style={{width:"100%",padding:"9px 11px",border:"1px solid #E5E7EB",borderRadius:8,fontSize:13,fontFamily:"inherit",marginBottom:14,boxSizing:"border-box"}}/>
            <div style={{fontSize:11,fontWeight:700,color:"#6B7280",marginBottom:6}}>סוג</div>
            <select value={newType} onChange={e => setNewType(e.target.value)}
              style={{width:"100%",padding:"9px 11px",border:"1px solid #E5E7EB",borderRadius:8,fontSize:13,fontFamily:"inherit",background:"#F9FAFB",marginBottom:16,boxSizing:"border-box"}}>
              {Object.entries(SIMPLE_TYPE_LABELS).map(([v,l]) => <option key={v} value={v}>{l}</option>)}
            </select>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
              <button onClick={() => setShowCreate(false)} style={{padding:"9px 18px",background:"#F9FAFB",border:"1px solid #E5E7EB",borderRadius:8,color:"#6B7280",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>ביטול</button>
              <button onClick={createSimpleTemplate} style={{padding:"9px 18px",background:"#111827",border:"none",borderRadius:8,color:"#FFFFFF",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>צור</button>
            </div>
          </div>
        </div>
      )}

      {/* Step 2.2b: simple-template items editor (no runtime — definition only) */}
      {itemsEditorOpen && canEdit && selectedTemplate.kind === "simple" && (
        <SimpleItemsEditor
          initialItems={simpleItems}
          onClose={() => setItemsEditorOpen(false)}
          onSave={saveSimpleItems}
        />
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
// Step 2.2b: minimal editor for a SIMPLE template's items (flat, daily-only).
// No runtime here: no checkboxes, no statuses, no submit, no run docs.
// Shows only active items; inactive items are preserved untouched on save.
// ═══════════════════════════════════════════════════════════════════════════
function SimpleItemsEditor({ initialItems, onClose, onSave }){
  const [draft, setDraft] = React.useState(() => JSON.parse(JSON.stringify(initialItems || [])));
  const [editing, setEditing] = React.useState(null); // null | "new" | itemId
  const [f, setF] = React.useState({ title:"", area:"כללי", description:"", isRequired:true, requiresPhoto:false, priority:"medium" });

  const PRIORITIES = ["low","medium","high","critical"];
  const PR_LABEL = { low:"נמוך", medium:"רגיל", high:"גבוה", critical:"קריטי" };
  const active = draft.filter(i => i.active !== false)
    .sort((a,b)=>((a.sortOrder||0)-(b.sortOrder||0))||((a.createdAt||0)-(b.createdAt||0)));

  const openNew  = () => { setF({ title:"", area:"כללי", description:"", isRequired:true, requiresPhoto:false, priority:"medium" }); setEditing("new"); };
  const openEdit = (it) => { setF({ title:it.title||"", area:it.area||"כללי", description:it.description||"", isRequired:it.isRequired!==false, requiresPhoto:!!it.requiresPhoto, priority:PRIORITIES.includes(it.priority)?it.priority:"medium" }); setEditing(it.id); };

  const saveItemForm = () => {
    const title = (f.title||"").trim();
    if (!title) { alert("יש להזין כותרת לפריט."); return; }
    const priority = PRIORITIES.includes(f.priority) ? f.priority : "medium";
    const area = (f.area||"").trim() || "כללי";
    const description = (f.description||"").trim();
    const now = Date.now();
    if (editing === "new") {
      const maxSort = draft.reduce((m,i)=>Math.max(m, i.sortOrder||0), 0);
      const item = { id:newId("ci"), area, title, description, isRequired:!!f.isRequired, requiresPhoto:!!f.requiresPhoto,
        priority, sortOrder:maxSort+1, active:true, createdAt:now, updatedAt:now, scheduleType:"daily", dayOfWeek:null };
      setDraft(prev => [...prev, item]);
    } else {
      setDraft(prev => prev.map(i => i.id===editing ? { ...i, area, title, description, isRequired:!!f.isRequired, requiresPhoto:!!f.requiresPhoto, priority, updatedAt:now } : i));
    }
    setEditing(null);
  };

  const disableItem = (id) => setDraft(prev => prev.map(i => i.id===id ? { ...i, active:false, updatedAt:Date.now() } : i));
  const moveItem = (id, dir) => {
    const idx = active.findIndex(i=>i.id===id); const j = idx+dir;
    if (idx < 0 || j < 0 || j >= active.length) return;
    const a = active[idx], b = active[j]; const sa = a.sortOrder||0, sb = b.sortOrder||0;
    setDraft(prev => prev.map(i => i.id===a.id ? {...i,sortOrder:sb,updatedAt:Date.now()} : i.id===b.id ? {...i,sortOrder:sa,updatedAt:Date.now()} : i));
  };

  const setField = (k,v) => setF(prev => ({...prev,[k]:v}));

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:9999}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#FFFFFF",borderRadius:"16px 16px 0 0",padding:18,width:"100%",maxWidth:560,maxHeight:"88vh",overflowY:"auto"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <h3 style={{margin:0,fontSize:14,fontWeight:700,color:"#111827"}}>{editing ? (editing==="new"?"פריט חדש":"עריכת פריט") : "עריכת פריטים"}</h3>
          <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:18,color:"#9CA3AF"}}>✕</button>
        </div>

        {editing ? (
          <div>
            <div style={{fontSize:11,fontWeight:700,color:"#6B7280",marginBottom:6}}>כותרת</div>
            <input value={f.title} onChange={e=>setField("title",e.target.value)} placeholder="לדוגמה: ניקוי משטחי עבודה"
              style={{width:"100%",padding:"9px 11px",border:"1px solid #E5E7EB",borderRadius:8,fontSize:13,fontFamily:"inherit",marginBottom:12,boxSizing:"border-box"}}/>
            <div style={{fontSize:11,fontWeight:700,color:"#6B7280",marginBottom:6}}>אזור</div>
            <input value={f.area} onChange={e=>setField("area",e.target.value)} placeholder="כללי"
              style={{width:"100%",padding:"9px 11px",border:"1px solid #E5E7EB",borderRadius:8,fontSize:13,fontFamily:"inherit",marginBottom:12,boxSizing:"border-box"}}/>
            <div style={{fontSize:11,fontWeight:700,color:"#6B7280",marginBottom:6}}>תיאור (אופציונלי)</div>
            <textarea value={f.description} onChange={e=>setField("description",e.target.value)}
              style={{width:"100%",minHeight:50,padding:"8px 11px",border:"1px solid #E5E7EB",borderRadius:8,fontSize:12,fontFamily:"inherit",resize:"vertical",marginBottom:12,boxSizing:"border-box"}}/>
            <div style={{fontSize:11,fontWeight:700,color:"#6B7280",marginBottom:6}}>עדיפות</div>
            <select value={f.priority} onChange={e=>setField("priority",e.target.value)}
              style={{width:"100%",padding:"9px 11px",border:"1px solid #E5E7EB",borderRadius:8,fontSize:13,fontFamily:"inherit",background:"#F9FAFB",marginBottom:12,boxSizing:"border-box"}}>
              {PRIORITIES.map(p => <option key={p} value={p}>{PR_LABEL[p]}</option>)}
            </select>
            <div style={{display:"flex",gap:16,marginBottom:16}}>
              <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"#374151",cursor:"pointer"}}>
                <input type="checkbox" checked={f.isRequired} onChange={e=>setField("isRequired",e.target.checked)}/> נדרש
              </label>
              <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"#374151",cursor:"pointer"}}>
                <input type="checkbox" checked={f.requiresPhoto} onChange={e=>setField("requiresPhoto",e.target.checked)}/> דורש צילום
              </label>
            </div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
              <button onClick={()=>setEditing(null)} style={{padding:"9px 18px",background:"#F9FAFB",border:"1px solid #E5E7EB",borderRadius:8,color:"#6B7280",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>ביטול</button>
              <button onClick={saveItemForm} style={{padding:"9px 18px",background:"#111827",border:"none",borderRadius:8,color:"#FFFFFF",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{editing==="new"?"הוסף":"שמור פריט"}</button>
            </div>
          </div>
        ) : (
          <div>
            {active.length===0 && <p style={{margin:"0 0 12px",fontSize:13,color:"#9CA3AF"}}>אין עדיין פריטים. הוסף את הראשון.</p>}
            {active.map((it, idx) => (
              <div key={it.id} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 10px",marginBottom:6,background:"#F9FAFB",border:"1px solid #E5E7EB",borderRadius:8}}>
                <div style={{display:"flex",flexDirection:"column",gap:2,flexShrink:0}}>
                  <button onClick={()=>moveItem(it.id,-1)} disabled={idx===0} title="העלה" style={{background:"none",border:"1px solid #E5E7EB",borderRadius:4,color:idx===0?"#D1D5DB":"#6B7280",cursor:idx===0?"default":"pointer",fontSize:9,lineHeight:1,padding:"2px 5px",fontFamily:"inherit"}}>▲</button>
                  <button onClick={()=>moveItem(it.id,1)} disabled={idx===active.length-1} title="הורד" style={{background:"none",border:"1px solid #E5E7EB",borderRadius:4,color:idx===active.length-1?"#D1D5DB":"#6B7280",cursor:idx===active.length-1?"default":"pointer",fontSize:9,lineHeight:1,padding:"2px 5px",fontFamily:"inherit"}}>▼</button>
                </div>
                <div style={{flex:1,minWidth:0}} onClick={()=>openEdit(it)}>
                  <div style={{fontSize:13,fontWeight:600,color:"#111827",cursor:"pointer"}}>{it.title}{it.requiresPhoto&&<span style={{marginInlineStart:5,fontSize:11}}>📷</span>}{it.priority==="critical"&&<span style={{marginInlineStart:5,fontSize:10,fontWeight:700,color:"#DC2626"}}>קריטי</span>}</div>
                  <div style={{fontSize:10,color:"#9CA3AF",marginTop:1}}>{it.area||"כללי"}{it.isRequired?" · נדרש":""}</div>
                </div>
                <button onClick={()=>openEdit(it)} title="ערוך" style={{background:"none",border:"1px solid #E5E7EB",borderRadius:5,color:"#6B7280",padding:"5px 9px",fontSize:11,cursor:"pointer",fontFamily:"inherit",flexShrink:0}}>ערוך</button>
                <button onClick={()=>disableItem(it.id)} title="כבה" style={{background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:5,color:"#991B1B",padding:"5px 9px",fontSize:11,cursor:"pointer",fontFamily:"inherit",flexShrink:0}}>כבה</button>
              </div>
            ))}
            <button onClick={openNew} style={{marginTop:6,padding:"8px 14px",background:"#F9FAFB",border:"1px dashed #D1D5DB",borderRadius:8,color:"#6B7280",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",width:"100%"}}>+ הוסף פריט</button>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:16}}>
              <button onClick={onClose} style={{padding:"9px 18px",background:"#F9FAFB",border:"1px solid #E5E7EB",borderRadius:8,color:"#6B7280",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>ביטול</button>
              <button onClick={()=>onSave(draft)} style={{padding:"9px 18px",background:"#111827",border:"none",borderRadius:8,color:"#FFFFFF",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>שמור</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Action sheet for marking an item ────────────────────────────────────────
function ItemActionSheet({ editItem, setEditItem, onClose, onSave }){
  const { item, statusEdit, noteEdit, photoEdit } = editItem;
  const setField = (k,v) => setEditItem(prev => ({...prev, [k]: v}));

  const handlePhoto = (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    if (f.size > 800_000) {
      if (!confirm(`התמונה גדולה (${Math.round(f.size/1024)}KB). להמשיך?`)) return;
    }
    const r = new FileReader();
    r.onload = () => setField("photoEdit", r.result);
    r.readAsDataURL(f);
  };

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:9999}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#FFFFFF",borderRadius:"16px 16px 0 0",padding:18,width:"100%",maxWidth:560,maxHeight:"85vh",overflowY:"auto"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <h3 style={{margin:0,fontSize:14,fontWeight:700,color:"#111827"}}>{item.title}</h3>
          <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:18,color:"#9CA3AF"}}>✕</button>
        </div>
        <div style={{fontSize:11,color:"#9CA3AF",marginBottom:14}}>
          {item.area} · {PRIORITY_META[item.priority].label}{item.requiresPhoto ? " · דורש צילום" : ""}{item.isRequired ? " · נדרש" : ""}
        </div>

        <div style={{fontSize:11,fontWeight:700,color:"#6B7280",marginBottom:6}}>סטטוס</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:6,marginBottom:14}}>
          {["done","not_done","issue","not_relevant","pending"].map(s => {
            const sm = ITEM_STATUS_META[s];
            const sel = statusEdit === s;
            return (
              <button key={s} onClick={() => setField("statusEdit", s)}
                style={{padding:"10px 12px",border:`1.5px solid ${sel ? sm.fg : "#E5E7EB"}`,background:sel?sm.bg:"#FFFFFF",color:sel?sm.fg:"#6B7280",borderRadius:8,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",textAlign:"right"}}>
                {sm.icon ? `${sm.icon} ` : ""}{sm.label}
              </button>
            );
          })}
        </div>

        <div style={{fontSize:11,fontWeight:700,color:"#6B7280",marginBottom:6}}>
          הערה {(statusEdit==="not_done" || statusEdit==="issue") && <span style={{color:"#DC2626"}}>·  חובה</span>}
        </div>
        <textarea value={noteEdit} onChange={e=>setField("noteEdit", e.target.value)}
          placeholder={statusEdit==="issue" ? "תיאור התקלה…" : "הערה אופציונלית"}
          style={{width:"100%",minHeight:60,padding:"8px 10px",border:"1px solid #E5E7EB",borderRadius:8,fontSize:12,fontFamily:"inherit",resize:"vertical",marginBottom:14}}/>

        {item.requiresPhoto && (
          <>
            <div style={{fontSize:11,fontWeight:700,color:"#6B7280",marginBottom:6}}>צילום {statusEdit==="done" && <span style={{color:"#DC2626"}}>· חובה</span>}</div>
            {photoEdit ? (
              <div style={{marginBottom:14}}>
                <img src={photoEdit} alt="" style={{maxWidth:"100%",maxHeight:180,borderRadius:8,border:"1px solid #E5E7EB"}}/>
                <button onClick={()=>setField("photoEdit","")} style={{marginTop:6,padding:"6px 12px",background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:6,color:"#991B1B",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>הסר</button>
              </div>
            ) : (
              <input type="file" accept="image/*" capture="environment" onChange={handlePhoto}
                style={{marginBottom:14,fontSize:12,fontFamily:"inherit"}}/>
            )}
          </>
        )}

        <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
          <button onClick={onClose} style={{padding:"9px 18px",background:"#F9FAFB",border:"1px solid #E5E7EB",borderRadius:8,color:"#6B7280",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>ביטול</button>
          <button onClick={onSave} style={{padding:"9px 18px",background:"#111827",border:"none",borderRadius:8,color:"#FFFFFF",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>שמור</button>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
// Template Editor — owner/manager only
// ═══════════════════════════════════════════════════════════════════════════
function ShiftChecklistEditor({ template, ctx, businesses, onClose, onSave }){
  const [draft, setDraft] = React.useState(() => JSON.parse(JSON.stringify(template || blankTemplate(ctx))));
  const [tab, setTab] = React.useState("daily"); // "daily" or DOW key
  const [editingItem, setEditingItem] = React.useState(null); // item or "new"
  const [dupOpen, setDupOpen] = React.useState(false);

  const archivedCount = draft.items.filter(it => !it.active).length;

  const persistItems = (items) => setDraft({...draft, items});

  const upsertItem = (it) => {
    const items = [...draft.items];
    const idx = items.findIndex(x => x.id === it.id);
    if (idx >= 0) items[idx] = { ...it, updatedAt: Date.now(), updatedBy: ctx.userId };
    else items.push({...it, updatedAt: Date.now(), updatedBy: ctx.userId});
    persistItems(items);
    setEditingItem(null);
  };

  const softDelete = (itemId) => {
    if (!confirm("להסיר את הפריט? יישמר ארכיון להיסטוריה.")) return;
    const items = draft.items.map(x => x.id === itemId
      ? {...x, active:false, archivedAt: Date.now(), archivedBy: ctx.userId}
      : x);
    persistItems(items);
  };

  const restore = (itemId) => {
    const items = draft.items.map(x => x.id === itemId
      ? {...x, active:true, archivedAt:null, archivedBy:null}
      : x);
    persistItems(items);
  };

  const move = (itemId, dir) => {
    // Build per-phase ordered list, swap with neighbor, rewrite sortOrder.
    const it = draft.items.find(x => x.id === itemId);
    if (!it) return;
    const bucket = draft.items.filter(x => x.active && x.checklistType === it.checklistType && x.scheduleType === it.scheduleType && (x.dayOfWeek||null) === (it.dayOfWeek||null))
      .sort((a,b) => a.sortOrder - b.sortOrder);
    const idx = bucket.findIndex(x => x.id === itemId);
    const swap = idx + dir;
    if (swap < 0 || swap >= bucket.length) return;
    const newOrder = [...bucket]; [newOrder[idx], newOrder[swap]] = [newOrder[swap], newOrder[idx]];
    const updated = draft.items.map(x => {
      const i = newOrder.findIndex(y => y.id === x.id);
      return i >= 0 ? {...x, sortOrder: i} : x;
