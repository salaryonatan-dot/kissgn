// LocationStep — interactive map (Leaflet) + hierarchical region checklist.
// Used as a step in SetupWizard, but standalone enough to drop into other
// settings screens later.
// ═══════════════════════════════════════════════════════════════════════════
function LocationStep({ lat, setLat, lon, setLon, regionIds, setRegionIds, subregionIds, setSubregionIds, onNext, onBack }) {
  const mapRef = useRef(null);
  const leafletMapRef = useRef(null);
  const markerRef = useRef(null);
  const [expandedRegions, setExpandedRegions] = useState({});
  const [autoSuggested, setAutoSuggested] = useState(null);

  useEffect(() => {
    let cancelled = false;
    const init = () => {
      if (cancelled) return;
      // Wait until Leaflet's CDN script has finished loading.
      if (typeof L === "undefined" || !mapRef.current) {
        setTimeout(init, 100);
        return;
      }
      if (leafletMapRef.current) return;
      const initialLat = lat || 32.0853;
      const initialLon = lon || 34.7818;
      const map = L.map(mapRef.current, { zoomControl: true }).setView([initialLat, initialLon], 9);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 18,
        attribution: "© OpenStreetMap",
      }).addTo(map);
      const marker = L.marker([initialLat, initialLon], { draggable: true }).addTo(map);
      leafletMapRef.current = map;
      markerRef.current = marker;
      const updatePos = (latLng) => {
        const newLat = Number(latLng.lat.toFixed(5));
        const newLon = Number(latLng.lng.toFixed(5));
        setLat(newLat); setLon(newLon);
        setAutoSuggested(findNearestSubRegion({ lat: newLat, lon: newLon }));
      };
      marker.on("dragend", () => updatePos(marker.getLatLng()));
      map.on("click", (e) => {
        marker.setLatLng(e.latlng);
        updatePos(e.latlng);
      });
      if (lat && lon) setAutoSuggested(findNearestSubRegion({ lat, lon }));
    };
    init();
    return () => { cancelled = true; };
  }, []);

  const useMyLocation = () => {
    if (!navigator.geolocation) {
      alert("הדפדפן לא תומך באיתור מיקום אוטומטי");
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const newLat = Number(pos.coords.latitude.toFixed(5));
        const newLon = Number(pos.coords.longitude.toFixed(5));
        setLat(newLat); setLon(newLon);
        if (markerRef.current && leafletMapRef.current) {
          markerRef.current.setLatLng([newLat, newLon]);
          leafletMapRef.current.setView([newLat, newLon], 12);
        }
        setAutoSuggested(findNearestSubRegion({ lat: newLat, lon: newLon }));
      },
      (err) => alert("איתור מיקום נכשל: " + err.message),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  };

  const acceptAutoSuggestion = () => {
    if (!autoSuggested) return;
    if (!subregionIds.includes(autoSuggested.id)) {
      setSubregionIds([...subregionIds, autoSuggested.id]);
    }
  };

  const toggleRegion = (rid) =>
    setRegionIds(regionIds.includes(rid) ? regionIds.filter(x=>x!==rid) : [...regionIds, rid]);
  const toggleSubregion = (sid) =>
    setSubregionIds(subregionIds.includes(sid) ? subregionIds.filter(x=>x!==sid) : [...subregionIds, sid]);
  const toggleExpand = (rid) =>
    setExpandedRegions(prev => ({ ...prev, [rid]: !prev[rid] }));

  const totalSelectedSubs = subregionIds.length +
    regionIds.reduce((sum, rid) => {
      const r = REGIONS_LIGHT.find(x => x.id === rid);
      return sum + (r ? r.sub.length : 0);
    }, 0);

  return (
    <>
      <div className="card card-p">
        <label className="label">איפה ממוקם העסק?</label>
        <p style={{color:"#6B7280",fontSize:12,margin:"0 0 10px"}}>
          לחץ על המפה או גרור את הסמן למיקום של העסק. זה ישמש למזג האוויר והצעת אזורי עורף.
        </p>
        <div ref={mapRef} style={{height:"260px",width:"100%",borderRadius:7,border:"1px solid #E5E7EB",marginBottom:10}}/>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",fontSize:12,color:"#6B7280"}}>
          <button className="btn btn-ghost" style={{padding:"6px 10px",fontSize:12}} onClick={useMyLocation}>
            📍 השתמש במיקום הנוכחי
          </button>
          <span style={{direction:"ltr"}}>{lat ? `${Number(lat).toFixed(4)}, ${Number(lon).toFixed(4)}` : "לא נבחר עדיין"}</span>
        </div>
        {autoSuggested && (
          <div style={{marginTop:10,padding:"10px 12px",background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:6,fontSize:13}}>
            <strong>המיקום הזה תואם לתת-גוש "{autoSuggested.name}"</strong>
            <span style={{color:"#6B7280"}}> ({autoSuggested.distanceKm.toFixed(1)} ק״מ)</span>
            {!subregionIds.includes(autoSuggested.id) && (
              <button className="btn btn-ghost"
                style={{marginRight:8,padding:"4px 10px",fontSize:12,fontWeight:500,color:"#1D4ED8"}}
                onClick={acceptAutoSuggestion}>
                סמן אותו ↓
              </button>
            )}
          </div>
        )}
      </div>

      <div className="card card-p">
        <label className="label">אזורי עורף לעקוב אחריהם</label>
        <p style={{color:"#6B7280",fontSize:12,margin:"0 0 10px"}}>
          סמן גושים שלמים, או הרחב ובחר תת-גושים ספציפיים. אפשר לסמן כמה גושים.
        </p>
        <div style={{maxHeight:"320px",overflowY:"auto",border:"1px solid #E5E7EB",borderRadius:7,padding:"4px 8px"}}>
          {REGIONS_LIGHT.map(r => {
            const isFullSelected = regionIds.includes(r.id);
            const expanded = expandedRegions[r.id];
            const subSelectedCount = r.sub.filter(s => subregionIds.includes(s.id)).length;
            return (
              <div key={r.id} style={{padding:"6px 0",borderBottom:"1px solid #F3F4F6"}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <input type="checkbox" checked={isFullSelected} onChange={() => toggleRegion(r.id)} style={{cursor:"pointer"}}/>
                  <button onClick={() => toggleExpand(r.id)}
                    style={{flex:1,background:"none",border:"none",textAlign:"right",cursor:"pointer",padding:"2px 0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontSize:14,fontWeight:isFullSelected?600:500,color:"#111827"}}>
                      {r.name}
                      {!isFullSelected && subSelectedCount > 0 && (
                        <span style={{fontSize:11,color:"#3B82F6",marginRight:6}}>({subSelectedCount} תת-גושים)</span>
                      )}
                    </span>
                    <span style={{fontSize:11,color:"#9CA3AF"}}>{expanded ? "▴" : "▾"} {r.description}</span>
                  </button>
                </div>
                {expanded && !isFullSelected && (
                  <div style={{marginTop:6,marginRight:24,paddingRight:8,borderRight:"2px solid #E5E7EB"}}>
                    {r.sub.map(s => (
                      <label key={s.id} style={{display:"flex",alignItems:"center",gap:6,padding:"3px 0",cursor:"pointer",fontSize:13,color:"#374151"}}>
                        <input type="checkbox" checked={subregionIds.includes(s.id)} onChange={() => toggleSubregion(s.id)}/>
                        {s.name}
                      </label>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
        <p style={{color:"#9CA3AF",fontSize:11,margin:"8px 0 0",textAlign:"left"}}>
          סה״כ נבחרו: {totalSelectedSubs} תת-גושים
        </p>
      </div>

      <button className="btn btn-primary btn-full" onClick={onNext}>המשך</button>
      <button className="btn btn-ghost btn-full" onClick={onBack}>חזרה</button>
    </>
  );
}

function SetupWizard({ initial, initialSuppliers, initialFixed, onComplete, onCancel, isFirstSetup=true }) {
  const [step, setStep] = useState(1);

  const [bizName,      setBizName]      = useState(initial.businessName || "");

  const [tLabor, setTLabor] = useState(initial.targets?.laborCostPct || 27);

  // Step 3 -- ספקים
  const [suppliers, setSuppliers] = useState(
    initialSuppliers.length > 0 ? initialSuppliers :
    [{ id: Date.now().toString(), name: "", category: "כללי", days: [] }]
  );
  const [newSupName, setNewSupName] = useState("");

  const [newSupDays, setNewSupDays] = useState([]);

  const [editingSupDays, setEditingSupDays] = useState([]);
  const [editingSupCat,  setEditingSupCat]  = useState("כללי");

  // Step 4 -- קבועות
  const [fixedList, setFixedList] = useState(initialFixed);

  // Step 5 -- מיקום ואזורי עורף (added in 2026-05 to feed the daily analytics builder)
  const [bizLat, setBizLat] = useState(initial.lat || null);
  const [bizLon, setBizLon] = useState(initial.lon || null);
  const [bizRegionIds, setBizRegionIds] = useState(initial.region_ids || []);

;

  const toggleDay = (d) => setNewSupDays(prev => prev.includes(d) ? prev.filter(x=>x!==d) : [...prev, d]);

  const addSupplier = () => {
    if(!newSupName.trim()) return;
    setSuppliers(prev => [...prev, { id: Date.now().toString(), name: newSupName.trim(), category: newSupCat, days: [...newSupDays] }]);
    setNewSupName(""); setNewSupCat("כללי"); setNewSupDays([]);
  };

  const removeSupplier = (id) => setSuppliers(prev => prev.filter(s=>s.id!==id));
  const saveEditedSupplier = async (updated) => {
    try {
      const uid = window.storage.getUid ? window.storage.getUid() : null;
      const bizId = uid ? sessionStorage.getItem("marjin_biz_"+uid) : null;
      if(!bizId) return;
      await window.storage.set(`biz:${bizId}:suppliers`, JSON.stringify(updated), true);

  const updateFixed = (id, field, val) => setFixedList(prev => prev.map(f => f.id===id ? {...f, [field]:field==="amount"?Number(val)||0:val} : f));

  // Step 6 -- owner account (was 5 before location step was added)

      if(!ownerName.trim()||!ownerUsername.trim()||!ownerEmail.trim()||!ownerPassword) return setOwnerErr("יש למלא את כל השדות כולל מייל");
      if(!/^[^@]+@[^@]+\.[^@]+$/.test(ownerEmail.trim())) return setOwnerErr("כתובת מייל לא תקינה");
      if(ownerPassword.length < 6) return setOwnerErr("סיסמה חייבת להיות לפחות 6 תווים");
      if(ownerPassword!==ownerPass2) return setOwnerErr("הסיסמאות אינן תואמות");
      setOwnerErr("");

    const cfg = {
      businessName: bizName.trim() || "המסעדה שלי",

      hasRoyalty,
      royaltyPct: hasRoyalty ? Number(royaltyPct)||0 : 0,
      targets: { salesGrowthPct:Number(tGrowth)||5, foodCostPct:Number(tFood)||33, laborCostPct:Number(tLabor)||27 },
      // Location + region selection consumed by the daily analytics cron
      // (lib/analytics/dailyBuilder.ts). Only included when actually picked,
      // so existing businesses that don't go through the new step keep
      // working with the Hadera defaults.
      lat: bizLat,

      region_ids: bizRegionIds,

            <div className="card card-p">
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:hasRoyalty?14:0}}>

        {/* ── STEP 6 (only for first setup): owner account ── */}
        {step===6 && isFirstSetup && (
          <>
            <div className="card card-p">

            <button className="btn btn-ghost btn-full" onClick={()=>setStep(5)}>חזרה</button>
          </>
        )}
      </div>
    </div>
  );
}

function BusinessSelector({ businesses, onSelect, onAdd, onDelete, userName, isSuperOwner, canAddBranch }) {

        <div style={{textAlign:"center",marginBottom:28}}>

            <span style={{color:"#fff",fontSize:16,fontWeight:700}}>M</span>
          </div>
          <h2 style={{margin:0,fontSize:17,fontWeight:700,color:"#111827"}}>בחר סניף</h2>
          <p style={{margin:"4px 0 0",color:"#9CA3AF",fontSize:12}}>שלום, {userName}</p>
        </div>
        {businesses.map(biz => (
          <div key={biz.id} style={{position:"relative",marginBottom:8}}>
            {confirmDelete === biz.id ? (
              <div style={{background:"#FEF2F2",border:"1px solid #FEE2E2",borderRadius:8,padding:"12px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>

                <div style={{display:"flex",gap:6}}>
                  <button onClick={()=>{ onDelete(biz.id); setConfirmDelete(null); }}
                    style={{padding:"5px 12px",background:"#DC2626",border:"none",borderRadius:6,color:"#fff",fontWeight:600,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>מחק</button>
                  <button onClick={()=>setConfirmDelete(null)}

              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <button onClick={(e) => { e.stopPropagation(); if(!ready) return; onSelect(biz.id); }}
                  style={{flex:1,padding:"14px 16px",background:"#F9FAFB",border:"1px solid #E5E7EB",borderRadius:8,cursor:ready?"pointer":"default",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"space-between",transition:"background 0.15s",opacity:ready?1:0.6}}>

                  <span style={{fontSize:12,color:"#9CA3AF"}}>←</span>
                </button>
                {isSuperOwner && (
                  <button onClick={()=>setConfirmDelete(biz.id)}
                    style={{padding:"8px 10px",background:"#FFFFFF",border:"1px solid #E5E7EB",borderRadius:8,color:"#9CA3AF",cursor:"pointer",fontSize:13,fontFamily:"inherit"}}><IcoTrash/></button>
                )}
              </div>
            )}
          </div>
        ))}
        {canAddBranch && (
          <button onClick={onAdd}
            style={{width:"100%",padding:"11px",background:"#FFFFFF",border:"1px dashed #D1D5DB",borderRadius:8,color:"#6B7280",fontWeight:500,fontSize:13,cursor:"pointer",fontFamily:"inherit",marginTop:4}}>
            + הוסף סניף חדש
          </button>
        )}
      </div>
    </div>
  );
}

// ─── Helper: suppliers expected on a given day-of-week ───────────────────────
function suppliersOnDay(dow, suppliers) {
  if (!Array.isArray(suppliers)) return [];
  return suppliers.filter(s => {
    if (!s || !Array.isArray(s.days)) return false;
    return s.days.includes(dow);
  });
}

          if(allowed !== null && allowed.length > 0) {
            // Will be applied after businesses are loaded -- store on user
            setLoggedInUser({...user, _allowedBizIds: allowed});
          }
          if(user._tenantId) {
            // Always reload businesses from the correct tenant on manual login
            // (don't trust stale in-memory state from a previous session)
            if(window.setTenantId) window.setTenantId(user._tenantId);
            const resolveAndSet = (bizList) => {
              if(!bizList || bizList.length === 0) return;
              const uid2 = window.storage.getUid?.();
              let target = bizList[0].id;
              try {
                const cached2 = uid2 ? sessionStorage.getItem("marjin_biz_" + uid2) : null;
                if(cached2 && bizList.find(b => b.id === cached2)) target = cached2;
              } catch(_){}
              setCurrentBizId(target);
            };
            // Force fresh load from RTDB (never use stale businesses state)
            window.storage.get("app-businesses", true).then(rb => {
              if(rb) {
                try {
                  const bizList = JSON.parse(rb.value);
                  setBusinesses(bizList);
                  resolveAndSet(bizList);
                } catch(_){}
              }
            }).catch(()=>{});
          } else if(businesses.length === 1) {
            setCurrentBizId(businesses[0].id);
          }
          if(user.role==="staff") setScreen("shifts");
        }}
      />
    );
  }

  // First login — complete profile (email + new password)
  if(loaded && loggedInUser && mustCompleteProfile) {
    return (
      <ProfileCompletionScreen
        user={loggedInUser}
        onComplete={async ({ email }) => {
          // Update user record in Firebase
          const updatedUser = { ...loggedInUser, email, mustCompleteProfile: false };
          const updatedUsers = appUsers.map(u =>
            u.id === loggedInUser.id ? updatedUser : u
          );
          setAppUsers(updatedUsers);
          setLoggedInUser(updatedUser);
          // Repair lookup paths on first login (members/roles/user_tenants are set by create-user API)
          if(loggedInUser.username && window._currentTenantId) {
            const uname = loggedInUser.username.toLowerCase();
            const tid   = window._currentTenantId;
            const uid   = loggedInUser.firebaseUid;
            try { await window._rtdbSet(`username_index/${uname}`, { tenantId: tid, email }); } catch(_) {}
            try { await window._rtdbSet(`tenants/${tid}/lookup/${uname}`, { email, firebaseUid: uid }); } catch(_) {}
          }
          try { await window.storage.set("app-users", JSON.stringify(updatedUsers), true); } catch(_) {}
          setMustCompleteProfile(false);
        }}
      />
    );
  }

  // First time setup -- only if truly no business (not just slow load on mobile)
  if(loaded && loggedInUser && businesses.length === 0 && !currentBizId) {
    return (
      <SetupWizard
        initial={businessConfig} initialSuppliers={[]} initialFixed={FIXED_EXPENSES_DEFAULT}
        onComplete={(cfg, sups, fixed, firstOwner) => { completeSetup(cfg, sups, fixed, firstOwner); }}
        onCancel={null} isFirstSetup={true}
      />
    );
  }

  // Business selector -- multiple businesses
  // Full-page selector only when no business selected yet
  if(loaded && loggedInUser && !currentBizId && businesses.length > 0) {
    return (
      <BusinessSelector
        businesses={allowedBusinesses}
        userName={loggedInUser.name}
        isSuperOwner={isSuperOwner}
        canAddBranch={isMasterOwner}

          setSetupDone(true);
          setCurrentBizId(id);
          setShowBizSelect(false);
          const uid = window.storage.getUid?.();
          if(uid) window._rtdbSet(`user_active_biz/${uid}`, id).catch(()=>{});
        }}
        onDelete={async (id) => {
          const updated = businesses.filter(b => b.id !== id);
          setBusinesses(updated);
          try { await window.storage.set("app-businesses", JSON.stringify(updated), true); } catch(_){}

        onAdd={() => { setCurrentBizId(null); setShowSetup(true); setShowBizSelect(false); }}
      />
    );
  }

  // Setup for this business
  // When switching business — skip all guards and show dashboard with modal
  if(showBizSelect && currentBizId) { /* fall through to main return with modal */ }
  else if(loaded && loggedInUser && currentBizId && (!setupDone || showSetup) && !showBizSelect) return (
    <SetupWizard
      initial={businessConfig}
      initialSuppliers={suppliers}
      initialFixed={fixedList}
      onComplete={async (wizardCfg, sups, fixed) => {
        // EDIT existing business — do NOT create new bizId
        // HF-1 R1: the wizard owns only some config keys. They are merged into the
        // CURRENT remote config inside an RTDB transaction (re-merged on every retry),
        // and the whole save is bound to ONE captured {tenantId, bizId, gen} through
        // explicit-tenant writes, with liveness + ownership checked before every write
        // and after every await. Local state changes only after the full sequence
        // succeeds; a failure or partial save keeps the wizard open (retry converges).
        const ctx = captureSelectionCtx();
        const token = {};
        setupEditOpRef.current = token;
        if (!ctx || ctx.bizId !== currentBizId || !isSelectionLive(ctx)) return;
        let out;
        try {
          out = await window.MarjinConfigMerge.runSetupWizardEditSave({
            selection: { isLive: (c) => isSelectionLive(c) },
            isCurrentOp: (t) => setupEditOpRef.current === t,
            mutateFor: (tenantId, key, fn) => window.storage.mutateFor(tenantId, key, fn),
            setFor: (tenantId, key, value) => window.storage.setFor(tenantId, key, value, true),
          }, { ctx, token, wizardCfg, suppliers: sups, fixed, businesses });
        } catch (_) {
          out = { status: "failed", stage: "unexpected", reason: "unexpected_error" };
        }
        if (out.status === "stale" || !isSelectionLive(ctx) || setupEditOpRef.current !== token) return;
        if (out.status !== "committed") {
          console.error("[setup] save failed:", out.stage, out.reason);
          alert(out.reason === "malformed_config"
            ? "הגדרות העסק השמורות פגומות — השינויים לא נשמרו כדי לא למחוק נתונים קיימים."
            : "השמירה לא הושלמה — השינויים לא נשמרו במלואם. האשף נשאר פתוח, נסה לשמור שוב.");
          return;
        }
        setupEditOpRef.current = null;
        setBusinessConfig(out.config);
        setBusinesses(out.businesses);
        setSuppliers(sups);
        if(fixed) setFixedList(fixed);
        setShowSetup(false);
        setSetupDone(true);
      }}
      onCancel={setupDone ? ()=>setShowSetup(false) : null}
      isFirstSetup={false}
    />
  );

  // Add new business (no currentBizId but user is logged in)
  // Add new business -- show setup whenever showSetup=true and logged in
  if(loaded && loggedInUser && showSetup && !showBizSelect) return (
    <SetupWizard
      initial={{businessName:"",rentPct:0,royaltyPct:0,hasRoyalty:false,targets:{salesGrowthPct:5,foodCostPct:33,laborCostPct:27}}}

  if(!showBizSelect && currentUser && screen !== "shifts" && screen !== "checklist" && !(currentUser.permissions||[]).includes(screen)) {

        </div>

            {!currentUser && (

                <button className="mhd-icon-btn" onClick={()=>setShowSetup(true)} title="הגדרות">

                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>

                    <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>

                    <div>

                      <div data-c1="fixed-modal-total" style={{fontSize:12,color:"#94A3B8",marginTop:3}}>קבועות + שכ״ד לחודש{finConfigured.status==="ready"&&finConfigured.basisLabel?` (${finConfigured.basisLabel})`:""}: <strong style={{color:"#1E293B"}}>{finConfigured.status==="ready"?finConfigured.text:"—"}</strong>{finConfigured.status==="ready"&&finConfigured.rentPctText!==null&&<span> + שכ״ד <strong style={{color:"#1E293B"}}>{finConfigured.rentPctText}</strong> ממחזור</span>}{finConfigured.status==="ready"&&finConfigured.royaltyText!==null&&<span> · תמלוגים: <strong style={{color:"#1E293B"}}>{finConfigured.royaltyText}</strong> ממחזור</span>}</div>

                    <button onClick={()=>setShowFixed(false)} style={{width:30,height:30,background:"#F1F5F9",border:"none",borderRadius:8,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:"#64748B"}}>

                      <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:f.rentPct||f.royaltyPct?0:8}}>

                          value={f.name}

                        <button onClick={()=>{const u=fixedList.map((x,j)=>j===i?{...x,disabled:!x.disabled}:x);setFixedList(u);persistFixed(u,captureSelectionCtx());}}
                          style={{padding:"6px 10px",background:"#F1F5F9",border:"none",borderRadius:7,fontSize:11,cursor:"pointer",color:"#64748B",fontFamily:"inherit",flexShrink:0,fontWeight:500}}>

                        {!f.rentPct&&!f.royaltyPct&&(
                          <button onClick={()=>{if(window.confirm(`למחוק "${f.name}"?`)){const u=fixedList.filter((_,j)=>j!==i);setFixedList(u);persistFixed(u,captureSelectionCtx());}}}
                            style={{padding:"6px 8px",background:"#FEF2F2",border:"none",borderRadius:7,cursor:"pointer",color:"#EF4444",flexShrink:0}}>
                            <svg width="12" height="12" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
                          </button>

                          <input style={{flex:1,border:"1px solid #E5E7EB",borderRadius:8,padding:"7px 10px",fontSize:13,fontFamily:"inherit",color:"#111827",background:"transparent"}}

                  <button onClick={()=>{const u=[...fixedList,{id:Date.now(),name:"הוצאה חדשה",amount:0,dueDay:1,rentPct:false}];setFixedList(u);persistFixed(u,captureSelectionCtx());}}
                    style={{width:"100%",padding:"12px",background:"#F8FAFC",border:"1px dashed #CBD5E1",borderRadius:12,color:"#64748B",fontSize:13,fontWeight:500,cursor:"pointer",fontFamily:"inherit",marginTop:8}}>

            {loggedInUser && (
              <div className="mhd-avatar" onClick={async()=>{
                  try { await window.firebaseSignOut(); } catch(_){}
                  setLoggedInUser(null);

                  try { sessionStorage.removeItem("marjin-session"); } catch(_){}
                  try { if(uid) sessionStorage.removeItem("marjin_tid_"+uid); } catch(_){}
                  try { if(uid) sessionStorage.removeItem("marjin_biz_"+uid); } catch(_){}
                  // Reset all app state so stale data from previous tenant doesn't persist
                  invalidateSelection(null, null); // R3: tenant reset/logout invalidates the selection synchronously

            {[

            if(suppliers.length===0) return <div className="empty"><p style={{color:"#9CA3AF"}}>אין ספקים מוגדרים</p></div>;

            const smDays = new Date(smY, smM, 0).getDate();
            const smLabel = new Date(smY, smM-1, 1).toLocaleDateString("he-IL",{month:"long",year:"numeric"});
            const prevMonth = () => { const d=new Date(smY,smM-2,1); setSupMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`); setExpandedSup(null); };
            const nextMonth = () => { const d=new Date(smY,smM,1); setSupMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`); setExpandedSup(null); };
            const canNext = supMonth < finTodayStr.slice(0, 7);
            const getSupPay = (supId, date) => {
              const e = entries.find(x=>x.date===date);
              return e?.supplier_payments?.[supId] || "";
            };
            // R3: the supplier grid executes the PRODUCTION seam — canonical-
            // optimistic state only (never a raw map/append), revert on
            // persistence failure, selection-bound, and the exact persisted
            // canonical array is what React state receives.
            const setSupPayDate = async (supId, date, val) => {
              // R6: entries-ONLY through the ONE destination lane. The result mutates the
              // visible supplier error ONLY through the ownership wrapper, which requires
              // the component mounted, the captured selection still live, AND this
              // submission's token still current — so an OLD-selection or superseded
              // result can never set/clear the CURRENT selection's error surface.
              const token = supplierResultOwnershipRef.current.begin(captureSelectionCtx());
              // R10: carry the row's stable id (when present) and the exact BASE value
              // the user edited from, so the remote transaction can detect a conflict.
              const __row = entries.find(e => window.MarjinEntries.entryDateKey(e && e.date) === window.MarjinEntries.entryDateKey(date)) || null;
              const __base = __row && __row.supplier_payments ? __row.supplier_payments[supId] : undefined;
              const res = await entriesWriteCoordRef.current.submitSupplierEdit({
                supId, date, val, emptyEntry: EMPTY_ENTRY,
                targetId: __row && __row.id != null ? __row.id : undefined,
                baseValue: __base, newId: newRowId(),
              });
              supplierResultOwnershipRef.current.settle(token, res, selectionCtrlRef.current, {
                setError: (msg) => setSupplierWriteError(msg || "שמירת התשלום לספק נכשלה. הערך מוצג אך לא נשמר — נסה שוב."),
                clearError: () => setSupplierWriteError(""),
              });
            };
            // C1 (S-03/S-04/S-05/U-05): month totals, shares and the top supplier are fields of the
            // selected month's report (purchases.bySource — includes deleted suppliers and legacy
            // food_cost rows). The grid below stays the operational first-row editor (S-06).
            const sv = finSup;
            const svReady = sv.status === "ready";
            const rowsOnDate = (date) => entries.filter(x => x && x.date === date).length;
            const knownSupIds = new Set(suppliers.map(x => String(x.id)));
            const extraSources = svReady ? sv.rows.filter(r => !(r.key.indexOf("supplier:") === 0 && knownSupIds.has(r.key.slice(9)))) : [];
            return (
              <div>
                {/* R5: visible supplier-write failure surface (latest live op only) */}
                {supplierWriteError&&(
                  <div role="alert" style={{background:"#FEF2F2",border:"1px solid #FECACA",color:"#B91C1C",borderRadius:12,padding:"10px 14px",marginBottom:12,fontSize:13,fontWeight:600,display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                    <span>{supplierWriteError}</span>
                    <button onClick={()=>setSupplierWriteError("")} style={{background:"none",border:"none",color:"#B91C1C",cursor:"pointer",fontSize:16,lineHeight:1,fontFamily:"inherit"}}>×</button>
                  </div>
                )}
                {/* Summary strip — total + food cost % + top supplier */}
                {!svReady&&(
                  <div data-c1="fin-unavailable" style={{background:"#F9FAFB",borderRadius:12,padding:"12px 16px",marginBottom:14,border:"1px solid #E5E7EB",fontSize:12,color:sv.status==="loading"?"#9CA3AF":"#92400E"}}>
                    {sv.status==="loading" ? "טוען סיכום קניות…" : "סיכום הקניות אינו זמין כעת — לא מוצגים סכומים ואחוזים."}
                  </div>
                )}
                {svReady&&sv.total.amount!==null&&(
                  <div data-c1="sup-summary" style={{background:"#EEF2FF",borderRadius:12,padding:"12px 16px",marginBottom:14,border:"1px solid #E0E7FF"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
                      <div>
                        <div style={{fontSize:11,color:"#818CF8",fontWeight:600,textTransform:"uppercase",letterSpacing:".4px",marginBottom:3}}>סה״כ קניות</div>
                        <div data-c1="sup-total" style={{fontSize:20,fontWeight:800,color:"#1E293B",letterSpacing:"-1px"}}>{sv.total.text}</div>
                      </div>
                      <div style={{textAlign:"left"}}>
                        <div style={{fontSize:11,color:"#818CF8",fontWeight:600,textTransform:"uppercase",letterSpacing:".4px",marginBottom:3}}>פוד קוסט</div>
                        <div data-c1="sup-pct" style={{fontSize:20,fontWeight:800,color:"#1E293B",letterSpacing:"-1px"}}>{sv.purchasesPct.text}</div>
                      </div>
                      {sv.top&&(
                        <div style={{textAlign:"left"}}>
                          <div style={{fontSize:11,color:"#818CF8",fontWeight:600,textTransform:"uppercase",letterSpacing:".4px",marginBottom:3}}>ספק מוביל</div>
                          <div style={{fontSize:13,fontWeight:700,color:"#1E293B"}}>{sv.top.name}</div>
                          <div style={{fontSize:11,color:"#64748B"}}>{sv.top.text} · {sv.top.pctText}</div>
                        </div>
                      )}
                    </div>
                    {sv.credits&&sv.credits.count>0&&(
                      <div data-c1="sup-gross-credits" style={{fontSize:11,color:"#475569",marginTop:6}}>
                        קניות {sv.gross.text} · זיכויים שהונפקו בחודש −{sv.credits.text} · נטו {sv.total.text}
                      </div>
                    )}
                    {sv.disclosure.incomplete&&<div data-c1="sup-credits-incomplete" style={{fontSize:11,color:"#DC2626",marginTop:6}}>{sv.disclosure.incomplete}</div>}
                    {sv.disclosure.negative&&<div data-c1="sup-net-negative" style={{fontSize:11,color:"#B45309",marginTop:6}}>{sv.disclosure.negative}</div>}
                    {sv.revenue.partial&&<div style={{fontSize:11,color:"#DC2626",marginTop:6}}>{window.MarjinC1.revenueDisclosure(sv.report).warning}</div>}
                  </div>
                )}
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,background:"#FFFFFF",borderRadius:8,padding:"10px 16px",border:"1px solid #E5E7EB"}}>
                  <button onClick={prevMonth} style={{background:"none",border:"none",fontSize:22,cursor:"pointer",color:"#6B7280",padding:"0 8px",lineHeight:1}}>‹</button>
                  <span style={{fontWeight:700,color:"#111827",fontSize:15}}>{smLabel}</span>
                  <button onClick={nextMonth} disabled={!canNext} style={{background:"none",border:"none",fontSize:22,cursor:"pointer",color:canNext?"#6B7280":"#D1D5DB",padding:"0 8px",lineHeight:1}}>›</button>
                </div>
                {/* ── ניהול ספקים: כפתור toggle (מורשים בלבד), בשורה נפרדת מעל רשימת הספקים ── */}
                {canReorderSuppliers && (
                  <div style={{display:"flex",justifyContent:"flex-end",marginBottom:12}}>
                    <button onClick={()=>setSupManageMode(m=>!m)}
                      style={{padding:"8px 16px",background:supManageMode?"#111827":"#F9FAFB",border:`1px solid ${supManageMode?"#111827":"#E5E7EB"}`,borderRadius:8,color:supManageMode?"#FFFFFF":"#374151",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                      {supManageMode ? "סיום" : "ניהול ספקים"}
                    </button>
                  </div>
                )}
                {supManageMode ? (
                  /* מצב ניהול: שם + קטגוריה + ▲▼ לסדר + chips לעריכת ימי אספקה (כולל שבת). ללא סכומים/inputs/expand. */
                  <div>
                    {suppliers.map((sup, supIndex) => {
                      const supDays = Array.isArray(sup.days) ? sup.days : [];
                      return (
                      <div key={sup.id} style={{padding:"12px 16px",marginBottom:6,background:"#FFFFFF",border:"1px solid #E5E7EB",borderRadius:8}}>
                        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
                          <div style={{minWidth:0,flex:1}}>
                            <div style={{fontSize:14,fontWeight:700,color:"#111827"}}>{sup.name}</div>
                            <div style={{fontSize:11,color:"#9CA3AF",marginTop:2}}>{sup.category}</div>
                          </div>
                          <div style={{display:"flex",flexDirection:"column",gap:2,flexShrink:0}}>
                            <button onClick={()=>moveSupplier(supIndex,-1)} disabled={supIndex===0} title="העלה"
                              style={{background:"none",border:"1px solid #E5E7EB",borderRadius:4,color:supIndex===0?"#D1D5DB":"#6B7280",cursor:supIndex===0?"default":"pointer",fontSize:12,lineHeight:1,padding:"4px 8px",fontFamily:"inherit"}}>▲</button>
                            <button onClick={()=>moveSupplier(supIndex,1)} disabled={supIndex===suppliers.length-1} title="הורד"
                              style={{background:"none",border:"1px solid #E5E7EB",borderRadius:4,color:supIndex===suppliers.length-1?"#D1D5DB":"#6B7280",cursor:supIndex===suppliers.length-1?"default":"pointer",fontSize:12,lineHeight:1,padding:"4px 8px",fontFamily:"inherit"}}>▼</button>
                          </div>
                        </div>
                        <div style={{marginTop:10}}>
                          <div style={{fontSize:11,color:"#6B7280",fontWeight:600,marginBottom:6}}>ימי אספקה</div>
                          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                            {DOW_LABELS.map((d,i)=>{
                              const on = supDays.includes(i);
                              return (
                                <button key={i} type="button" onClick={()=>toggleSupplierDay(sup.id,i)} title={DOW_NAMES[i]}
                                  style={{minWidth:34,padding:"6px 0",textAlign:"center",borderRadius:6,border:`1px solid ${on?"#111827":"#E5E7EB"}`,background:on?"#111827":"#FFFFFF",color:on?"#FFFFFF":"#6B7280",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{d}</button>
                              );
                            })}
                          </div>
                          {supDays.length===0 && <div style={{fontSize:10,color:"#9CA3AF",marginTop:6,lineHeight:1.5}}>אין ימי אספקה מתוכננים — עדיין אפשר להזין תשלום דרך ״יום אספקה לא מתוכנן״.</div>}
                        </div>
                      </div>
                      );
                    })}
                  </div>
                ) : (
                <>
                {suppliers.map((sup, supIndex) => {
                  const isOpen = expandedSup === sup.id;
                  const supRow = svReady ? (sv.bySupplierId[String(sup.id)] || null) : null;
                  const delivDays = Array.from({length:smDays},(_,i)=>{
                    const day=i+1;
                    const date=`${smY}-${String(smM).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
                    const dow=new Date(smY,smM-1,day).getDay();
                    // Planned delivery days come ONLY from sup.days (0=Sun..6=Sat, Saturday supported).
                    // Empty/missing days = no planned days. Saturday no longer skipped unconditionally;
                    // a payment on any unplanned date still surfaces via unplannedDays below.
                    if(!Array.isArray(sup.days) || !sup.days.includes(dow)) return null;
                    return {day,date,dow};
                  }).filter(Boolean);
                  // Bug fix (render-only): surface supplier payments saved on UNPLANNED
                  // dates (Saturdays, or days not in sup.days) so they appear in the list.
                  // Only real payments (numeric > 0) — a cleared/"0" value is not shown.
                  const plannedDates = new Set(delivDays.map(d=>d.date));
                  const unplannedDays = entries
                    .filter(e => e.date.startsWith(`${smY}-${String(smM).padStart(2,"0")}`)
                              && Number(e.supplier_payments?.[sup.id]) > 0
                              && !plannedDates.has(e.date))
                    .map(e => { const day=Number(e.date.slice(8,10)); return {day,date:e.date,dow:new Date(smY,smM-1,day).getDay(),unplanned:true}; });
                  const renderDays = [...delivDays, ...unplannedDays].sort((a,b)=>a.day-b.day);
                  return (
                    <div key={sup.id} style={{marginBottom:6,background:"#FFFFFF",border:"1px solid #E5E7EB",borderRadius:8,overflow:"hidden"}}>
                      <div onClick={()=>setExpandedSup(isOpen?null:sup.id)}
                        style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",cursor:"pointer",userSelect:"none"}}>
                        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                          <span style={{fontSize:14,fontWeight:700,color:"#111827"}}>{sup.name}</span>
                          <span className="badge badge-neutral">{sup.category}</span>
                          <span style={{fontSize:11,color:"#9CA3AF"}}>{sup.days.map(d=>DOW_NAMES[d]).join(" ")}</span>
                        </div>
                        <div style={{display:"flex",alignItems:"center",gap:10}}>
                          {supRow && (
                            <>
                              {supRow.credits!==null&&<span data-c1={"sup-row-credits-"+sup.id} style={{fontSize:11,color:"#64748B"}}>{supRow.grossText} − זיכויים {supRow.creditsText} =</span>}
                              <span data-c1={"sup-row-"+sup.id} style={{fontWeight:700,color:supRow.negative?"#B45309":"#111827",fontSize:14}}>{supRow.text}</span>
                              {supRow.pctText!=="—"&&<span style={{fontSize:11,fontWeight:600,color:"#818CF8",background:"#EEF2FF",padding:"2px 7px",borderRadius:999}}>{supRow.pctText}</span>}
                            </>
                          )}
                          <span style={{fontSize:16,color:"#9CA3AF",display:"inline-block",transition:"transform 0.2s",transform:isOpen?"rotate(180deg)":"none"}}>▾</span>
                        </div>
                      </div>
                      {isOpen && (
                        <div style={{borderTop:"1px solid #F1F5F9",padding:"14px 16px"}}>
                          {renderDays.length===0 && <p style={{color:"#9CA3AF",fontSize:13,margin:0}}>אין ימי אספקה בחודש זה</p>}
                          {renderDays.map(({day,date,dow,unplanned})=>{
                            const val=getSupPay(sup.id,date);
                            const paid=Number(val)>0;
                            return (
                              <div key={date} style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                                <div style={{minWidth:88}}>
                                  <div style={{fontSize:13,fontWeight:600,color:"#111827"}}>{DOW_NAMES[dow]} {day}/{smM}</div>
                                  {unplanned && <span style={{display:"inline-block",marginTop:2,fontSize:9,fontWeight:700,color:"#92400E",background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:99,padding:"1px 6px"}}>לא מתוכנן</span>}
                                  {rowsOnDate(date)>1 && <span data-c1="dup-rows" title="בתאריך זה נשמרו כמה שורות; התא מציג ועורך את הראשונה, הסכומים למעלה כוללים את כולן" style={{display:"inline-block",marginTop:2,fontSize:9,fontWeight:700,color:"#7C3AED",background:"#F5F3FF",border:"1px solid #DDD6FE",borderRadius:99,padding:"1px 6px"}}>({rowsOnDate(date)} שורות)</span>}
                                </div>
                                <input type="number" inputMode="decimal" placeholder="₪"
                                  value={val==="0"||val===0?"":val||""}
                                  onChange={e=>setSupPayDate(sup.id,date,e.target.value)}
                                  style={{flex:1,border:`1px solid ${paid?"#D1D5DB":"#E5E7EB"}`,borderRadius:6,padding:"8px 11px",fontSize:13,fontFamily:"inherit",color:"#111827",background:val==="0"||val===0?"#F9FAFB":paid?"#FFFFFF":"#FFFFFF",outline:"none"}}/>
                                {(val==="0"||val===0) && <span style={{color:"#9CA3AF",fontSize:13,flexShrink:0}}>—</span>}
                                {paid && val!=="0" && val!==0 && <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 7l3 3 6-6" stroke="#16A34A" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                                <button onClick={()=>setSupPayDate(sup.id,date,val==="0"||val===0?"":"0")}
                                  title={val==="0"||val===0?"בטל דילוג":"דלגתי"}
                                  style={{background:"none",border:"1px solid #E5E7EB",borderRadius:5,color:val==="0"||val===0?"#6B7280":"#9CA3AF",padding:"5px 9px",fontSize:11,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap",flexShrink:0}}>
                                  {val==="0"||val===0?"↩":"דלגתי"}
                                </button>
                              </div>
                            );
                          })}
                          <details style={{marginTop:8}}>
                            <summary style={{fontSize:12,color:"#9CA3AF",cursor:"pointer",listStyle:"none",padding:"4px 0"}}>יום אספקה לא מתוכנן</summary>
                            <div style={{marginTop:8,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                              <input type="date" id={`xd-${sup.id}`} style={{flex:"1 1 120px",border:"1px solid #D1D5DB",borderRadius:10,padding:"9px 12px",fontSize:13,fontFamily:"inherit",color:"#111827"}}/>
                              <input type="number" inputMode="decimal" placeholder="₪" id={`xa-${sup.id}`} style={{flex:"1 1 80px",border:"1px solid #D1D5DB",borderRadius:10,padding:"9px 12px",fontSize:14,fontFamily:"inherit",color:"#111827"}}/>
                              <button onClick={()=>{
                                const d=document.getElementById(`xd-${sup.id}`).value;
                                const a=document.getElementById(`xa-${sup.id}`).value;
                                if(d&&a){
                                  const existing=Number(getSupPay(sup.id,d))||0;
                                  const newVal=existing+Number(a);
                                  setSupPayDate(sup.id,d,String(newVal));
                                  document.getElementById(`xa-${sup.id}`).value="";
                                }}}
                                style={{background:"#111827",border:"none",borderRadius:6,color:"#fff",padding:"8px 13px",fontWeight:600,cursor:"pointer",fontFamily:"inherit",fontSize:12}}>הוסף</button>
                            </div>
                          </details>
                        </div>
                      )}
                    </div>
                  );
                })}
                {extraSources.length>0&&(
                  <div data-c1="sup-extra" style={{background:"#FFFFFF",borderRadius:8,padding:"10px 14px",marginTop:4,border:"1px dashed #E5E7EB"}}>
                    <div style={{fontSize:11,color:"#9CA3AF",marginBottom:6}}>רכש נוסף בחודש (ספקים שאינם ברשימה / רשומות ישנות)</div>
                    {extraSources.map(r=>(
                      <div key={r.key} style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"#374151",padding:"2px 0"}}>
                        <span>{r.name}</span><span>{r.text}{r.pctText!=="—"?` · ${r.pctText}`:""}</span>
                      </div>
                    ))}
                  </div>
                )}
                <div style={{background:"#F9FAFB",borderRadius:7,padding:"11px 14px",display:"flex",justifyContent:"space-between",marginTop:4,border:"1px solid #E5E7EB"}}>
                  <span style={{fontWeight:500,color:"#6B7280",fontSize:12}}>סה״כ רכש {smLabel}</span>
                  <span data-c1="sup-footer-total" style={{fontWeight:700,color:"#111827",fontSize:13}}>{svReady ? sv.total.text : "—"}</span>
                </div>
                </>
                )}
              </div>
            );
          })()}

          {/* ═══ P1: SUPPLIER CREDITS (זיכויי ספקים) — a credit is its own document, never a negative purchase ═══ */}
          {fcTab==="credits" && (()=>{
            const cv = finCredits;
            const [cY, cM] = supMonth.split("-").map(Number);
            const cLabel = new Date(cY, cM-1, 1).toLocaleDateString("he-IL",{month:"long",year:"numeric"});
            const cPrev = () => { const d=new Date(cY,cM-2,1); setSupMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`); };
            const cNext = () => { const d=new Date(cY,cM,1); setSupMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`); };
            const cCanNext = supMonth < finTodayStr.slice(0, 7);
            const field = (k) => ({ value: creditForm[k], onChange: (e) => { const val = e.target.value; setCreditForm((f) => ({ ...f, [k]: val })); } });
            const inp = {width:"100%",border:"1px solid #D1D5DB",borderRadius:8,padding:"9px 11px",fontSize:13,fontFamily:"inherit",color:"#111827",boxSizing:"border-box"};
            const err = (k) => creditErrors[k] ? <div data-p1={"err-"+k} style={{fontSize:11,color:"#DC2626",marginTop:3}}>{creditErrors[k]}</div> : null;
            return (
              <div data-p1="credits-tab">
                <div className="card card-p" style={{marginBottom:12,background:"#F8FAFC"}}>
                  <div style={{fontSize:12,color:"#475569",lineHeight:1.6}}>
                    זיכוי ספק נרשם כאן בלבד, כמסמך זיכוי — לא כקנייה שלילית. הזיכוי משויך לחודש של <strong>תאריך ההנפקה של מסמך הזיכוי</strong> ומקטין את הקניות נטו של הספק ואת עלות המזון באותו חודש, גם אם הוא מתייחס לחשבונית מחודש קודם. כל הסכומים לפני מע״מ.
                  </div>
                </div>
                {canWriteCredits && (
                  <div className="card card-p" data-p1="credit-form" style={{marginBottom:12}}>
                    <h3 className="sec-head" style={{margin:"0 0 10px"}}>{creditEditing ? "עריכת זיכוי (הזיכוי הקודם יסומן כמוחלף)" : "הוספת זיכוי ספק"}</h3>
                    {suppliers.length===0 ? <p style={{color:"#9CA3AF",fontSize:13,margin:0}}>אין ספקים מוגדרים</p> : (
                      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:10}}>
                        <label style={{fontSize:12,color:"#374151"}}>ספק
                          <select data-p1="credit-supplier" {...field("supplierId")} style={inp}>
                            <option value="">בחר ספק</option>
                            {suppliers.map(sp => <option key={sp.id} value={String(sp.id)}>{sp.name}</option>)}
                          </select>{err("supplierId")}
                        </label>
                        <label style={{fontSize:12,color:"#374151"}}>תאריך הנפקת מסמך הזיכוי
                          <input data-p1="credit-date" type="date" {...field("issueDate")} style={inp}/>{err("issueDate")}
                        </label>
                        <label style={{fontSize:12,color:"#374151"}}>סכום הזיכוי לפני מע״מ (₪)

                    <span style={{color:"#6B7280"}}>סה״כ עלות מעסיק ליום</span>

                </div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
                  {["גשם","חום קיצוני","אזעקות","מבצע צבאי","פיגוע","אחר"].map((tag)=>(
                    <button key={tag} onClick={()=>setForm(f=>({...f,weather_impact:f.weather_impact===tag?"":tag}))}
                      style={{padding:"5px 10px",borderRadius:8,border:`1px solid ${form.weather_impact===tag?"#DC2626":"#FECACA"}`,background:form.weather_impact===tag?"#DC2626":"#FEF2F2",color:form.weather_impact===tag?"#fff":"#DC2626",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
                      {tag}
                    </button>
                  ))}
                </div>
                <label style={{display:"flex",alignItems:"center",gap:8,fontSize:13,color:"#6B7280",cursor:"pointer"}}>
                  <input type="checkbox" checked={!!form.security_event} onChange={e=>setForm(f=>({...f,security_event:e.target.checked}))} style={{width:16,height:16}}/>
                  <span>יום שכלל אירוע ביטחוני / מלחמה</span>
                </label>
              </div>

            {!(weather?.alert||form.weather_impact||form.security_event) && (
              <button onClick={()=>setForm(f=>({...f,weather_impact:"אחר"}))}
                style={{width:"100%",background:"none",border:"1px dashed #D1D5DB",borderRadius:10,color:"#9CA3AF",padding:"8px",fontSize:12,cursor:"pointer",fontFamily:"inherit",marginBottom:8}}>

            )}
            <label className="label">הערות</label>
            <textarea className="input" style={{minHeight:52,resize:"vertical"}} placeholder="חריגות, אירועים..." value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))}/>

            {/* CD-M2: explicit "Business closed" action — the ONLY path that records a closure (CD-01/CD-17) */}
            {window.MarjinForecast.canEditException(loggedInUser?.role) && form.date && (()=>{
              const __cl = window.MarjinClosureLifecycle;
              const __closed = __cl.isActiveClosureState(exceptionOwnershipRef.current.getState(form.date));
              const __plan = __cl.planClosure(entries, form.date, { today: israelDateKey(0) });
              const __conflict = __closed && __plan.status === "ok" && __plan.needsConfirmation;
              const __dlg = closureDialog && closureDialog.date === form.date ? closureDialog.plan : null;
              const __dlgRows = closureDialog && closureDialog.date === form.date && Array.isArray(closureDialog.rows) ? closureDialog.rows : null;
              return (
                <div data-closure-panel="1" style={{marginTop:8,padding:"10px 12px",background:__closed?"#F1F5F9":"#FFFFFF",border:"1px solid #CBD5E1",borderRadius:8}}>
                  {__closed ? (
                    <div>
                      <div style={{fontSize:13,fontWeight:700,color:"#334155"}}>העסק מסומן כסגור ביום זה{__plan.status === "ok" && __plan.timing === "future" ? " (סגירה מתוכננת — תחזית ההכנסות ליום זה היא 0)" : ""}</div>
                      {__conflict && (
                        <div role="alert" style={{marginTop:6,padding:"8px 10px",background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:6,color:"#B91C1C",fontSize:12,fontWeight:600}}>
                          יום סגור עם הכנסות רשומות — הנתונים לתאריך זה מוצגים כלא תקינים עד שהסגירה תושלם או תבוטל.
                          <button className="btn btn-secondary" disabled={entrySaveInFlight} style={{marginTop:6,display:"block"}} onClick={()=>!entrySaveInFlight && closeBusinessDay(null)}>השלם סגירה (איפוס הכנסות)</button>
                        </div>
                      )}
                      <button className="btn btn-secondary" disabled={entrySaveInFlight} style={{marginTop:8}} onClick={()=>!entrySaveInFlight && reopenBusinessDay()}>ביטול סגירה</button>
                    </div>
                  ) : (
                    <button className="btn btn-secondary" disabled={entrySaveInFlight} onClick={()=>!entrySaveInFlight && closeBusinessDay(null)}>העסק היה סגור ביום זה</button>
                  )}
                  {__dlg && (
                    <div role="dialog" aria-label="אישור סגירה" style={{marginTop:8,padding:"10px 12px",background:"#FFF7ED",border:"1px solid #FDBA74",borderRadius:8,fontSize:12,color:"#7C2D12"}}>
                      <div style={{fontWeight:700,marginBottom:6}}>כבר נרשמו הכנסות לתאריך {__dlg.date}. סימון העסק כסגור יאפס אותן ל-0 (הוצאות לא ישתנו):</div>
                      {__dlg.rows.filter(p=>p.toZero.length>0).map(p=>(
                        <div key={p.id} style={{marginBottom:2}}>
                          {__cl.CLOSURE_REVENUE_FIELDS.filter(f=>p.toZero.indexOf(f)!==-1).map(f=>`${f==="sales"?"מכירות":f==="deliveries"?"משלוחים":"הכנסות אחרות"}: ${p.kinds[f]==="invalid"?`ערך לא תקין (${String(p.values[f])})`:fmt(p.values[f])}`).join(" · ")}
                        </div>
                      ))}
                      <div style={{fontWeight:700,marginTop:6}}>סה״כ הכנסות שיאופסו: {fmt(__dlg.displayTotal)}{__dlg.unreadableCells>0?` (+${__dlg.unreadableCells} ערכים לא תקינים)`:""}</div>
                      <div style={{display:"flex",gap:8,marginTop:8}}>
                        <button className="btn btn-primary" disabled={entrySaveInFlight} onClick={()=>!entrySaveInFlight && closeBusinessDay(__dlg.fingerprint, __dlgRows)}>אשר: העסק היה סגור ואפס הכנסות</button>
                        <button className="btn btn-secondary" disabled={entrySaveInFlight} onClick={()=>setClosureDialog(null)}>ביטול</button>
                      </div>
                    </div>
                  )}
                  {closureNotice && <div style={{marginTop:6,fontSize:12,color:"#166534"}}>{closureNotice}</div>}
                </div>
              );
            })()}

            {/* Exception-day control (REV_FORECAST/v1) — role-gated to super_owner/owner/manager.
                CD-M2: hidden while the date is closed; "closure" is recorded only by the action above. */}
            {window.MarjinForecast.canEditException(loggedInUser?.role) && !window.MarjinClosureLifecycle.isActiveClosureState(exceptionOwnershipRef.current.getState(form.date)) && (
              <div style={{marginTop:8,padding:"10px 12px",background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:8}}>
                <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,fontWeight:600,color:"#92400E"}}>
                  <input type="checkbox" checked={form.is_exception===true} onChange={e=>setForm(f=>({...f,is_exception:e.target.checked,...(e.target.checked?{}:{exception_reason:"",exception_note:""})}))}/>
                  יום חריג — לא לכלול בבסיס התחזית
                </label>
                {form.is_exception===true && (
                  <div style={{marginTop:8}}>
                    <select className="input" value={form.exception_reason||""} onChange={e=>setForm(f=>({...f,exception_reason:e.target.value}))}>
                      <option value="">בחר סיבה…</option>
                      {window.MarjinForecast.EXCEPTION_REASONS.filter(r=>r!==window.MarjinClosureLifecycle.CLOSURE_REASON_CODE).map(r=>(<option key={r} value={r}>{window.MarjinForecast.REASON_HE[r]}</option>))}
                    </select>
                    <textarea className="input" style={{marginTop:6,minHeight:40,resize:"vertical"}} placeholder="הערה ליום החריג" value={form.exception_note||""} onChange={e=>setForm(f=>({...f,exception_note:e.target.value}))}/>
                  </div>
                )}
              </div>
            )}

            {(()=>{
              // C1 (E-01): exactly what the save stores — the page VAT normalisation per field
              // (U01, retained), then the core's revenue fold of that row.
              if (!finF || !finEntryDate) return null;
              const net = window.MarjinVat.normalizeDailyEntryRevenueForVat({...form});
              const pv = window.MarjinC1.entryRevenuePreview(finF, net, finEntryDate);
              if (pv.status !== "ready" || pv.presence === "absent" || pv.text === null) return null;
              return (
                <div data-c1="entry-revenue-preview" style={{...S.preview,background:"#F9FAFB",border:"1px solid #E5E7EB",marginBottom:4}}>
                  <div className="flex jbet mb2"><span style={{fontWeight:600}}>סה״כ הכנסות{form.includeVat?" (נטו)":""}</span><span style={{color:pv.presence==="invalid"?"#DC2626":"#16A34A",fontWeight:700,fontSize:14}}>{pv.text}</span></div>
                </div>
              );
            })()}

            {entrySaveError && <div style={{background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:6,padding:"10px 14px",textAlign:"center",fontWeight:600,color:"#B91C1C",fontSize:13,marginBottom:8}}>{entrySaveError}</div>}
            {dashboardInsightsWarning && <div style={{background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:6,padding:"10px 14px",textAlign:"center",fontWeight:600,color:"#92400E",fontSize:13,marginBottom:8}}>{dashboardInsightsWarning}</div>}
            {saved && <div style={{background:"#F9FAFB",border:"1px solid #E5E7EB",borderRadius:6,padding:"10px 14px",textAlign:"center",fontWeight:600,color:"#16A34A",fontSize:13,marginBottom:8}}>נשמר בהצלחה</div>}
            <div style={{display:"flex",gap:10,marginTop:12}}>
              <button className="btn btn-primary" disabled={saved || entrySaveInFlight} style={{ opacity: (saved || entrySaveInFlight) ? 0.6 : 1}} onClick={()=>!(saved || entrySaveInFlight) && saveEntry()}>{entrySaveInFlight ? "שומר..." : saved ? "נשמר..." : "שמור"}</button>
              <button className="btn btn-secondary" disabled={entrySaveInFlight} style={{ opacity: entrySaveInFlight ? 0.6 : 1}} onClick={()=>{if(entrySaveInFlight)return;setForm({...EMPTY_ENTRY});setEditingId(null);editingDateRef.current=null;setEntryStep('idle');setScreen("dashboard");}}>ביטול</button>
            </div>
          </div>
        </div>
      )}

      {/* ═══ HISTORY ═══ */}
      {screen==="history" && (
        <div className="screen" style={{padding:"16px 20px 80px",background:"#F8FAFC",minHeight:"100vh"}}>
          {/* Header */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
            <div>
              <div style={{fontSize:15,fontWeight:700,color:"#0F172A",letterSpacing:"-.3px"}}>פדיון יומי יומית</div>
	              <div data-c1="hist-count" style={{fontSize:12,color:"#94A3B8",marginTop:3}}>{finHist.status==="ready" ? `${finHist.presentDays} ימים מוזנים (עד אתמול)` : "—"} · {MONTH_NAMES[Number(finTodayStr.slice(5,7))-1]}</div>
            </div>
            {entries.length>0&&(
              <button onClick={async ()=>{
                  if(!window.confirm("למחוק את כל הרשומות?")) return;
                  // R10 (R9-FIND-004): destructive clear-all is a DEDICATED typed
                  // operation carrying the fingerprint of the COMPLETE content the user
                  // just confirmed. If anything changed remotely after confirmation the
                  // transaction aborts, and the outcome is always surfaced.
                  const __res = await entriesWriteCoordRef.current.submitClearAll({
                    expectedNodeFingerprint: entriesWriteCoordRef.current.currentFingerprint(),
                    confirmToken: newRowId(),
                  });
                  const __st = __res && __res.status;
                  if (__st !== "committed" && __st !== "committed_idempotent") {
                    setEntrySaveError(__st === "blocked" && __res.reason === "precondition_failed"
                      ? "הנתונים השתנו מאז האישור — המחיקה בוטלה ולא בוצע שינוי."
                      : window.MarjinSaveLifecycle.describeSaveOutcome(__res || "failed", false));
                  }
                }}
                style={{background:"none",border:"none",color:"#CBD5E1",padding:"4px 8px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>
                מחק הכל
              </button>
            )}
          </div>

	          {(()=>{
	                const entriesByDate = new Map();
	                entries.forEach((e,i)=>{
	                  if(e?.date && e.date.startsWith(monthPrefix) && !entriesByDate.has(e.date)) {
	                    entriesByDate.set(e.date, {...e,_idx:i,__missing:false});
	                  }
	                });
	                // R10-GATE-015 (D-GAP-1): rows beyond the first for a business date are
	                // PRESERVED by R10 (never collapsed on write) but this list keeps only the
	                // first row per date, so a preserved duplicate was neither visible nor
	                // removable. Collect the extras per date; the day card lists them and offers
	                // an id-addressed, explicitly confirmed, single-row delete.
	                const dupExtras = new Map();
	                entries.forEach((e,i)=>{
	                  if(!(e?.date && e.date.startsWith(monthPrefix))) return;
	                  const head = entriesByDate.get(e.date);
	                  if(!head || head._idx === i) return;
	                  const list = dupExtras.get(e.date) || [];
	                  list.push({...e,_idx:i});
	                  dupExtras.set(e.date, list);
	                });
	                // C1 (H-02/H-06): the live business month, day 1 → today (Israel business date).
	                const today = finTodayStr;
	                const histDates = [];
	                for (let d = 1; d <= Number(today.slice(8)); d++) histDates.push(`${today.slice(0, 8)}${String(d).padStart(2, "0")}`);
	                const sorted = histDates.map(date => entriesByDate.get(date) || {...EMPTY_ENTRY,date,_idx:null,__missing:true,__key:`__missing__${date}`}).reverse();
	                const sevenDaysAgo = finF ? finF.finance.businessDate.addDays(today, -7) : today;
	                // C1 (H-03/H-04): status and amounts of a DAY (all rows folded, closures known) are the
	                // history view model's; the card keeps the first row only as its edit identity.
	                const hv = finHist;
	                const hvByDate = new Map(hv.status === "ready" ? hv.days.map(d => [d.date, d]) : []);
	                const getStatus = (e) => { const d = hvByDate.get(e.date); return d ? d.status : "unknown"; };

	                const StatusBadge = ({status}) => {
	                  const cfg = {
	                    complete: {bg:"#F0FDF4",color:"#15803D",border:"#BBF7D0",label:"הוזן מלא"},
	                    partial:  {bg:"#FFFBEB",color:"#B45309",border:"#FDE68A",label:"חסר נתונים"},
	                    invalid:  {bg:"#FEF2F2",color:"#B91C1C",border:"#FECACA",label:"ערך לא תקין"},
	                    missing:  {bg:"#FEF2F2",color:"#B91C1C",border:"#FECACA",label:"לא הוזן"},
	                    closed:   {bg:"#F1F5F9",color:"#475569",border:"#CBD5E1",label:"יום סגור"},
	                    contradiction: {bg:"#FEF2F2",color:"#B91C1C",border:"#FECACA",label:"סגור — נרשמו הכנסות"},
	                    unknown:  {bg:"#F8FAFC",color:"#94A3B8",border:"#E2E8F0",label:"—"},
	                  }[status] || {bg:"#F8FAFC",color:"#94A3B8",border:"#E2E8F0",label:"—"};
                  return (
                    <span style={{
                      fontSize:10,fontWeight:600,padding:"3px 8px",borderRadius:999,
                      background:cfg.bg,color:cfg.color,border:`1px solid ${cfg.border}`,
                      letterSpacing:.3,whiteSpace:"nowrap",
                    }}>{cfg.label}</span>
                  );
                };

	                const DayCard = ({e}) => {
	                  const i = e._idx;
	                  const isMissing = !!e.__missing;
	                  const dv = hvByDate.get(e.date) || null;
	                  const status = getStatus(e);
		                  const isToday = e.date === today;
		                  const dow = DOW_NAMES[finF ? finF.finance.businessDate.dowOf(e.date) : getDateDOW(e.date)];
		                  const openEntry = () => {
		                    const {_idx, __missing, __key, ...cleanEntry} = e;
		                    setForm(formWithException(isMissing ? {...EMPTY_ENTRY,date:e.date} : cleanEntry, e.date));
		                    setEditingId(isMissing ? null : i);
		                    editingDateRef.current = isMissing ? null : (window.MarjinEntries.entryDateKey(e.date)); // R2 stable edit identity
		                    setEntryStep('revenue');
		                    setScreen("entry");
	                  };

                  return (
                    <div style={{
                      background:"#FFFFFF",borderRadius:14,
                      border:"1px solid rgba(0,0,0,.05)",
                      padding:"16px 18px",marginBottom:8,
                      boxShadow:"0 1px 3px rgba(0,0,0,.04)",
                      transition:"box-shadow .2s ease",
                    }}>
                      {/* Row 1: date + status badge + actions */}
                      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
                        {/* Date block */}
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{display:"flex",alignItems:"center",gap:8}}>
                            <span style={{fontSize:13,fontWeight:700,color:"#0F172A"}}>{e.date}</span>
                            <span style={{fontSize:11,color:"#94A3B8"}}>{dow}</span>
                            {isToday&&<span style={{fontSize:10,fontWeight:600,color:"#6366F1",background:"#EEF2FF",padding:"2px 7px",borderRadius:999,border:"1px solid #C7D2FE"}}>היום</span>}
                          </div>
                          {/* Tags */}
	                          {(e.weather_impact||e.security_event||e.notes)&&(
	                            <div style={{display:"flex",gap:5,marginTop:5,flexWrap:"wrap"}}>
	                              {e.weather_impact&&<span style={{fontSize:10,background:"#FFF7ED",border:"1px solid #FED7AA",borderRadius:4,padding:"1px 6px",color:"#C2410C"}}>{e.weather_impact}</span>}
	                              {e.security_event&&<span style={{fontSize:10,background:"#F5F3FF",border:"1px solid #DDD6FE",borderRadius:4,padding:"1px 6px",color:"#7C3AED"}}>ביטחון</span>}
	                              {e.notes&&<span style={{fontSize:10,color:"#94A3B8",fontStyle:"italic",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:140}}>{e.notes}</span>}
	                            </div>
	                          )}
	                          {isMissing&&status!=="closed"&&<div style={{fontSize:10,color:"#B91C1C",marginTop:5}}>חסר — לא נשמרה רשומה ליום הזה</div>}
	                          {status==="closed"&&<div data-c1="hist-closed" style={{fontSize:10,color:"#475569",marginTop:5}}>יום סגור — הכנסה 0, לא חסר</div>}
	                          {isToday&&<div style={{fontSize:10,color:"#6366F1",marginTop:5}}>היום — מחוץ לבפועל (עד אתמול)</div>}
                        </div>
                        <StatusBadge status={status}/>
                      </div>

                      {/* Row 2: metrics */}
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:0,background:"#F8FAFC",borderRadius:8,overflow:"hidden",border:"1px solid #F1F5F9",marginBottom:12}}>
                        {[
                          {label:"הכנסות",  val:dv?dv.revenueText:"—",   color:"#1E293B", weight:700},
                          {label:"הוצאות",  val:dv?dv.expensesText:"—",  color:"#64748B", weight:500},
                          {label:"יתרה",    val:dv?dv.netText:"—",       color:dv&&dv.netNegative?"#B91C1C":"#15803D", weight:700},
                        ].map(({label,val,color,weight},mi)=>(
                          <div key={mi} style={{
                            padding:"10px 14px",
                            borderLeft:mi>0?"1px solid #E2E8F0":"none",
                          }}>
                            <div style={{fontSize:10,color:"#94A3B8",marginBottom:4,letterSpacing:.3,textTransform:"uppercase"}}>{label}</div>
                            <div style={{fontSize:14,fontWeight:weight,color,letterSpacing:"-.4px"}}>{val}</div>
                          </div>
                        ))}
                      </div>

                      {/* Row 3: actions */}
	                      <div style={{display:"flex",gap:8,alignItems:"center"}}>
	                        {!isMissing&&(
	                          <button
	                            onClick={openEntry}
	                            style={{
	                              padding:"6px 14px",background:"#F8FAFC",border:"1px solid #E2E8F0",
	                              borderRadius:8,fontSize:12,fontWeight:500,color:"#475569",
	                              cursor:"pointer",fontFamily:"inherit",transition:"all .15s",
	                            }}>
	                            ערוך
	                          </button>
	                        )}
	                        {!isMissing&&(status==="partial"||status==="invalid"||status==="contradiction")&&(
	                          <button
	                            onClick={openEntry}
	                            style={{
	                              padding:"6px 14px",background:"#FFFBEB",border:"1px solid #FDE68A",
                              borderRadius:8,fontSize:12,fontWeight:600,color:"#B45309",
                              cursor:"pointer",fontFamily:"inherit",
                            }}>
                            השלם נתונים
                          </button>
	                        )}
	                        {isMissing&&(
	                          <button
	                            onClick={openEntry}
	                            style={{
	                              padding:"6px 14px",background:"#FEF2F2",border:"1px solid #FECACA",
                              borderRadius:8,fontSize:12,fontWeight:600,color:"#B91C1C",
                              cursor:"pointer",fontFamily:"inherit",
                            }}>
	                            הזן נתונים
	                          </button>
	                        )}
	                        {!isMissing&&(
	                          <button
	                            onClick={()=>deleteEntryByDate(e.date)}
	                            style={{marginRight:"auto",background:"none",border:"none",color:"#CBD5E1",cursor:"pointer",padding:"4px 6px",fontFamily:"inherit",fontSize:12}}>
	                            מחק
	                          </button>
	                        )}
                      </div>

                      {/* R10-GATE-015 (D-GAP-1): preserved duplicate rows for this business
                          date. Individually addressable by immutable id — never by position —
                          and removable only by an explicit, confirmed, single-row action. */}
                      {!isMissing&&(dupExtras.get(e.date)||[]).length>0&&(
                        <div style={{marginTop:10,background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:8,padding:"8px 12px"}}>
                          <div style={{fontSize:11,fontWeight:700,color:"#B45309",marginBottom:6}}>
                            {(dupExtras.get(e.date)||[]).length+1} רשומות קיימות לתאריך זה — הסכומים בכרטיס כוללים את כולן; "ערוך" פותח את הראשונה
                          </div>
                          {(dupExtras.get(e.date)||[]).map(dup=>(
                            <div key={dup.id||dup._idx} style={{display:"flex",alignItems:"center",gap:8,fontSize:12,color:"#92400E",padding:"3px 0"}}>
                              <span style={{flex:1,minWidth:0}}>
                                {(()=>{ const rd = finF ? window.MarjinC1.rowDiagnostic(finF, dup) : null; return rd && rd.status==="ready" ? `שורה: הכנסות ${rd.revenueText} · עלות כ״א ${rd.payrollText}` : "שורה: —"; })()}
                              </span>
                              <button
                                onClick={()=>{ if(!window.confirm(`למחוק רשומה כפולה זו לתאריך ${e.date}? נמחקת רשומה אחת בלבד, והפעולה אינה ניתנת לביטול.`)) return; deleteEntryById(dup.id); }}
                                data-testid="dup-delete"
                                style={{background:"none",border:"1px solid #FDE68A",borderRadius:6,color:"#B91C1C",cursor:"pointer",padding:"2px 8px",fontFamily:"inherit",fontSize:11}}>
                                מחק רשומה זו
                              </button>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                };

                // Split into recent (7 days) and older
                const recent = sorted.filter(e=>e.date>=sevenDaysAgo);
                const older  = sorted.filter(e=>e.date<sevenDaysAgo);

                return (
                  <>
                    {hv.status!=="ready"&&(
                      <div data-c1="fin-unavailable" style={{background:"#FFFFFF",border:"1px solid #E5E7EB",borderRadius:12,padding:"12px 16px",marginBottom:14,fontSize:12,color:hv.status==="loading"?"#9CA3AF":"#92400E"}}>
                        {hv.status==="loading" ? "טוען נתונים כספיים…" : "הנתונים הכספיים אינם זמינים כעת — הסכומים והסטטוסים אינם מוצגים. ניתן עדיין לפתוח ולערוך ימים."}
                      </div>
                    )}
                    {hv.status==="ready"&&hv.disclosure.closures&&<div data-c1="closures" style={{fontSize:11,color:"#64748B",marginBottom:10}}>{hv.disclosure.closures}</div>}
                    {/* Stats summary strip */}
                    {(()=>{
	                      // C1 (U-1): counts of COMPLETED days (today excluded); closures are neither.
	                      const complete   = hv.status==="ready" ? String(hv.counts.complete) : "—";
	                      const incomplete = hv.status==="ready" ? String(hv.counts.incomplete) : "—";
                      return (
                        <div style={{display:"flex",gap:10,marginBottom:20}}>
                          {[
                            {label:"ימים שהוזנו",  val:complete,   color:"#15803D",bg:"#F0FDF4",border:"#BBF7D0"},
                            {label:"דורשים השלמה", val:incomplete, color:"#B45309",bg:"#FFFBEB",border:"#FDE68A"},
                          ].map(({label,val,color,bg,border},i)=>(

                      onClick={()=>{if(window.confirm(`למחוק "${f.name}"?`)){const u=fixedList.filter((_,j)=>j!==i);setFixedList(u);persistFixed(u,captureSelectionCtx());}}}
